name: validation-unavailable-gives-no-merge
description: >
  The worker's checkout under agents.dir names the repository only as its
  push URL; its fetch URL leads nowhere. The merge-result check finds the
  checkout but cannot fetch the base and the reviewed head into it:
  validation is unavailable, which refuses the merge rather than trusting an
  unchecked result. The approved pull request stays open and the merge API
  is never called.
  Moved from internal/loopworkflow TestWorkflow, case unavailable-validation.
issue: https://github.com/giantswarm/beekeeper/issues/3797
flow: merge
tags: [merge, merge-result, loop, github]
timeout: 90s

given:
  desk:
    config:
      supervisor: {reviewRounds: 1}
      # One watch reading admits the passes' starts for the whole scenario;
      # the budget is probed on the scenario's repository.
      watch: {interval: 1h}
      github: {probeRepo: example/app}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: The change}
  harness:
    workers:
      - name: app-1
        harness: claude
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the change", --body, "Closes #1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', desk review]
                dir: app
              - git: [remote, set-url, origin, /work/missing.git]
                dir: app
              - git: [remote, set-url, --push, origin, https://github.com/example/app.git]
                dir: app
      - name: 'Review app 2 r[0-9]+'
        harness: claude
        turns:
          - steps:
              - gh: [pr, view, '2', --repo, example/app, --json, headRefOid, --jq, .headRefOid]
                save: head
              - write: {path: review.md, content: "Desk review (opus): approved\nHead reviewed: `${head}`\n"}
              - gh: [pr, review, '2', --repo, example/app, --comment, --body-file, review.md]
              - beekeeper: [agents, idle, --done, --problem, none, --report, "Desk review (opus): approved\nHead reviewed: `${head}`"]
  calls:
    - program: journalctl
      respond: {stdout: ""}
    # No GitHub App login beside the gh login: the budget is gh's.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}

when:
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - events: {contains: [watch.budget-state], not_contains: [watch.budget-error]}
  # The loop's first pass: a park from before it would be left alone.
  - name: first
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - advance: 1m
  - name: start
    run:
      args: [--as, supervisor loop, agents, start, app-1, /work/worker.txt, --harness, claude, --model, sonnet]
    expect:
      - exit: 0
  - wait_for:
      timeout: 30s
      expect:
        - worker: {name: app-1, outcome: finish}
  - name: green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  - advance: 1m
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [supervisor.review]}
  - wait_for:
      timeout: 30s
      expect:
        - worker: {name: 'Review app 2 r1', outcome: finish}
  - advance: 1m
  - name: merge
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - output: {contains: [fetching merge-result refs]}

then:
  - github: {pull: {repo: example/app, number: 2, state: open}}
  - github: {issue: {repo: example/app, number: 1, state: open}}
  - calls: {program: gh, args: [pr, merge], max: 0}
  - events: {contains: [supervisor.failure], not_contains: [supervisor.merge]}
