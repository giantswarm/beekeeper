name: capacity-json-empty-desk
description: >
  capacity --json on an empty desk (no agents, no state) answers with a
  verdict and its worker ceiling, records no start and asks no external
  program.
flow: smoke
tags: [smoke, capacity]
timeout: 30s

when:
  - name: capacity
    run: {args: [capacity, --json]}

then:
  - exit: 0
  - json_path: {path: verdict, exists: true}
  - json_path: {path: workerCeiling, exists: true}
  - json_path: {path: headroom, exists: true}
  - events: {not_contains: [agents.start]}
  - calls: {max: 0}
