name: refill-starts-no-second-worker-after-a-continuation
description: >
  While a task's pull request is open, the refill starts no second worker
  for it, also after the loop continued the task itself. A headless worker
  parks on its pull request and leaves the roster; the item is free on the
  board again, and the open pull request is what keeps the refill from
  starting it. Red CI makes the loop start the worker's continuation, which
  pushes its fix and parks again. The next pass must review that head and
  start nobody else on the item. Today it starts a second worker: the
  loop's claim for the continuation still exempts the pull request from the
  start gate's duplicate check.
issue: https://github.com/giantswarm/beekeeper/issues/3831
pending: https://github.com/giantswarm/beekeeper/issues/3831
flow: duplicate-pr
tags: [duplicate-pr, refill, loop, continuation]
timeout: 120s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # Headless workers: a continuation is a fresh session's next turn.
      capacity:
        providers: {codex: {ceiling: 2}}
        choices: [{harness: codex, model: gpt-5.2-codex}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the worker's change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
          # The next session of the worker continues its branch and its
          # pull request: it pushes there and parks on it again.
          - steps:
              - git: [fetch, --quiet, origin]
                dir: app
              - write: {path: app/fix.txt, content: "the worker's fix\n"}
              - git: [add, fix.txt]
                dir: app
              - git: [commit, --quiet, -m, "fix: what the worker was told"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - advance: 2s
  - name: ci-red
    github: {check: {repo: example/app, pull: 2, name: build, state: red}}
  # The loop continues the task itself: the worker's next session.
  - name: red
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [supervisor.red]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, turns: 2, outcome: finish}
        - origin: {repository: example/app, branch: app-1, ahead: 2}
  - advance: 2s
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  # The fixed head gets its review. The item is free on the board and its
  # pull request is open: nobody else starts on it.
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [supervisor.review]}
      - output: {not_contains: ['"app 1" started on https://github.com/example/app/issues/1']}
  - name: roster
    run: {args: [agents, --json]}

then:
  # The reviewer is the only session: the worker's two sessions parked and
  # left, and no third one started.
  - {step: roster, exit: 0}
  - {step: roster, json_path: {path: ., len: 1}}
  - {step: roster, json_path: {path: '[0].name', equals: Review app 2 r1}}
  - github: {pull: {repo: example/app, number: 2, state: open}}
  - github: {issue: {repo: example/app, number: 1, state: open, pulls: 1, open_pulls: 1}}
  - calls: {program: gh, args: [pr, create], min: 1, max: 1}
