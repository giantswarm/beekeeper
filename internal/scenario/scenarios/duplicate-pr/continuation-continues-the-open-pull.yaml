name: continuation-continues-the-open-pull
description: >
  A continuation continues the open pull request of its task; it opens no
  second one. The review asks for changes. The loop forwards the findings
  to a fresh session of the worker, briefed with the pull request and its
  branch, and lets it start although the task's pull request is open. That
  session pushes its fix to the same branch and parks on the same pull
  request, which is merged once green: one pull request for the task.
issue: https://github.com/giantswarm/beekeeper/issues/3793
flow: duplicate-pr
tags: [duplicate-pr, delivery, loop, review, continuation]
timeout: 180s
control:
  none: states the duplicate pull request prevention main already has; this change only adds the scenario

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # Headless workers: a continuation is a fresh session's next turn.
      capacity:
        providers: {codex: {ceiling: 2}}
        choices: [{harness: codex, model: gpt-5.2-codex}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the worker's change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
          # The continuation: its brief names the open pull request and its
          # branch, and it pushes there.
          - steps:
              - run: [sh, -c, 'for f in /work/state/supervisor-loop/forward-*.md; do while IFS= read -r line; do case "$line" in *"the findings on https://github.com/example/app/pull/2 (branch app-1 at head "*) exit 0;; esac; done < "$f"; done; exit 1']
              - git: [fetch, --quiet, origin]
                dir: app
              - write: {path: app/fix.txt, content: "the fix of the findings\n"}
              - git: [add, fix.txt]
                dir: app
              - git: [commit, --quiet, -m, "fix: the review's findings"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
      - name: 'Review app 2 r\d+'
        turns:
          - steps:
              - gh: [pr, view, '2', --repo, example/app, --json, headRefOid, --jq, .headRefOid]
                save: head
              - gh: [pr, review, '2', --repo, example/app, --comment, --body, "Desk review (opus): changes requested\nHead reviewed: `${head}`\nchange.txt:1: the change is incomplete → add the fix"]
              - beekeeper: [agents, idle, --done, --report, "Desk review (opus): changes requested https://github.com/example/app/pull/2", --problem, none]
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - advance: 2s
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.park, supervisor.review], not_contains: [session.report-rejected]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'Review app 2 r1', outcome: finish}
  - advance: 2s
  # The findings go to a fresh session of the worker, which starts although
  # the task's pull request is open.
  - name: forward
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - output: {contains: ["SUPERVISOR FORWARD"]}
      - events: {contains: [supervisor.forward]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, turns: 2, outcome: finish}
        - origin: {repository: example/app, branch: app-1, ahead: 2}
  - advance: 2s
  - name: ci-green-again
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  # The change-request round is used: the head with the fixes gets the go.
  - name: go
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - github: {pull: {repo: example/app, number: 2, state: merged}}
  - advance: 2s
  - name: end
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0

then:
  - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - github: {issue: {repo: example/app, number: 1, state: closed, pulls: 1, open_pulls: 0}}
  - calls: {program: gh, args: [pr, create], min: 1, max: 1}
  - calls: {program: gh, args: [pr, merge], min: 1, max: 1}
  - events: {contains: [supervisor.review, supervisor.forward, supervisor.merge, supervisor.end], not_contains: [session.report-rejected]}
