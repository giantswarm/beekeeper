name: approved-head-merges-as-is-after-main-moved
description: >
  The loop merges the approved head as it is. The one reviewer fixes its
  finding on the branch and approves the head it pushed. Then main moves
  on: another pull request merges. Nobody updates the branch: no merge of
  main into it, no rebase, no update-branch call and no session woken for
  it, so no CI runs again on the branch. The loop gives the green approved
  head its go, the merge-result check against the moved main is the gate,
  and the head merges with no second review.
issue: https://github.com/giantswarm/beekeeper/issues/3862
flow: merge-result
tags: [merge-result, loop, review, merge]
timeout: 150s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # Headless workers: a continuation is a fresh session's next turn.
      capacity:
        providers: {codex: {ceiling: 2}}
        choices: [{harness: codex, model: gpt-5.2-codex}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the worker's change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
      # The reviewer fixes its finding on the branch in a checkout of its
      # own, pushes one commit and approves the head it pushed.
      - name: 'Review app 2 r\d+'
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, review]
              - git: [checkout, --quiet, app-1]
                dir: review
              - write: {path: review/review-fix.txt, content: "the reviewer's fix of its finding\n"}
              - git: [add, review-fix.txt]
                dir: review
              - git: [commit, --quiet, -m, "fix: the desk review's finding"]
                dir: review
              - git: [push, --quiet, origin, 'HEAD:refs/heads/app-1']
                dir: review
              - git: [rev-parse, HEAD]
                dir: review
                save: head
              - gh: [pr, review, '2', --repo, example/app, --comment, --body, "Desk review (opus): approved\nHead reviewed: `${head}`\n\nchange.txt:1: the change lacked its fix → fixed in the pushed commit"]
              - beekeeper: [agents, idle, --done, --report, "Desk review (opus): approved https://github.com/example/app/pull/2", --problem, none]
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - advance: 2s
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.park, supervisor.review], not_contains: [session.report-rejected]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'Review app 2 r1', outcome: finish}
        # The worker's commit and the reviewer's fix.
        - origin: {repository: example/app, branch: app-1, ahead: 2}
  - advance: 2s
  # Main moves on after the approval: another pull request merged.
  - name: main-moves
    github: {push: {repo: example/app, branch: main, file: other.txt, content: "another pull request's change\n"}}
  - advance: 2s
  - name: ci-green-on-the-fix
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
    expect:
      # The branch is behind main and stays so: the worker's commit and the
      # reviewer's fix, no merge of main.
      - origin: {repository: example/app, branch: app-1, ahead: 2}
      - github: {pull: {repo: example/app, number: 2, state: open, checks: green}}
  - name: go
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - github: {pull: {repo: example/app, number: 2, state: merged}}
  - advance: 2s
  - name: end
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0

then:
  - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - github: {issue: {repo: example/app, number: 1, state: closed, pulls: 1, open_pulls: 0}}
  # Nobody updated the branch: no update-branch call, no session woken.
  - github: {calls: {path: 'repos/example/app/pulls/2/update-branch', max: 0}}
  - worker: {name: app 1, turns: 1}
  - worker: {name: 'Review app 2 r\d+', turns: 1, outcome: finish}
  - calls: {program: gh, args: [pr, merge, --match-head-commit], min: 1, max: 1}
  - events: {contains: [supervisor.review, merge.authorized, supervisor.merge, supervisor.end], not_contains: [supervisor.forward, supervisor.rework, merge.failed, session.report-rejected]}
