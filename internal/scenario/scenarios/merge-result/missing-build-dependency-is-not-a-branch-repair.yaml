name: missing-build-dependency-is-not-a-branch-repair
description: >
  A merge-result check that fails only because the checker host lacks a
  native build dependency of the repository is an environment finding, and
  the pull request's own checks stand. The approved head is green, but its
  base moved on, so the gate tests base plus head on the desk host, where
  the cgo build stops on a missing system header the repository's CI has:
  golangci-lint reports it as a new typecheck finding, go test as a build
  failure. The loop files the finding once as the checker's environment, retries
  nothing, hands nothing back to the worker, and merges the head.
issue: https://github.com/giantswarm/beekeeper/issues/3892
flow: merge-result
tags: [merge-result, loop, merge, gate, environment]
timeout: 150s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # Headless workers: a continuation is a fresh session's next turn.
      capacity:
        providers: {codex: {ceiling: 2}}
        choices: [{harness: codex, model: gpt-5.2-codex}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  tools: [go, golangci-lint]
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          # A Go module: the merge result of a Go repository is linted and
          # tested when its base moved on.
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/go.mod, content: "module example.invalid/app\n\ngo 1.26\n"}
              - write: {path: app/b.go, content: "package app\n\nvar B = 1\n"}
              # A cgo binding to a system library: its header is a package
              # of the build host, never a file of the repository.
              - write: {path: app/midi.go, content: "package app\n\n// #cgo LDFLAGS: -lasound\n// #include <alsa/asoundlib.h>\nimport \"C\"\n"}
              - git: [add, go.mod, b.go, midi.go]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
      - name: 'Review app 2 r\d+'
        turns:
          - steps:
              - gh: [pr, view, '2', --repo, example/app, --json, headRefOid, --jq, .headRefOid]
                save: head
              - gh: [pr, review, '2', --repo, example/app, --comment, --body, "Desk review (opus): approved\nHead reviewed: `${head}`"]
              - beekeeper: [agents, idle, --done, --report, "Desk review (opus): approved https://github.com/example/app/pull/2", --problem, none]
  calls:
    # Lint type-checks the merge result before go test: on the desk host the
    # cgo package stops on the missing header, which golangci-lint reports as
    # a typecheck finding quoting go's build output. The base, without the
    # cgo package, has no finding, so the finding is new.
    - program: golangci-lint
      args: [run, --output.json.path=stdout]
      times: 1
      respond:
        stdout: '{"Issues":[{"FromLinter":"typecheck","Text":": # example.invalid/app\n# [example.invalid/app]\n./midi.go:4:10: fatal error: alsa/asoundlib.h: No such file or directory\n    4 | // #include <alsa/asoundlib.h>\n      |          ^~~~~~~~~~~~~~~~~~\ncompilation terminated.","SourceLines":["package app"],"Pos":{"Filename":"b.go","Line":1,"Column":0}}]}'
    - program: golangci-lint
      args: [run, --output.json.path=stdout]
      respond: {stdout: '{"Issues":[]}'}
    - program: golangci-lint
      args: [run]
      respond:
        stdout: "b.go:1: : # example.invalid/app\n# [example.invalid/app]\n./midi.go:4:10: fatal error: alsa/asoundlib.h: No such file or directory\ncompilation terminated. (typecheck)\npackage app\n1 issues:\n* typecheck: 1\n"
        exit: 1
    # The desk host has no ALSA development headers.
    - program: go
      args: [test, -short, ./...]
      respond:
        stdout: "# example.invalid/app\nmidi.go:4:10: fatal error: alsa/asoundlib.h: No such file or directory\n    4 | #include <alsa/asoundlib.h>\n      |          ^~~~~~~~~~~~~~~~~~\ncompilation terminated.\nFAIL\texample.invalid/app [build failed]\nFAIL\n"
        exit: 1
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - advance: 2s
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  # The park is the request for the review, the head is green: the reviewer
  # starts.
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.park, supervisor.review], not_contains: [session.report-rejected]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'Review app 2 r1', outcome: finish}
  - advance: 2s
  # The base moves on after the approval: the reviewed head no longer
  # contains it, and its own green checks say nothing about the two
  # together.
  - name: base-moves
    github: {push: {repo: example/app, branch: main, file: a.go, content: "package app\n\nvar A = 2\n"}}
  - advance: 2s
  - name: go
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - github: {pull: {repo: example/app, number: 2, state: merged}}
  - name: finding
    run: {args: [log, --verb, supervisor.file, --json]}
    expect:
      - exit: 0
      - output: {contains: ["Merge-result check environment failed", "alsa/asoundlib.h", "not a branch repair", "own checks stand"]}
  - name: failed
    run: {args: [log, --verb, merge.failed, --json]}
    expect:
      - exit: 0
      - output: {not_contains: ["branch repair requested", "failed golangci-lint", "failed go test"]}
  - advance: 2s
  - name: end
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0

then:
  - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - github: {issue: {repo: example/app, number: 1, state: closed}}
  # Lint compared the merge result with the base, and the test ran once:
  # no retry provides a missing system header.
  - calls: {program: golangci-lint, args: [run, --output.json.path=stdout], min: 2, max: 2}
  - calls: {program: go, args: [test, -short, ./...], min: 1, max: 1}
  - calls: {program: gh, args: [pr, merge, --match-head-commit], min: 1, max: 1}
  # No repair is asked of the worker: no repair stage opens.
  - events: {contains: [merge.authorized, merge.finished, supervisor.merge, supervisor.file], not_contains: [merge.failed, supervisor.stage]}
