name: a-real-conflict-is-repaired-once
description: >
  Only a real conflict is repaired on the branch, once. The one review
  approves the head the worker parked on. Then main moves with a change
  to the same file, and GitHub reports the pull request as conflicting.
  The loop hands the branch back to its reviewer for the repair, once: the
  reviewer merges main, resolves the conflict, pushes and parks. The
  approval stays the pull request's one review: no second review starts,
  and once the repaired head is green the loop merges it.
issue: https://github.com/giantswarm/beekeeper/issues/3862
flow: merge-result
tags: [merge-result, loop, review, merge, conflict]
timeout: 180s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # Headless workers: a continuation is a fresh session's next turn.
      capacity:
        providers: {codex: {ceiling: 2}}
        choices: [{harness: codex, model: gpt-5.2-codex}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the worker's change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
      - name: 'Review app 2 r\d+'
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, review]
              - git: [checkout, --quiet, app-1]
                dir: review
              - gh: [pr, view, '2', --repo, example/app, --json, headRefOid, --jq, .headRefOid]
                save: head
              - gh: [pr, review, '2', --repo, example/app, --comment, --body, "Desk review (opus): approved\nHead reviewed: `${head}`"]
              - beekeeper: [agents, idle, --done, --report, "Desk review (opus): approved https://github.com/example/app/pull/2", --problem, none]
          # The repair the loop asks for: main merged into the branch, its
          # conflict resolved with both sides' lines, pushed and parked on.
          - steps:
              - git: [fetch, --quiet, origin]
                dir: review
              - git: [merge, --quiet, --no-edit, origin/main]
                dir: review
                exit: 1
              - write: {path: review/change.txt, content: "the worker's change\nmain's change\n"}
              - git: [add, change.txt]
                dir: review
              - git: [commit, --quiet, --no-edit]
                dir: review
              - git: [push, --quiet, origin, app-1]
                dir: review
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: review
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - advance: 2s
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.park, supervisor.review], not_contains: [session.report-rejected]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'Review app 2 r1', outcome: finish}
  - advance: 2s
  # Main moves with a change to the same file: a real conflict.
  - name: main-conflicts
    github: {push: {repo: example/app, branch: main, file: change.txt, content: "main's change\n"}}
  - advance: 2s
  # The approved head cannot merge: its branch goes back to its reviewer for
  # the repair.
  - name: go
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - github: {pull: {repo: example/app, number: 2, state: open}}
  # The finished review report retires before the reviewer's repair turn.
  - advance: 2s
  - name: repair
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'Review app 2 r1', turns: 2, outcome: finish}
        # The worker's commit and the merge that resolved the conflict.
        - origin: {repository: example/app, branch: app-1, ahead: 2}
  - advance: 2s
  - name: ci-green-on-the-repair
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  # The repaired head merges on the one approval: no second review.
  - name: go-repaired
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - github: {pull: {repo: example/app, number: 2, state: merged}}
  - advance: 2s
  - name: end
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0

then:
  - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - github: {issue: {repo: example/app, number: 1, state: closed, pulls: 1, open_pulls: 0}}
  # Exactly one repair of the branch, one review verdict, no branch update
  # by anyone else.
  - worker: {name: app 1, turns: 1}
  - worker: {name: 'Review app 2 r\d+', turns: 2, outcome: finish}
  - github: {calls: {path: 'repos/example/app/pulls/2/update-branch', max: 0}}
  - calls: {program: gh, args: [pr, merge], min: 1, max: 1}
  - events: {contains: [supervisor.review, merge.authorized, supervisor.merge, supervisor.end], not_contains: [session.report-rejected]}
