name: stalled-board-item-bypasses-only-pace
description: >
  An In Progress P1 has no worker because the subscription is ahead of pace.
  Separate loop processes observe it at zero, 29 and 30 minutes. Only at
  30 minutes does its worker start. A Ready item stays held by pace, and
  another pass starts no duplicate. The exception never changes provider policy.
issue: https://github.com/giantswarm/beekeeper/issues/4003
flow: regression
tags: [regression, loop, progress, capacity]
timeout: 120s

given:
  desk:
    config:
      github: {probeRepo: example/app}
      board:
        order:
          - {name: progress, status: [In Progress]}
          - {name: ready, status: [Ready]}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: 'P1: Resume delivery', board: In Progress}
          - {number: 2, title: Later work, board: Ready}
  harness:
    usage:
      claude: {session: 10, week: 77}
    workers:
      - name: app 1
        turns:
          - outcome: hang
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ''}

when:
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - worker: {name: app 1, turns: 0}
  - advance: 29m
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - worker: {name: app 1, turns: 0}
  - advance: 1m
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [supervisor.board-progress]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, turns: 1, running: true}
  - run: {args: [supervisor, loop, --once]}
  - run: {args: [capacity, pick, --json]}
    expect:
      - exit: 0
      - json_path: {path: pick, equals: none}
      - output: {contains: [ahead of pace]}

then:
  - worker: {name: app 1, turns: 1}
  - worker: {name: app 2, turns: 0}
  - calls: {program: claude, args: [--bg, --remote-control], min: 1, max: 1}
  - events: {not_contains: [capacity.pace.off]}
