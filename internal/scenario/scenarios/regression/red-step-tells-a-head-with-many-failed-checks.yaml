name: red-step-tells-a-head-with-many-failed-checks
description: >
  A head with many failed checks gets its red step. The worker parks its
  pull request for the desk review and eleven checks with CI-length names
  conclude red on its head. The red step writes the worker's brief under a
  file name the file system takes, although the names of the checks
  together pass its 255 bytes: the loop tells the worker every red check,
  starts no reviewer, and the worker's next session continues its pull
  request.
issue: https://github.com/giantswarm/beekeeper/issues/3666
flow: regression
tags: [regression, loop, ci, red]
timeout: 120s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # Headless workers: a continuation is a fresh session's next turn.
      capacity:
        providers: {codex: {ceiling: 2}}
        choices: [{harness: codex, model: gpt-5.2-codex}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the worker's change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
          # The red step's wake: the worker's next session fixes its pull
          # request and parks on it again.
          - steps:
              - git: [fetch, --quiet, origin]
                dir: app
              - write: {path: app/fix.txt, content: "the worker's fix\n"}
              - git: [add, fix.txt]
                dir: app
              - git: [commit, --quiet, -m, "fix: the red checks"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - advance: 2s
  # Eleven checks fail on the parked head; their names together pass the
  # 255 bytes of a file name.
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: go-build', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: test-envtest', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: test-large-history', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: test-loop-workflow', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: test-scenarios', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: test-integration', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: lint-golangci', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: govulncheck', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: build-and-push-image', state: red}}
  - github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: push-to-app-catalog', state: red}}
  - name: ci-red
    github: {check: {repo: example/app, pull: 2, name: 'ci/circleci: colour-gate-on-decoded-video', state: red}}
    expect:
      - github: {pull: {repo: example/app, number: 2, state: open, checks: red}}
  # The red step runs: the worker is told every red check, no reviewer
  # starts.
  - name: red
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - output: {contains: ["SUPERVISOR RED", "red checks told:"], not_contains: ["SUPERVISOR RED FAILED", "file name too long"]}
      - events: {contains: [agents.park, supervisor.red], not_contains: [supervisor.review]}
  - name: told
    run: {args: [log, --verb, supervisor.red, --json]}
    expect:
      - exit: 0
      - output: {contains: ["red checks told:", "ci/circleci: go-build", "ci/circleci: colour-gate-on-decoded-video"]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, turns: 2, outcome: finish}
        - origin: {repository: example/app, branch: app-1, ahead: 2}

then:
  # The red head's pull request stays the task's one and gets no review.
  - github: {pull: {repo: example/app, number: 2, state: open}}
  - github: {issue: {repo: example/app, number: 1, pulls: 1, open_pulls: 1}}
  - events: {contains: [supervisor.red], not_contains: [supervisor.review, session.report-rejected]}
