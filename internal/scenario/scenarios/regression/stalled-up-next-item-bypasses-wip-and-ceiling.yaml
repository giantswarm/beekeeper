name: stalled-up-next-item-bypasses-wip-and-ceiling
description: >
  An Up Next P1 item in the top five of the board sits unstaffed because an
  active delivery holds delivery.wipLimit and a busy worker fills positive
  worker ceilings. After 30 minutes without progress, the loop starts a worker
  for that stalled Up Next item only, leaving Ready backlog items held and
  keeping normal capacity ceilings intact.
issue: https://github.com/giantswarm/beekeeper/issues/4003
flow: regression
tags: [regression, loop, progress, capacity, wip]
timeout: 150s

given:
  desk:
    config:
      github: {probeRepo: example/app}
      delivery: {wipLimit: 1}
      capacity:
        ceiling: 1
        providers:
          claude: {ceiling: 1}
      board:
        order:
          - {name: progress, status: [In Progress]}
          - {name: next, status: [Up Next]}
          - {name: ready, status: [Ready]}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: Active work, board: In Progress}
          - {number: 2, title: 'P1: Unblock top queue', board: Up Next}
          - {number: 3, title: Lower backlog, board: Ready}
  harness:
    usage:
      claude: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          - outcome: hang
      - name: app 2
        turns:
          - outcome: hang
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ''}

when:
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, turns: 1, running: true}
        - worker: {name: app 2, turns: 0}
  - advance: 2m
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - worker: {name: app 2, turns: 0}
  - advance: 27m
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - worker: {name: app 2, turns: 0}
  - advance: 1m
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [supervisor.board-progress]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 2, turns: 1, running: true}
  - run: {args: [supervisor, loop, --once]}
  - run: {args: [capacity, pick, --json]}
    expect:
      - exit: 0
      - json_path: {path: pick, equals: none}

then:
  - worker: {name: app 1, turns: 1, running: true}
  - worker: {name: app 2, turns: 1, running: true}
  - worker: {name: app 3, turns: 0}
  - calls: {program: claude, args: [--bg, --remote-control], min: 2, max: 2}
  - events: {not_contains: [capacity.pace.off]}
