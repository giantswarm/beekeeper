name: stalled-release-park-resumes-without-manual-resume
description: >
  A worker on an In Progress item parks on its issue waiting for release v1.2.0
  while autoResume is off. When v1.2.0 is available and no progress happens for
  30 minutes, the loop verifies release availability and starts a fresh
  continuation worker without manual agents resume. A worker waiting on an
  unpublished release stays parked.
issue: https://github.com/giantswarm/beekeeper/issues/4003
flow: regression
tags: [regression, loop, progress, park, release]
timeout: 150s

given:
  desk:
    config:
      github: {probeRepo: example/app}
      agents: {autoResume: false, staleAfter: 24h}
      board:
        order: [{name: progress, status: [In Progress]}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: 'P1: Prove shipped release', board: In Progress}
          - {number: 2, title: Pending release proof, board: In Progress}
  harness:
    usage:
      claude: {session: 10, week: 40}
    workers:
      - name: 'app 1 next-[0-9a-f]+'
        turns:
          - outcome: hang
      - name: app 1
        turns:
          - steps:
              - beekeeper: [sessions, serve, app 1, 'https://github.com/example/app/issues/1', --waits, 'release v1.2.0']
              - beekeeper: [agents, park, --on, 'example/app#1', 'waiting for release v1.2.0']
      - name: 'app 2 next-[0-9a-f]+'
        turns:
          - outcome: hang
      - name: app 2
        turns:
          - steps:
              - beekeeper: [sessions, serve, app 2, 'https://github.com/example/app/issues/2', --waits, 'release v9.9.9']
              - beekeeper: [agents, park, --on, 'example/app@v9.9.9', 'waiting for release v9.9.9']
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: devctl
      args: [release, wait, example/app, v1.2.0]
      respond: {stdout: '{"verdict":"available","exitCode":0}'}
    - program: devctl
      args: [release, wait, example/app, v9.9.9]
      respond: {stdout: '{"verdict":"pending","exitCode":2}', exit: 2}
    - program: journalctl
      respond: {stdout: ''}

when:
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
  - wait_for:
      timeout: 20s
      expect:
        - worker: {name: app 1, outcome: finish, running: false}
        - worker: {name: app 2, outcome: finish, running: false}
  - advance: 2s
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {not_contains: [supervisor.board-progress]}
  - advance: 29m
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - worker: {name: 'app 1 next-[0-9a-f]+', turns: 0}
  - advance: 1m
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.continuation, supervisor.board-progress]}
  - wait_for:
      timeout: 20s
      expect:
        - worker: {name: 'app 1 next-[0-9a-f]+', turns: 1, running: true}
  - run: {args: [supervisor, loop, --once]}

then:
  - worker: {name: app 1, turns: 1, running: false}
  - worker: {name: 'app 1 next-[0-9a-f]+', turns: 1, running: true}
  - worker: {name: app 2, turns: 1, running: false}
  - worker: {name: 'app 2 next-[0-9a-f]+', turns: 0}
