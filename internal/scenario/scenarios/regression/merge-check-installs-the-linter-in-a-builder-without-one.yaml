name: merge-check-installs-the-linter-in-a-builder-without-one
description: >
  The desk validates merge results on its Kubernetes builder (run.remote),
  whose Go image carries no golangci-lint. An approved, green head whose
  base moved on gets the merge go; the gate lints and tests base plus head
  on the builder. The check installs the linter the repository's CI pins
  into the builder's workspace and runs it there, the tests follow, and the
  head merges. Live, the check ran golangci-lint as the image had it: exit
  127, command not found, a checker environment finding on every merge and
  no merge.
issue: https://github.com/giantswarm/beekeeper/issues/3742
flow: regression
tags: [regression, merge-result, gate, builder, delivery]
timeout: 300s

given:
  clock:
    start: "2026-11-12T09:00:00Z"
  desk:
    config:
      github: {probeRepo: example/app}
      watch: {interval: 1h}
      supervisor: {loopInterval: 1m}
  # The builder's Go image: go, and no golangci-lint.
  builder:
    tools: [go]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: The item, board: Ready}
  harness:
    workers:
      - name: app 1
        turns:
          # A Go module: its merge result is linted and tested once its
          # base has moved on.
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/go.mod, content: "module example.invalid/app\n\ngo 1.26\n"}
              - write: {path: app/b.go, content: "package app\n\nvar B = 1\n"}
              - git: [add, go.mod, b.go]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
      - name: 'Review app 2 r\d+'
        turns:
          - steps:
              - gh: [pr, view, '2', --repo, example/app, --json, headRefOid, --jq, .headRefOid]
                save: head
              - gh: [pr, review, '2', --repo, example/app, --comment, --body, "Desk review (opus): approved\nHead reviewed: `${head}`"]
              - beekeeper: [agents, idle, --done, --report, "Desk review (opus): approved https://github.com/example/app/pull/2", --problem, none]
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ""}
    - program: gh
      args: [search, prs, --author, desk]
      respond: {stdout: "[]\n"}

when:
  - name: loop
    background: {args: [supervisor, loop]}
  - name: admitted
    wait_for:
      timeout: 30s
      expect:
        - events: {contains: [watch.budget-state]}
  - name: tick
    advance: 1m
  # 09:01: the item's worker opens its pull request and parks on it.
  - name: parked
    wait_for:
      timeout: 60s
      expect:
        - worker: {name: app 1, turns: 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  # The head is green: the loop starts its reviewer, who approves it.
  - name: review
    advance: {by: 4m, step: 1m, quiet: 200ms}
  - name: reviewed
    wait_for:
      timeout: 60s
      expect:
        - worker: {name: 'Review app 2 r1', turns: 1, outcome: finish}
  # The base moves on after the approval: the reviewed head no longer
  # contains it, and the two together have to be checked.
  - name: base-moves
    github: {push: {repo: example/app, branch: main, file: a.go, content: "package app\n\nvar A = 2\n"}}
  - name: go
    advance: {by: 4m, step: 1m, quiet: 200ms}
  - name: merged
    wait_for:
      timeout: 90s
      expect:
        - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - stop: loop

then:
  - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - github: {issue: {repo: example/app, number: 1, state: closed}}
  # The builder got the pinned linter installed, ran it and ran the tests.
  - calls: {program: go, args: [install, 'github\.com/golangci/golangci-lint/.*'], min: 1}
  - calls: {program: golangci-lint, args: [run], min: 1}
  - calls: {program: go, args: [test, -short], min: 1}
  - calls: {program: kubectl, args: [exec], min: 1}
  - events: {contains: [merge.authorized, merge.finished], not_contains: [merge.failed]}
