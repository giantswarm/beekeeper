name: stalled-board-item-respects-start-hold
description: >
  A top In Progress item is stalled by pace. A person's starts hold still
  prevents recovery after 30 minutes. Only after that hold is lifted does
  the loop use the item-scoped pace exception and start its worker.
issue: https://github.com/giantswarm/beekeeper/issues/4003
flow: regression
tags: [regression, loop, progress, hold]
timeout: 120s

given:
  desk:
    config:
      github: {probeRepo: example/app}
      board:
        order: [{name: progress, status: [In Progress]}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: 'P1: Respect the hold', board: In Progress}
  harness:
    usage:
      claude: {session: 10, week: 77}
    workers:
      - name: app 1
        turns:
          - outcome: hang
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ''}

when:
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
  - run: {args: [--as, scenario, hold, set, starts, --reason, 'Wait for the person']}
    expect:
      - exit: 0
  - advance: 30m
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - worker: {name: app 1, turns: 0}
      - events: {not_contains: [supervisor.board-progress]}
  - run: {args: [--as, scenario, hold, lift, starts]}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [supervisor.board-progress]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, turns: 1, running: true}

then:
  - worker: {name: app 1, turns: 1}
  - events: {not_contains: [capacity.pace.off]}
