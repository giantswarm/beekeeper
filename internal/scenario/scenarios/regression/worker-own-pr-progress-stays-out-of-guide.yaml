name: worker-own-pr-progress-stays-out-of-guide
description: >
  Two workers report mid-task problems while working Ready items. One opens a
  pull request referencing its issue with "Part of", reports a red CI check on
  that newly opened pull request citing an earlier merged pull request in the
  same repository and source/module paths (src/index.rs, cmd/app-test, i/o,
  x/crypto), and parks on its issue. The other reports that its item is blocked
  by a defect in another repository (other/tool). The supervisor loop polls the
  newly opened pull request, retains the own-delivery progress note as
  supervisor.progress, and delivers only the cross-repository defect to the
  guide's feed as a GUIDE PROBLEM.
issue: https://github.com/giantswarm/beekeeper/issues/3619
flow: regression
tags: [regression, delivery, guide, problems, loop]
timeout: 120s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      capacity: {ceiling: 2, providers: {claude: {ceiling: 2}}}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: Fix the index build, board: Ready}
          - {number: 2, title: Fix the deployment gate, board: Ready}
        pulls:
          - {number: 3, title: "feat: earlier merged baseline", body: "Merged baseline", state: merged, head: baseline}
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "fix the index build\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "fix: repair the index build"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "fix: repair the index build", --body, "Part of https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper:
                  - agents
                  - problem
                  - "CI check failed on https://github.com/example/app/pull/4 after https://github.com/example/app/pull/3 merged, in src/index.rs and cmd/app-test (i/o timeout in x/crypto); reading saved output"
              - beekeeper: [agents, park, --on, 'example/app#1', "verifying follow-up checks on https://github.com/example/app/pull/4"]
      - name: app 2
        turns:
          - steps:
              - beekeeper:
                  - agents
                  - problem
                  - "example/app#2 fails because other/tool gate times out"
              - beekeeper: [agents, park, --on, 'example/app#2', "waiting on external gate fix"]
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # Initialize the guide cursor before worker reports arrive.
  - name: feed-init
    run: {args: [guide, watch, --once]}
    expect:
      - exit: 0
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  # The refill starts both Ready workers; app 1 opens pull #4 and both park.
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.start]}
  - wait_for:
      timeout: 30s
      expect:
        - worker: {name: app 1, outcome: finish}
        - worker: {name: app 2, outcome: finish}
        - github: {pull: {repo: example/app, number: 4, state: open}}
  - advance: 2s
  # The pass applies both problem reports, polls pull #4 and #3, retains app 1's
  # own-delivery note as supervisor.progress, and files only app 2's external defect.
  - name: apply
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.problem, agents.park, supervisor.progress, supervisor.file]}
  - name: feed
    run: {args: [guide, watch, --once]}
    expect:
      - exit: 0
      - output:
          contains: ["GUIDE PROBLEM: ", "other/tool gate times out"]
          not_contains: ["src/index.rs", "https://github.com/example/app/pull/4"]
  - name: progress-log
    run: {args: [log, --verb, supervisor.progress, --json]}
  - name: file-log
    run: {args: [log, --verb, supervisor.file, --json]}

then:
  - {step: progress-log, exit: 0}
  - {step: progress-log, json_path: {path: ., len: 1}}
  - {step: progress-log, output: {contains: ["src/index.rs", "https://github.com/example/app/pull/4"]}}
  - {step: file-log, exit: 0}
  - {step: file-log, json_path: {path: ., len: 1}}
  - step: file-log
    output:
      contains: ["other/tool gate times out"]
      not_contains: ["src/index.rs", "https://github.com/example/app/pull/4"]
