name: stalled-board-worker-gets-a-continuation
description: >
  A worker on the first In Progress item crashes with its task still open.
  Its roster entry normally lasts a day. Across loop restarts, the progress
  observer waits 30 minutes and then starts one fresh continuation, without
  a guide, a new issue or a transcript resume. A live quiet worker is kept.
issue: https://github.com/giantswarm/beekeeper/issues/4003
flow: regression
tags: [regression, loop, progress, crash]
timeout: 150s

given:
  desk:
    config:
      github: {probeRepo: example/app}
      agents: {staleAfter: 24h}
      board:
        order: [{name: progress, status: [In Progress]}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: 'P1: Recover worker', board: In Progress}
          - {number: 2, title: Quiet but alive, board: In Progress}
  harness:
    usage:
      claude: {session: 10, week: 40}
    workers:
      - name: 'app 1 next-[0-9a-f]+'
        turns:
          - outcome: hang
      - name: app 1
        turns:
          - steps:
              - beekeeper: [sessions, serve, app 1, 'https://github.com/example/app/issues/1']
            outcome: crash
      - name: app 2
        turns:
          - outcome: hang
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ''}

when:
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
  - wait_for:
      timeout: 20s
      expect:
        - worker: {name: app 1, outcome: crash, running: false}
        - worker: {name: app 2, turns: 1, running: true}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {not_contains: [supervisor.board-progress]}
  - advance: 29m
  - run: {args: [watch, --once]}
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - worker: {name: 'app 1 next-[0-9a-f]+', turns: 0}
  - advance: 1m
  - run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.continuation, supervisor.board-progress]}
  - wait_for:
      timeout: 20s
      expect:
        - worker: {name: 'app 1 next-[0-9a-f]+', turns: 1, running: true}
  - run: {args: [supervisor, loop, --once]}

then:
  - worker: {name: app 1, turns: 1, running: false}
  - worker: {name: 'app 1 next-[0-9a-f]+', turns: 1, running: true}
  - worker: {name: app 2, turns: 1, running: true}
  - calls: {program: claude, args: [--bg, --remote-control], min: 3, max: 3}
