name: idle-desk-bounds-child-processes
description: >
  A long-running supervisor and its watch sample an idle desk for a minute at
  the shipped cadence (loop and watch every 30 seconds). Credential discovery
  is shared across their budget probes: the gh login is read once, not on
  every probe. The external program calls the world answers, cold start
  included, stay below the 100 a minute an idle desk may start. Git is the
  real one and not counted here; the worktree scan's git queries are bounded
  by the worktree tests.
issue: https://github.com/giantswarm/beekeeper/issues/3984
flow: regression
tags: [regression, performance, loop, budget]
timeout: 90s

given:
  clock:
    start: "2026-11-13T09:00:00Z"
  desk:
    config:
      github: {probeRepo: example/app}
      supervisor: {loopInterval: 30s, releaseEvery: 24h, workerBrief: ""}
      watch: {interval: 30s}
  github:
    repositories:
      - name: example/app
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ""}
    - program: gh
      args: [search, prs]
      respond: {stdout: "[]\n"}

when:
  - name: loop
    background: {args: [supervisor, loop]}
  - wait_for:
      timeout: 20s
      expect:
        - events: {contains: [watch.budget-state]}
  - name: minute
    advance: {by: 1m, step: 2s, quiet: 200ms}
    expect:
      - process: {name: loop, running: true}
  - stop: loop

then:
  - calls: {max: 100}
  # The budget probes' gh login, not the one-off login check at start.
  - calls: {program: gh, args: [auth, token, --hostname], min: 1, max: 1}
  - calls: {program: devctl, args: [auth, status], min: 1, max: 2}
