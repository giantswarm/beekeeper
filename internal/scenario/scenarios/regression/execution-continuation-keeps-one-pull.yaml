name: execution-continuation-keeps-one-pull
description: >
  A task's worker runs on an SSH execution host, publishes its pull request
  and parks on it for the desk review. CI fails on that head; the loop
  tells the parked execution, ends it for the review, and the task gets its
  next execution on the host. That continuation must continue the open
  pull request: its commit lands on that pull request's branch, the task
  keeps one open pull request, and after the merge none of the task's pull
  requests is open. Live, every continuation published a branch and a pull
  request of its own, and the superseded ones stayed open after the merge.
  Today the coordinator refuses the continuation's publication as a
  duplicate, so its work reaches no pull request at all.
issue: https://github.com/giantswarm/beekeeper/issues/3738
pending: https://github.com/giantswarm/beekeeper/issues/3738
flow: regression
tags: [regression, hosts, delivery, duplicate-pr]
timeout: 300s

given:
  clock:
    start: "2026-11-12T09:00:00Z"
  desk:
    config:
      github: {probeRepo: example/app}
      watch: {interval: 1h}
      # The loop places its starts on the execution host, and the desk's
      # own machine has no memory to spare for a worker: every start of
      # the scenario, a continuation's too, runs on the host.
      supervisor: {loopInterval: 1m, hosts: [builder]}
      capacity: {availMinMiB: 100000000}
  hosts:
    - name: builder
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: The task, board: Ready}
  harness:
    workers:
      # Every execution of the task does the same: one commit of its own,
      # the publication through the coordinator, and the park for the desk
      # review on the pull request the publication answered.
      - name: 'app 1.*'
        host: builder
        repeat: true
        turns:
          - steps:
              - write: {path: 'change-${session}.txt', content: "the change of execution ${session}, turn ${turn}\n"}
              - git: [add, 'change-${session}.txt']
              - git: [commit, --quiet, -m, "feat: the task's change"]
              - write: {path: .beekeeper-scratch/body.md, content: "Closes https://github.com/example/app/issues/1\n"}
              - run:
                  - sh
                  - -c
                  - |
                    out=$(beekeeper agents publish --title "feat: the task's change" --body-file "$1") || exit 1
                    IFS='"'; set -- $out; printf '%s\n' "$8"
                  - sh
                  - '${dir}/.beekeeper-scratch/body.md'
                save: pull
              - beekeeper: [agents, park, --on, '${pull}', --post-merge, '', desk review]
      # The desk review of the pull request, on the host as well: it reads
      # and posts through the coordinator.
      - name: 'Review app 2 r\d+'
        turns:
          - steps:
              - git: [rev-parse, HEAD]
                save: head
              - write: {path: .beekeeper-scratch/review.md, content: "Desk review (opus): approved\nHead reviewed: `${head}`\n"}
              # The review round is assigned to the execution right after
              # its start: the reviewer asks until it is.
              - run:
                  - sh
                  - -c
                  - |
                    i=0
                    while [ "$i" -lt 200 ]; do
                      beekeeper agents review --body-file "$1" && exit 0
                      i=$((i+1))
                    done
                    exit 1
                  - sh
                  - '${dir}/.beekeeper-scratch/review.md'
                save: review
              - beekeeper: [agents, idle, --done, --report, "Review: approved\n${review}", --problem, none]
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ""}
    # The repository publishes no release: nothing to wait for after a
    # merge.
    - program: devctl
      args: [release, wait]
      respond: {stdout: '{"verdict":"no_release","reason":"the repository has no release workflow"}'}
    # The host's gh has a login of its own, and so has the desk's: without
    # one a host gives its workers no GitHub reads and gets no start.
    - program: gh
      args: [auth, token]
      respond: {stdout: "scenario-token\n"}
    # The pull watcher's list of the desk's open pull requests: the parks
    # track the task's own.
    - program: gh
      args: [search, prs, --author, desk]
      respond: {stdout: "[]\n"}

when:
  - name: loop
    background: {args: [supervisor, loop]}
  - name: admitted
    wait_for:
      timeout: 30s
      expect:
        - events: {contains: [watch.budget-state]}
  - name: tick
    advance: 1m
  # 09:01: the refill starts the item's worker on the host; it publishes
  # the task's pull request and parks on it.
  - name: published
    wait_for:
      timeout: 30s
      expect:
        - worker: {name: 'app 1.*', host: builder, turns: 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  # CI fails on the head the worker parked on.
  - name: red
    github: {check: {repo: example/app, pull: 2, name: build, state: red}}
    expect:
      - github: {issue: {repo: example/app, number: 1, open_pulls: 1}}
  # The loop tells the red check to the parked execution, ends it for the
  # review, and the task gets its next execution on the host.
  - name: continue
    advance: {by: 8m, step: 1m, quiet: 1s}
  - name: continued
    wait_for:
      timeout: 30s
      expect:
        - worker: {name: 'app 1.*', host: builder, turns: 2, outcome: finish}
  # The continuation's commit is on the branch of the task's one pull
  # request, beside the first execution's; CI passes on its head. The pull
  # request's own head is counted: a branch of the continuation's own, two
  # commits ahead as well, is not that pull request.
  - name: green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
    expect:
      - github: {issue: {repo: example/app, number: 1, open_pulls: 1}}
      - github: {pull: {repo: example/app, number: 2, state: open, ahead: 2}}
  - name: review
    advance: {by: 6m, step: 1m, quiet: 1s}
  - name: reviewed
    wait_for:
      timeout: 30s
      expect:
        - worker: {name: 'Review app 2 r1', turns: 1, outcome: finish}
  - name: merge
    advance: {by: 6m, step: 1m, quiet: 1s}
  - name: merged
    wait_for:
      timeout: 30s
      expect:
        - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - stop: loop

then:
  # After the merge the task is closed and none of its pull requests is
  # left open.
  - github: {issue: {repo: example/app, number: 1, state: closed, open_pulls: 0}}
  - worker: {name: 'app 1.*', host: builder, turns: 2, outcome: finish}
