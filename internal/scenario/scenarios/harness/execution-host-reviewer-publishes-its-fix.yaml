name: execution-host-reviewer-publishes-its-fix
description: >
  A reviewer on an SSH execution host fixes its own finding. The loop
  places the desk review of a green pull request on the host. The reviewer
  commits its fix in its workspace and publishes it with agents publish.
  The coordinator pushes the fix to the pull request's own branch as a
  fast-forward. It opens no second pull request and does not refuse the
  review session. The reviewer then approves the head it pushed through the
  review relay, and its completion report is accepted as the round's
  verdict.
issue: https://github.com/giantswarm/beekeeper/issues/3849
flow: harness
tags: [harness, hosts, review, claude]
timeout: 150s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # Starts go to the execution host first.
      supervisor: {hosts: [builder]}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item}
  hosts:
    - name: builder
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
    workers:
      # The worker opens the pull request and parks on it for the desk review.
      - name: app 1
        host: local
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the worker's change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
      - name: 'Review app 2 r1'
        host: builder
        turns:
          - steps:
              - write: {path: fix.txt, content: "the reviewer's fix\n"}
              - git: [add, fix.txt]
              - git: [commit, --quiet, -m, "fix: the reviewer's finding"]
              # The fix goes to the reviewed pull request's branch.
              - beekeeper: [agents, publish]
              - git: [rev-parse, HEAD]
                save: fixed
              - write:
                  path: .beekeeper-scratch/review.md
                  content: "Review: approved\nHead reviewed: `${fixed}`\n\nfix.txt:1: the finding → fixed in ${fixed}\n"
              - beekeeper: [agents, review, --body-file, '${dir}/.beekeeper-scratch/review.md']
                save: review
              - beekeeper: [agents, idle, --done, --report, "Review: approved\n${review}", --problem, none]
  calls:
    # The host's gh has a login of its own: its workers read GitHub with it.
    - program: gh
      args: [auth, token]
      respond: {stdout: "scenario-token\n"}
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  # The loop runs before the park: a park from before its first start is
  # no request for a review.
  - name: first
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - advance: 2s
  - name: worker
    run: {args: [--as, supervisor loop, agents, start, app 1, /work/worker.txt]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 20s
      expect:
        - worker: {name: app 1, outcome: finish}
  - advance: 2s
  # The pass takes the park as the request for the desk review.
  - name: parked
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.park], not_contains: [supervisor.review]}
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  - advance: 2s
  # Green: the loop starts the reviewer on the host.
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.park, supervisor.review]}
  - wait_for:
      timeout: 60s
      expect:
        - worker: {name: 'Review app 2 r1', host: builder, outcome: finish}

then:
  - worker: {name: 'Review app 2 r1', host: builder, harness: claude, turns: 1, outcome: finish}
  # The worker's commit and the reviewer's fix are on the pull request's
  # branch; no branch of the reviewer's execution and no second pull request.
  - origin: {repository: example/app, branch: app-1, ahead: 2}
  - origin: {repository: example/app, branch: 'beekeeper-execution/.*', exists: false}
  - github: {pull: {repo: example/app, number: 2, state: open}}
  # The worker's pull request is the only one created.
  - github: {calls: {operation: createPullRequest, min: 1, max: 1}}
  - events:
      contains: [execution.published]
      not_contains: [execution.publish-denied, session.report-rejected]
