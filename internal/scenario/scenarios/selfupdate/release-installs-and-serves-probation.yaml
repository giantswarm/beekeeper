name: release-installs-and-serves-probation
description: >
  The desk runs release candidate 1 and GitHub publishes two newer ones.
  self-update finds the release, downloads its binary and verifies it
  against its bundle, stages it and runs the canary on the staged binary
  with the live configuration (the version, the budget gate, the
  supervisor's status, capacity, and a dry-run loop pass beside the running
  release's); only then it replaces the executable. The first install has
  no recovery target yet and is promoted by its own health checks. The
  second install is watched: a recovery controller of the last known good
  release judges the candidate for 30 minutes of probation, in which its
  loop sends its heartbeat and the isolated workflow probe passes, and then
  promotes it to last known good.
issue: https://github.com/giantswarm/beekeeper/issues/3794
flow: selfupdate
tags: [selfupdate, release, canary, probation]
timeout: 240s

given:
  desk:
    config:
      github: {probeRepo: example/app}
      supervisor: {loopInterval: 1m, releaseEvery: 24h}
      watch: {interval: 30s}
  releases:
    installed: v1.0.0-rc.1
    published: [v1.0.0-rc.2, v1.0.0-rc.3]
  github:
    repositories:
      - name: example/app
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ""}
    - program: gh
      args: [search, prs]
      respond: {stdout: "[]\n"}

when:
  - name: running
    run: {args: [version]}
    expect:
      - output: {matches: '^beekeeper v1\.0\.0-rc\.1\b'}
  - name: check
    run: {args: [self-update, --check, --version, v1.0.0-rc.2]}
    expect:
      - exit: 125
      - output: {contains: ["beekeeper v1.0.0-rc.2 is available, this is v1.0.0-rc.1."]}
  # The first install: found, verified, staged, canaried, installed.
  - name: first
    run: {args: [self-update, --version, v1.0.0-rc.2]}
    expect:
      - exit: 0
      - output: {contains: ["Verified the signature and updated /work/bin/beekeeper from v1.0.0-rc.1 to v1.0.0-rc.2."]}
      - github: {calls: {path: 'repos/giantswarm/beekeeper/releases/tags/v1\.0\.0-rc\.2', caller: first, status: 200, min: 1}}
      - github: {calls: {path: 'repos/giantswarm/beekeeper/releases/assets/\d+', caller: first, status: 200, min: 2}}
  - name: installed
    run: {args: [version]}
    expect:
      - output: {matches: '^beekeeper v1\.0\.0-rc\.2\b'}
  # No recovery target yet: the installed candidate's own health checks
  # promote it.
  - name: promote-first
    run: {args: [self-update, --complete-probation]}
    expect:
      - exit: 0
  # The second install is the newest release, found by the lookup itself.
  - name: lookup
    run: {args: [self-update, --check]}
    expect:
      - exit: 125
      - output: {contains: ["beekeeper v1.0.0-rc.3 is out", "this is v1.0.0-rc.2"]}
      - github: {calls: {path: 'repos/giantswarm/beekeeper/git/matching-refs/tags/v', caller: lookup, status: 200, min: 1}}
  - name: second
    run: {args: [self-update]}
    expect:
      - exit: 0
      - output: {contains: ["Verified the signature and updated /work/bin/beekeeper to v1.0.0-rc.3."]}
      # The controller of the last known good release watches it.
      - calls: {program: systemd-run, args: ['.*beekeeper-recovery\.service.*'], min: 1}
  - name: candidate
    run: {args: [version]}
    expect:
      - output: {matches: '^beekeeper v1\.0\.0-rc\.3\b'}
  # A watched candidate's verdict is the controller's: nobody promotes it
  # by hand meanwhile, and no further update installs.
  - name: watched
    run: {args: [self-update, --version, v1.0.0-rc.2]}
    expect:
      - exit: 1
      - stderr: {contains: ["a recovery controller supervises the installed candidate's probation"]}
  # The candidate's loop runs and sends its heartbeat.
  - name: loop
    background: {args: [supervisor, loop]}
  - wait_for:
      timeout: 30s
      expect:
        - events: {contains: [watch.budget-state]}
  # Probation: the controller evaluates once a minute.
  - name: probation
    advance:
      by: 45m
      step: 1m
      quiet: 1s
  - wait_for:
      timeout: 60s
      expect:
        - events: {contains: [self-update.recovery]}
  - name: latest
    run: {args: [self-update, --check]}
    expect:
      - exit: 0
      - output: {contains: ["beekeeper v1.0.0-rc.3 is the latest release."]}
  - stop: loop

then:
  - {step: candidate, exit: 0}
  - events: {contains: [self-update.recovery], not_contains: [self-update.canary]}
  - log: {name: loop, not_contains: ["RELEASE ROLLED BACK", "RELEASE RECOVERY FAILED"]}
  - {step: latest, output: {not_contains: ["is out"]}}
