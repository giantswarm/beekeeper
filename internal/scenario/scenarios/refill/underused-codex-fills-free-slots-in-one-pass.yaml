name: underused-codex-fills-free-slots-in-one-pass
description: >
  Both subscriptions admit starts, but Codex's week is below half its
  pace while Claude's is not. Without a worker finishing first, one loop
  pass fills both free slots with Codex workers. A third Ready item gets
  no worker because the ceiling still binds. The next pass starts nobody
  and explains that there is no room.
issue: https://github.com/giantswarm/beekeeper/issues/3550
flow: refill
tags: [refill, loop, capacity, codex, usage]
timeout: 90s
control:
  none: >-
    the refill and below-half-pace priority were fixed in
    https://github.com/giantswarm/beekeeper/pull/3587; this scenario covers
    their combined behavior already on main

given:
  desk:
    config:
      github: {probeRepo: example/app}
      capacity:
        ceiling: 2
        providers:
          claude: {ceiling: 2}
          codex: {ceiling: 2}
        choices:
          - {harness: claude, model: sonnet}
          - {harness: codex, model: gpt-5.2-codex}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
          - {number: 2, title: Second item, board: Ready}
          - {number: 3, title: Third item, board: Ready}
  harness:
    # Both weeks reset in 72 hours: pace is about 57%. Neither session
    # window is full, so priority, rather than ineligibility, chooses Codex.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 12}
    workers:
      - name: 'app \d'
        turns:
          - outcome: hang
  calls:
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      respond: {stdout: ""}

when:
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: pick
    run: {args: [capacity, --json]}
    expect:
      - exit: 0
      - json_path: {path: providers.claude.room, equals: 2}
      - json_path: {path: providers.codex.room, equals: 2}
      - json_path: {path: providers.codex.underused, equals: true}
      - json_path: {path: choice.harness, equals: codex}
  - name: fill
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.start, supervisor.next]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'app \d', harness: codex, turns: 2}
  - name: capacity
    run: {args: [capacity, --json]}
    expect:
      - exit: 0
      - json_path: {path: busy, len: 2}
      - json_path: {path: room, equals: 0}
  - name: full
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - output: {contains: ["SUPERVISOR REFILL started 0: no room for a worker"]}

then:
  - worker: {name: 'app \d', harness: codex, turns: 2, running: true}
  - worker: {name: app 3, turns: 0}
  - calls: {program: claude, args: [--bg, --remote-control], max: 0}
