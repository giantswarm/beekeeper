name: underused-agy-pick-stays-on-the-coordinator
description: >
  The desk runs Claude and agy (Gemini); its execution host runs Claude
  only. Gemini's week is far behind its pace (5% used against about 57%),
  Claude's is not, so capacity picks agy. Under supervisor.hostsFirst the
  refill's start still stays on the coordinator, which has room, and runs
  on agy: a host that would spend Claude instead passes it on and says
  why. Live, every start went to a host on Claude while Gemini's weekly
  budget went unspent.
issue: https://github.com/giantswarm/beekeeper/issues/3537
flow: refill
tags: [refill, loop, capacity, agy, hosts, placement]
timeout: 120s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # agy takes no session effort: a desk with an agy choice sets no
      # supervisor.effort. The scenario's desk has no agy hooks installed;
      # its guard is off.
      supervisor: {hosts: [builder], effort: ""}
      hooks: {guards: false}
      capacity:
        ceiling: 2
        providers:
          claude: {ceiling: 2}
          agy: {ceiling: 2}
        choices:
          - {harness: claude, model: sonnet}
          - {harness: agy, model: gemini-3-pro}
  hosts:
    # Claude only, as every execution host runs today.
    - {name: builder}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  harness:
    # Both weeks reset in 72 hours, a pace of about 57%. Claude is on its
    # way; Gemini is below half of its pace.
    usage:
      claude: {session: 10, week: 40}
      agy: {session: 10, week: 5}
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}
    # The host's gh has a login of its own: without one a host gives its
    # workers no GitHub reads and gets no start.
    - program: gh
      args: [auth, token]
      respond: {stdout: "scenario-token\n"}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: pick
    run: {args: [capacity, --json]}
    expect:
      - exit: 0
      - json_path: {path: choice.harness, equals: agy}
      - json_path: {path: choice.provider, equals: agy}
  - name: fill
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.start]}
  - wait_for:
      timeout: 30s
      expect:
        - worker: {name: app 1, turns: 1}
  - name: placement
    run: {args: [capacity]}

then:
  - worker: {name: app 1, host: local, harness: agy, turns: 1}
  - worker: {name: app 1, host: builder, turns: 0}
  - worker: {name: app 1, harness: claude, turns: 0}
  - {step: placement, exit: 0}
  - step: placement
    output:
      contains:
        - "host builder: the coordinator's pick agy/gemini-3-pro is"
        - "points behind its weekly pace; this host's pick is claude/sonnet"
