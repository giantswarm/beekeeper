name: fills-free-slots-to-the-ceiling
description: >
  The refill starts a worker for each free slot and Ready item, up to
  capacity.ceiling. Three items are Ready and the ceiling is two: one pass
  starts two workers, each named after its item and briefed with it. A
  second pass has no free slot and starts nothing, and the third item stays
  Ready on the board.
issue: https://github.com/giantswarm/beekeeper/issues/3793
flow: refill
tags: [refill, loop, capacity]
timeout: 90s
control:
  none: states the refill behavior main already has; this change only adds the scenario

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      capacity: {ceiling: 2}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
          - {number: 2, title: Second item, board: Ready}
          - {number: 3, title: Third item, board: Ready}
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      # Each worker stays on its task: its turn runs on.
      - name: 'app \d'
        turns:
          - outcome: hang
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: fill
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.start, supervisor.next]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'app \d', turns: 2}
  - name: capacity
    run: {args: [capacity, --json]}
    expect:
      - exit: 0
      - json_path: {path: busy, len: 2}
      - json_path: {path: room, equals: 0}
  # No free slot: the second pass reads no board and starts nothing.
  - name: full
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - output: {contains: ["SUPERVISOR REFILL started 0: no room for a worker"]}
  - name: roster
    run: {args: [agents, --json]}

then:
  - {step: roster, exit: 0}
  - {step: roster, json_path: {path: ., len: 2}}
  - worker: {name: 'app \d', harness: claude, turns: 2, running: true}
  - calls: {program: claude, args: [--bg, --remote-control], min: 2, max: 2}
