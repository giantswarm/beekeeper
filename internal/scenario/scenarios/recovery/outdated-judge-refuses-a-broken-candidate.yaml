name: outdated-judge-refuses-a-broken-candidate
description: >
  A candidate that was rolled back for a real defect cannot promote itself
  as the victim of an outdated judge: its own probe fails to merge, so
  self-update --recover-outdated-judge refuses, the previous release stays
  installed and the rollback and its reason stand.
  Moved from internal/loopworkflow TestRecoverOutdatedJudgeCommand,
  case broken=true.
issue: https://github.com/giantswarm/beekeeper/issues/3797
flow: recovery
tags: [recovery, self-update, judge, mutation]
control:
  none: moves a recovery test of internal/loopworkflow's retired integration suite; states behavior main already has
timeout: 180s

given:
  github:
    repositories:
      - name: example/app
  releases: {installed: v1.0.0-rc.1}
  install:
    candidate: {version: v1.0.0-rc.2, mutation: pull-parser-drops-the-base}
    previous: v1.0.0-rc.1
    rolled_back: isolated workflow probe failed 3 times

when:
  - name: recover
    run:
      release: v1.0.0-rc.2+pull-parser-drops-the-base
      args: [self-update, --recover-outdated-judge, /work/install/beekeeper]
    expect:
      - exit: 1

then:
  - install: {installed: v1.0.0-rc.1, probation: rolled-back, quarantined: v1.0.0-rc.2+pull-parser-drops-the-base, judge_recovered: false}
