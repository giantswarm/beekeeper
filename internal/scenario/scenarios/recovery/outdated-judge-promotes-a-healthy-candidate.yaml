name: outdated-judge-promotes-a-healthy-candidate
description: >
  An outdated judge rolled back a healthy candidate. The retained
  candidate, run as itself with self-update --recover-outdated-judge,
  verifies itself against the journal, proves a merge with its own probe,
  reinstalls itself and promotes itself, keeping the original reason. The
  work in flight is kept and the candidate writes the state again.
  Moved from internal/loopworkflow TestRecoverOutdatedJudgeCommand,
  case broken=false.
issue: https://github.com/giantswarm/beekeeper/issues/3797
flow: recovery
tags: [recovery, self-update, judge]
control:
  none: moves a recovery test of internal/loopworkflow's retired integration suite; states behavior main already has
timeout: 180s

given:
  github:
    repositories:
      - name: example/app
  releases: {installed: v1.0.0-rc.1}
  install:
    candidate: {version: v1.0.0-rc.2}
    previous: v1.0.0-rc.1
    rolled_back: isolated workflow probe failed 3 times

when:
  - name: work
    run: {args: [--as, scenario, timer, add, 3h, "Is the work in flight kept?"]}
    expect:
      - exit: 0
      - install: {installed: v1.0.0-rc.1, probation: rolled-back, quarantined: v1.0.0-rc.2}
  - name: recover
    run:
      release: v1.0.0-rc.2
      args: [self-update, --recover-outdated-judge, /work/install/beekeeper]
    expect:
      - exit: 0
  - name: timers
    run:
      release: v1.0.0-rc.2
      args: [--json, timer, list]
    expect:
      - exit: 0
      - json_path: {path: ., len: 1}
  - name: writes
    run:
      release: v1.0.0-rc.2
      args: [--as, scenario, timer, add, 3h, "Does the recovered release write?"]
    expect:
      - exit: 0

then:
  - install: {installed: v1.0.0-rc.2, probation: passed, judge_recovered: true}
