name: pull-request-task-finishes-with-its-merge
description: >
  A worker whose task is a pull request, not an issue, finishes with that
  pull request's merge. A worker is started by hand with a brief that names
  the merged pull request by its URL, to prove it on main. No sweep of the
  desk's open pull requests ever read it, so only the start can link it to
  the task: the worker's delivery, keyed on the pull request, holds it among
  its pulls. The worker's agents idle --done, with the merge as its proof,
  is accepted when it queues and when the next pass applies it.
issue: https://github.com/giantswarm/beekeeper/issues/3814
flow: delivery
tags: [delivery, start, pull-request]
timeout: 120s

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # A headless worker, as capacity picks it.
      capacity:
        providers: {codex: {ceiling: 2}}
        choices: [{harness: codex, model: gpt-5.2-codex}]
  github:
    repositories:
      - name: example/app
        # No issue: the pull request closes none, and it merged before the
        # desk's loop could read it as open.
        pulls:
          - {number: 1, title: "feat: a change", head: change, body: "A change without an issue.", state: merged}
  files:
    - path: briefs/prove-pull.md
      content: |
        Prove https://github.com/example/app/pull/1 on main.

        The pull request merged; finish with its merge as the proof.
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      # It proves the merge and ends the task: no park, no pull request of
      # its own.
      - name: app-prover
        turns:
          - steps:
              - beekeeper: [agents, idle, --done, --report, "https://github.com/example/app/pull/1 merged; the change is on main; open items: none", --problem, none]
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: start
    run:
      args: [--as, supervisor loop, agents, start, app-prover, /work/briefs/prove-pull.md, --harness, codex, --model, gpt-5.2-codex]
    expect:
      - exit: 0
  # Its agents idle --done ran with exit 0: a refused one fails its turn.
  - wait_for:
      timeout: 30s
      expect:
        - worker: {name: app-prover, outcome: finish}
  # The task's delivery is the pull request's own and holds it.
  - name: delivery
    run: {args: [delivery, --json]}
    expect:
      - exit: 0
      - json_path: {path: 'deliveries[0].ref', equals: example/app#1}
      - json_path: {path: 'deliveries[0].pulls[0]', equals: example/app#1}
  - advance: 2s
  # The pass applies the worker's queued report with GitHub's reading.
  - name: apply
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.done], not_contains: [session.report-rejected]}

then:
  - github: {pull: {repo: example/app, number: 1, state: merged, merged_into: main}}
  - worker: {name: app-prover, turns: 1, outcome: finish}
  - events:
      contains: [agents.start, agents.done]
      not_contains: [session.report-rejected]
