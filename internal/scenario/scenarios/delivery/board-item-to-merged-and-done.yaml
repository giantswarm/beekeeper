name: board-item-to-merged-and-done
description: >
  One delivery from the board to Done, every step taken by the supervisor
  loop. A Ready item starts a worker; the worker pushes its branch, opens a
  pull request that closes the item and parks on it for the desk review.
  While CI is pending the loop starts no reviewer. Once the head is green it
  starts an independent reviewer, who approves that head in a review
  comment. The loop then gives the merge go for exactly that head, merges
  through the gate, closes the task and moves the item to Done.
issue: https://github.com/giantswarm/beekeeper/issues/3793
flow: delivery
tags: [delivery, loop, review, merge]
timeout: 150s

given:
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  harness:
    workers:
      - name: app 1
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the worker's change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              # The merge ends the task: no work is declared for after it.
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
      - name: 'Review app 2 r\d+'
        turns:
          - steps:
              - gh: [pr, view, '2', --repo, example/app, --json, headRefOid, --jq, .headRefOid]
                save: head
              - gh: [pr, review, '2', --repo, example/app, --comment, --body, "Desk review (opus): approved\nHead reviewed: `${head}`"]
              - beekeeper: [agents, idle, --done, --report, "Desk review (opus): approved https://github.com/example/app/pull/2", --problem, none]
  calls:
    # The watch reads devctl's login, which this desk has none of.
    - program: devctl
      args: [auth, status]
      respond: {stderr: "not logged in\n", exit: 1}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  # The refill starts a worker on the Ready item.
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.start, supervisor.next]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - advance: 2s
  # The pass takes the park as the request for the desk review; nothing ran
  # on the head yet, so CI is pending and no reviewer starts.
  - name: parked
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.park], not_contains: [supervisor.review, session.report-rejected]}
  - name: ci-pending
    github: {check: {repo: example/app, pull: 2, name: build, state: pending}}
    expect:
      - github: {pull: {repo: example/app, number: 2, state: open, checks: pending}}
  - advance: 2s
  - name: pending
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {not_contains: [supervisor.review]}
      - worker: {name: 'Review app 2 r1', turns: 0}
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
    expect:
      - github: {pull: {repo: example/app, number: 2, state: open, checks: green}}
  - advance: 2s
  # Green: the loop starts the reviewer of that head.
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [supervisor.review]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'Review app 2 r1', outcome: finish}
  - advance: 2s
  # The approval of the head gets the go and the merge of that head.
  - name: go
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - advance: 2s
  # The merged pull request ends its task.
  - name: end
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - name: roster
    run: {args: [agents, --json]}

then:
  - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - github: {issue: {repo: example/app, number: 1, state: closed, board: Done, pulls: 1, open_pulls: 0}}
  - events:
      contains: [agents.start, agents.park, supervisor.review, merge.authorized, merge.start, merge.finished, supervisor.merge, supervisor.end]
      not_contains: [merge.failed, session.report-rejected]
  - worker: {name: app 1, turns: 1, outcome: finish}
  - worker: {name: 'Review app 2 r1', turns: 1, outcome: finish}
  - calls: {program: gh, args: [pr, merge], min: 1, max: 1}
  - {step: roster, exit: 0}
