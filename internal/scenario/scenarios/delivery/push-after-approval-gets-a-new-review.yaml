name: push-after-approval-gets-a-new-review
description: >
  A push after the approval is not covered by it. Review round one approves
  the head the worker parked on. Before the merge the worker's next session
  pushes another commit and parks again. The loop does not merge on the
  approval of the old head: the new head, once green, gets review round
  two, and only its approval gets the go and the merge.
issue: https://github.com/giantswarm/beekeeper/issues/3793
flow: delivery
tags: [delivery, loop, review, merge]
timeout: 180s
control:
  none: states the delivery behavior main already has; this change only adds the scenario

given:
  desk:
    config:
      # The budget probe reads a repository the scenario's GitHub has.
      github: {probeRepo: example/app}
      # Headless workers: a continuation is a fresh session's next turn.
      capacity:
        providers: {codex: {ceiling: 2}}
        choices: [{harness: codex, model: gpt-5.2-codex}]
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: First item, board: Ready}
  harness:
    # Usage on pace: neither ahead of it nor far behind.
    usage:
      claude: {session: 10, week: 40}
      codex: {session: 10, week: 40}
    workers:
      - name: app 1
        turns:
          - steps:
              - git: [clone, --quiet, https://github.com/example/app.git, app]
              - git: [checkout, --quiet, -b, app-1]
                dir: app
              - write: {path: app/change.txt, content: "the worker's change\n"}
              - git: [add, change.txt]
                dir: app
              - git: [commit, --quiet, -m, "feat: the worker's change"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - gh: [pr, create, --repo, example/app, --base, main, --head, app-1, --title, "feat: the worker's change", --body, "Closes https://github.com/example/app/issues/1"]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
          # The next session of the worker continues its branch and its
          # pull request: it pushes there and parks on it again.
          - steps:
              - git: [fetch, --quiet, origin]
                dir: app
              - write: {path: app/fix.txt, content: "the worker's fix\n"}
              - git: [add, fix.txt]
                dir: app
              - git: [commit, --quiet, -m, "fix: what the worker was told"]
                dir: app
              - git: [push, --quiet, origin, app-1]
                dir: app
              - beekeeper: [agents, park, --on, 'example/app#2', --post-merge, '', desk review]
                dir: app
      - name: 'Review app 2 r\d+'
        turns:
          - steps:
              - gh: [pr, view, '2', --repo, example/app, --json, headRefOid, --jq, .headRefOid]
                save: head
              - gh: [pr, review, '2', --repo, example/app, --comment, --body, "Desk review (opus): approved\nHead reviewed: `${head}`"]
              - beekeeper: [agents, idle, --done, --report, "Desk review (opus): approved https://github.com/example/app/pull/2", --problem, none]
  calls:
    # What the watch reads beside GitHub: no GitHub App login beside the gh
    # login, and empty journals of the kernel and of systemd-oomd.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}
    - program: journalctl
      args: ['-k']
      respond: {stdout: ""}
    - program: journalctl
      args: ['-u', systemd-oomd]
      respond: {stdout: ""}

when:
  # The watch's reading admits starts: the budget and the machine are fine.
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - exit: 0
  - name: start
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, outcome: finish}
        - github: {pull: {repo: example/app, number: 2, state: open}}
  - advance: 2s
  - name: ci-green
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  - name: review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - events: {contains: [agents.park, supervisor.review], not_contains: [session.report-rejected]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'Review app 2 r1', outcome: finish}
  - advance: 2s
  # Approved, not merged yet: the worker's next session pushes once more.
  - name: again
    run:
      args: [--as, supervisor loop, agents, start, app 1, /work/worker.txt, --harness, codex, --model, gpt-5.2-codex]
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: app 1, turns: 2, outcome: finish}
        - origin: {repository: example/app, branch: app-1, ahead: 2}
  - advance: 2s
  - name: ci-green-again
    github: {check: {repo: example/app, pull: 2, name: build, state: green}}
  # The approval was of the old head: no merge, a second review round.
  - name: second-review
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - calls: {program: gh, args: [pr, merge], max: 0}
      - github: {pull: {repo: example/app, number: 2, state: open}}
      - events: {not_contains: [merge.authorized]}
  - wait_for:
      timeout: 15s
      expect:
        - worker: {name: 'Review app 2 r2', outcome: finish}
  - advance: 2s
  - name: go
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
  - wait_for:
      timeout: 15s
      expect:
        - github: {pull: {repo: example/app, number: 2, state: merged}}
  - advance: 2s
  - name: end
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0

then:
  - github: {pull: {repo: example/app, number: 2, state: merged, merged_into: main}}
  - github: {issue: {repo: example/app, number: 1, state: closed, pulls: 1, open_pulls: 0}}
  - worker: {name: 'Review app 2 r1', turns: 1, outcome: finish}
  - worker: {name: 'Review app 2 r2', turns: 1, outcome: finish}
  - calls: {program: gh, args: [pr, merge], min: 1, max: 1}
  - events: {contains: [supervisor.review, merge.authorized, supervisor.merge, supervisor.end], not_contains: [merge.failed, session.report-rejected]}
