name: missing-harness-leaves-no-registration
description: >
  A forced start of a codex worker on a machine where codex is not on PATH
  fails before anything is launched: it names the missing executable, and
  the desk holds neither a start nor an agent for it. With capacity.ceiling
  0 the loop's pass then has no room for a worker for the Ready issue either.
  Moved from internal/loopworkflow TestWorkflow, case failed-start.
issue: https://github.com/giantswarm/beekeeper/issues/3797
flow: start
tags: [start, codex, capacity]
control:
  none: moves internal/loopworkflow TestWorkflow's failed-start case; states behavior main already has
timeout: 60s

given:
  desk:
    config:
      capacity: {ceiling: 0}
      # One watch reading admits the pass's starts: only the room holds it.
      watch: {interval: 1h}
      # The budget is probed on the scenario's repository.
      github: {probeRepo: example/app}
  github:
    repositories:
      - name: example/app
        issues:
          - {number: 1, title: Ready item, board: Ready}
  calls:
    - program: journalctl
      respond: {stdout: ""}
    # No GitHub App login beside the gh login: the budget is gh's.
    - program: devctl
      args: [auth, status]
      respond: {stdout: '{"github":{"present":false}}'}

when:
  # Only the candidate itself is reachable: PATH holds no harness at all.
  - name: start
    run:
      args: [--as, supervisor loop, agents, start, app-worker, /work/worker.txt, --harness, codex, --model, gpt-codex, --force]
      env: {PATH: /work/no-tools}
    expect:
      - exit: 1
      - stderr: {contains: ['"codex": executable file not found']}
  - name: roster
    run: {args: [agents, --json]}
    expect:
      - exit: 0
      - json_path: {path: ., len: 0}
  - name: watch
    run: {args: [watch, --once]}
    expect:
      - events: {contains: [watch.budget-state], not_contains: [watch.budget-error]}
  - name: pass
    run: {args: [supervisor, loop, --once]}
    expect:
      - exit: 0
      - output: {contains: ["SUPERVISOR REFILL started 0: no room for a worker"]}

then:
  - events: {not_contains: [agents.start]}
  - calls: {program: codex, max: 0}
  - github: {issue: {repo: example/app, number: 1, state: open, board: Ready}}
