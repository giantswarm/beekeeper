name: staged-canary-proves-a-good-candidate-and-fails-a-broken-one
description: >
  The staged canary runs a release candidate on the recorded fixture
  origin through worker start, pull request park, independent exact-head
  review and the coordinator's merge. A good candidate passes with
  evidence bound to its digest and the merge commit; a candidate whose
  pull parser drops the base fails with failed evidence and no merge
  commit, and so does the fixture without a checkout to validate in. Such
  evidence blocks every install route (internal/update TestEvidenceGate),
  and recorded evidence grants no eligibility either.
  Moved from internal/loopworkflow
  TestCanaryContainmentBlocksCoordinatorAndHostUpdate.
issue: https://github.com/giantswarm/beekeeper/issues/3797
flow: canary
tags: [canary, self-update, mutation]
control:
  none: moves internal/loopworkflow TestCanaryContainmentBlocksCoordinatorAndHostUpdate; states behavior main already has
timeout: 240s

given:
  # The canary's fixture serves its GitHub on loopback, which the
  # scenario's GitHub brings up.
  github:
    repositories:
      - name: example/app
  # The builds: the good candidate and the broken one, placed under
  # /work/releases/<build>/ (this platform's asset; the suite runs on
  # linux/amd64).
  install:
    candidate: {version: v1.0.0-rc.2, mutation: pull-parser-drops-the-base}
    previous: v1.0.0-rc.1

when:
  - name: good
    run:
      args: [self-update, --stage-canary, /work/releases/v1.0.0-rc.1/beekeeper-linux-amd64, --canary-recorded, --canary-run, canary-good]
    expect:
      - exit: 0
      - json_path: {path: status, equals: success}
      - json_path: {path: version, equals: v1.0.0-rc.1}
      - json_path: {path: merge_commit, len: 40}
  - name: broken
    run:
      args: [self-update, --stage-canary, /work/releases/v1.0.0-rc.2+pull-parser-drops-the-base/beekeeper-linux-amd64, --canary-recorded, --canary-run, canary-broken-parser]
    expect:
      - json_path: {path: status, equals: failed}
      - json_path: {path: merge_commit, equals: ""}
  - name: no-checkout
    run:
      args: [self-update, --stage-canary, /work/releases/v1.0.0-rc.1/beekeeper-linux-amd64, --canary-recorded, --canary-run, canary-missing-merge-validation, --canary-scenario, no-checkout]
    expect:
      - json_path: {path: status, equals: failed}
      - json_path: {path: merge_commit, equals: ""}

then:
  - {step: broken, exit: 1}
  - {step: no-checkout, exit: 1}
