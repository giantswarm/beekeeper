name: gate-unblocking-work-exempt
concept: gate
tags: [phase1, learning-gate-blocks-repair]
description: |
  Given a team cap of 1 item; bob's In Progress muster item (#100, in flight),
  blocked by an open Up Next klaus item assigned to bob (#120); and an eligible
  unassigned klaus item (#101, Priority 1)
  When the engine picks, alice first: she gets #101, which takes the team cap and
  the klaus repo
  Then #120 ranks first as work that unblocks in-flight work and is still picked
  for bob, held by no gate (neither TeamCap nor RepoConcurrency); nothing is held,
  and gate-not-holding-repair stays 0.
pre_configuration:
  fixture: base
  config:
    teams: [{ name: bumblebee, cap: { items: 1 } }]
  github:
    issues:
      - ref: giantswarm/roadmap#100
        title: Stream klaus session logs to the gateway
        body: |
          ### Acceptance criteria
          - [ ] logs arrive within 2s
          Repo: giantswarm/muster
        assignees: [bob]
        blockedBy: [giantswarm/roadmap#120]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#120
        title: Add a log buffer to the klaus session
        body: |
          ### Acceptance criteria
          - [ ] buffers the last 1000 lines per session
          Repo: giantswarm/klaus
        assignees: [bob]
        board: { status: "Up Next ➡️", kind: "Task 🗒️", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 1 }
steps:
  - id: team
    tool: get_team
    args: { name: bumblebee }
    expected:
      json_path:
        status.inFlight: 1
        status.wip.items: 0
        status.picks:
          - { person: alice, item: giantswarm/roadmap#101 }
          - { person: bob, item: giantswarm/roadmap#120 }
        status.held: null

  - id: unblocking-work-passes
    tool: get_item
    args: { ref: giantswarm/roadmap#120 }
    expected:
      json_path:
        status.shadow.pick: { person: bob, rank: 1 }
        status.shadow.heldBy: null
        status.shadow.actions:
          - { type: set-status, args: { status: "In Progress ⛏️" } }
          - { type: start-run, args: { purpose: implement } }

  - id: never-held
    tool: events
    args: { type: shadow.held }
    expected:
      json_path: { count: 0 }

  - id: invariant-holds
    tool: metric
    args: { name: engine_invariant_violations, labels: { invariant: gate-not-holding-repair } }
    expected:
      json_path: { value: 0 }
