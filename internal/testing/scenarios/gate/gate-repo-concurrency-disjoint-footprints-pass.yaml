name: gate-repo-concurrency-disjoint-footprints-pass
concept: gate
tags: [phase1]
description: |
  Given two eligible unassigned klaus items, #101 (Priority 1, `Footprint:
  pkg/client`) and #102 (Priority 2, `Footprint: pkg/metrics`)
  When the engine picks #101 for alice, which takes the repo, and then considers
  #102 for bob
  Then `parallel-safe?` is decided "yes" (both name footprints and they are
  disjoint) and recorded, and #102 is picked for bob, not held, with its
  would-actions.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
          Footprint: pkg/client
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 1 }
      - ref: giantswarm/roadmap#102
        title: Expose klaus session metrics
        body: |
          ### Acceptance criteria
          - [ ] a gauge per session state
          Repo: giantswarm/klaus
          Footprint: pkg/metrics
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 2 }
steps:
  - id: decided-yes
    tool: decisions
    args: { point: "parallel-safe?", item: giantswarm/roadmap#102 }
    expected:
      json_path:
        count: 1
        rows.0.other: giantswarm/roadmap#101
        rows.0.mode: shadow
        rows.0.rule: "yes"
        rows.0.chosen: "yes"

  - id: pick-passes
    tool: get_item
    args: { ref: giantswarm/roadmap#102 }
    expected:
      json_path:
        status.footprint: [pkg/metrics]
        status.shadow.pick: { person: bob, rank: 2 }
        status.shadow.heldBy: null
        status.shadow.actions:
          - { type: assign, args: { login: bob } }
          - { type: set-status, args: { status: "In Progress ⛏️" } }
          - { type: start-run, args: { purpose: implement } }

  - id: both-picked-nothing-held
    tool: get_team
    args: { name: bumblebee }
    expected:
      json_path:
        status.picks:
          - { person: alice, item: giantswarm/roadmap#101 }
          - { person: bob, item: giantswarm/roadmap#102 }
        status.held: null
