name: gate-team-cap-holds-picks
concept: gate
tags: [phase1]
description: |
  Given a team cap of 1 item, alice and bob with the default WIP of 1, and two
  eligible unassigned items in different repos (#101 Priority 1, #102 Priority 2)
  When the engine picks
  Then alice, first in turn, gets #101, which takes the cap; bob gets no pick, and
  his top candidate #102 is recorded as held for him by TeamCap: on the Item, the
  Person and the Team, with one shadow.held event and no would-action.
pre_configuration:
  fixture: base
  config:
    teams: [{ name: bumblebee, cap: { items: 1 } }]
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 1 }
      - ref: giantswarm/roadmap#102
        title: Count muster tool calls by outcome
        body: |
          ### Acceptance criteria
          - [ ] a counter per tool call outcome
          Repo: giantswarm/muster
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 2 }
steps:
  - id: team
    tool: get_team
    args: { name: bumblebee }
    expected:
      json_path:
        status.wip.items: 0
        status.picks:
          - { person: alice, item: giantswarm/roadmap#101 }
        status.held:
          - { person: bob, item: giantswarm/roadmap#102, gate: TeamCap }

  - id: bob-held
    tool: get_person
    args: { login: bob }
    expected:
      json_path:
        status.picks: null
        status.held:
          - { item: giantswarm/roadmap#102, gate: TeamCap }

  - id: item-held
    tool: get_item
    args: { ref: giantswarm/roadmap#102 }
    expected:
      json_path:
        status.eligible.value: true
        status.shadow.pick: null
        status.shadow.heldBy: { person: bob, gate: TeamCap }
        status.shadow.actions: null

  - id: held-event
    tool: events
    args: { item: giantswarm/roadmap#102, type: shadow.held }
    expected:
      json_path: { count: 1, rows.0.data.person: bob, rows.0.data.gate: TeamCap }

  - id: one-pick-event
    tool: events
    args: { type: shadow.pick }
    expected:
      json_path: { count: 1, rows.0.item: giantswarm/roadmap#101 }

  - id: no-actions-for-the-held-item
    tool: events
    args: { item: giantswarm/roadmap#102, type: shadow.action }
    expected:
      json_path: { count: 0 }
