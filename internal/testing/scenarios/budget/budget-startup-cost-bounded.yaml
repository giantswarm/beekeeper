name: budget-startup-cost-bounded
concept: budget
tags: [phase1, learning-api-budget]
description: |
  Given a team with 20 items on the board, 10 In Progress with an open PR each (5 in
  giantswarm/klaus, 5 in giantswarm/muster) and 10 in Up Next
  When the engine starts and makes its initial sync
  Then every item and PR is observed, and the sync costs at most:
  - GraphQL: 3 queries and 4 points: the board schema check (1 point), one page of
    the filtered board query (at most 2 points, as in board-startup-initial-sync;
    20 items fit in one page of 100, and GitHub prices a query by its shape, not by
    the items returned) and at most one probe (1 point).
  - REST: 43 calls: 4 per PR (the PR, its head's check runs, its head's statuses,
    its reviews) for 40, plus at most 3 installation-wide reads (the installation's
    repositories and the merge rules of the two code repos).
  - The delivery log, read with the App's JWT on its own bucket: 1 call.
  Issues come with the board query: there is no REST read per issue.
