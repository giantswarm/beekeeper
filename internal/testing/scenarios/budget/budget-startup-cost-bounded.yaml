steps:
  - id: all-observed
    tool: list_items
    args: { team: bumblebee }
    expected:
      json_path: { count: 20 }

  - id: last-pr-observed
    tool: get_change
    args: { ref: giantswarm/muster#405 }
    expected:
      json_path: { status.pr.headSha: h405, status.observed.source: startup }

  - id: graphql-bounded
    tool: github_calls
    args: { api: graphql }
    expected:
      json_path: { rateLimited: 0 }
      json_path_max: { count: 3, graphqlPoints: 4 }

  - id: one-board-page
    tool: github_calls
    args: { api: graphql, operation: BoardTeamItems }
    expected:
      json_path: { count: 1 }

  - id: rest-bounded
    tool: github_calls
    args: { api: rest }
    expected:
      json_path: { rateLimited: 0 }
      json_path_max: { count: 43 }

  - id: one-delivery-log-read
    tool: github_calls
    args: { api: app, operation: apps/list-webhook-deliveries }
    expected:
      json_path: { count: 1, rateLimited: 0 }

  - id: no-rest-read-per-issue
    tool: github_calls
    args: { api: rest, path: "/repos/giantswarm/roadmap/issues/*" }
    expected:
      json_path: { count: 0 }

  - id: budget-agrees
    description: The Budget, from the headers, shows the same spend
    tool: get_budget
    expected:
      json_path_min: { status.rest.remaining: 4957, status.graphql.remaining: 4996 }
