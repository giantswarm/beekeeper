name: webhook-invalid-signature-rejected
concept: webhook
tags: [phase1]
description: |
  Given a Change waiting on CI whose last required check has completed on GitHub,
  but whose webhook GitHub hasn't sent
  When a check_run delivery for that SHA is POSTed with an X-Hub-Signature-256 that doesn't
  match the App's webhook secret
  Then the receiver answers 401 and counts it as bad_signature, and nothing is processed:
  no GitHub read, no reconcile, and the Change still waits on CI.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: ci-completes-silently
    description: CI finishes green on GitHub, so a processed delivery would show
    tool: github_check_run
    args: { repo: giantswarm/klaus, sha: a1, name: "ci/circleci: go-test", status: completed, conclusion: success, deliver: never }

  - id: forged-delivery
    tool: webhook_post
    args:
      event: check_run
      action: completed
      signature: invalid
      body:
        check_run: { name: "ci/circleci: go-test", head_sha: a1, status: completed, conclusion: success }
        repository: { full_name: giantswarm/klaus }
        installation: { id: 200 }
    expected:
      json_path: { status_code: 401 }

  - id: counted-bad-signature
    tool: metric
    args: { name: engine_webhook_deliveries_total, labels: { outcome: bad_signature } }
    expected:
      json_path: { value: 1 }

  - id: none-accepted
    tool: metric
    args: { name: engine_webhook_deliveries_total, labels: { outcome: accepted } }
    expected:
      json_path: { value: 0 }

  - id: no-reads
    tool: github_calls
    args: { since_step: forged-delivery }
    expected:
      json_path: { count: 0 }

  - id: nothing-reconciled
    tool: reconciles
    args: { since_step: forged-delivery }
    expected:
      json_path: { count: 0 }

  - id: still-waiting
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.ci.state: pending, status.wait.on: ci }
