name: webhook-replayed-delivery-processed-once
concept: webhook
tags: [phase1]
description: |
  Given a Change waiting on CI for its head SHA, and one of its two required checks
  completed on GitHub
  When the validly signed check_run delivery is POSTed, and then POSTed again with the same
  X-GitHub-Delivery id (a replay)
  Then the first is accepted and wakes the Change, which still waits on CI; the second is
  answered 2xx, counted as duplicate and not processed again: no GitHub read, no reconcile.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: in_progress }
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: build-completes-silently
    tool: github_check_run
    args: { repo: giantswarm/klaus, sha: a1, name: "ci/circleci: go-build", status: completed, conclusion: success, deliver: never }

  - id: first-delivery
    tool: webhook_post
    args:
      event: check_run
      action: completed
      signature: valid
      delivery_id: 7c1e9a40-0001
      body:
        check_run: { name: "ci/circleci: go-build", head_sha: a1, status: completed, conclusion: success }
        repository: { full_name: giantswarm/klaus }
        installation: { id: 200 }
    expected:
      json_path_min: { status_code: 200 }
      json_path_max: { status_code: 299 }

  - id: first-processed
    tool: reconciles
    args: { change: giantswarm/klaus#55, since_step: first-delivery }
    expected:
      json_path_min: { count: 1 }

  - id: still-waiting-on-ci
    description: go-test is still running, so the Change keeps waiting on the same SHA
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.ci.state: pending, status.wait.ref: "ci:giantswarm/klaus@a1" }

  - id: replay
    tool: webhook_post
    args:
      event: check_run
      action: completed
      signature: valid
      delivery_id: 7c1e9a40-0001
      body:
        check_run: { name: "ci/circleci: go-build", head_sha: a1, status: completed, conclusion: success }
        repository: { full_name: giantswarm/klaus }
        installation: { id: 200 }
    expected:
      json_path_min: { status_code: 200 }
      json_path_max: { status_code: 299 }

  - id: replay-not-reconciled
    tool: reconciles
    args: { change: giantswarm/klaus#55, since_step: replay }
    expected:
      json_path: { count: 0 }

  - id: replay-not-read
    tool: github_calls
    args: { since_step: replay }
    expected:
      json_path: { count: 0 }

  - id: counted-duplicate
    tool: metric
    args: { name: engine_webhook_deliveries_total, labels: { event: check_run, outcome: duplicate } }
    expected:
      json_path: { value: 1 }

  - id: accepted-once
    tool: metric
    args: { name: engine_webhook_deliveries_total, labels: { event: check_run, outcome: accepted } }
    expected:
      json_path: { value: 1 }
