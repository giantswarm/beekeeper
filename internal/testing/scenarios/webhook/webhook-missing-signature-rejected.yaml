name: webhook-missing-signature-rejected
concept: webhook
tags: [phase1]
description: |
  Given an Up Next item on the board
  When an issues delivery for it is POSTed to /github/webhook without an X-Hub-Signature-256 header
  Then the receiver answers 401 and counts it as missing_signature, and nothing is processed:
  no GitHub read and no reconcile.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: unsigned-delivery
    tool: webhook_post
    args:
      event: issues
      action: edited
      signature: missing
      body:
        issue: { number: 101 }
        repository: { full_name: giantswarm/roadmap }
        installation: { id: 200 }
    expected:
      json_path: { status_code: 401 }

  - id: counted-missing-signature
    tool: metric
    args: { name: engine_webhook_deliveries_total, labels: { outcome: missing_signature } }
    expected:
      json_path: { value: 1 }

  - id: no-reads
    tool: github_calls
    args: { since_step: unsigned-delivery }
    expected:
      json_path: { count: 0 }

  - id: nothing-reconciled
    tool: reconciles
    args: { since_step: unsigned-delivery }
    expected:
      json_path: { count: 0 }
