name: webhook-valid-signature-accepted
concept: webhook
tags: [phase1]
description: |
  Given a Change waiting on CI whose last required check has completed on GitHub,
  but whose webhook GitHub hasn't sent
  When the check_run delivery is POSTed to /github/webhook with a valid X-Hub-Signature-256
  Then the receiver answers 2xx and counts it accepted, and the engine wakes the waiting
  Change, reads the check state from GitHub itself, and ends the CI wait through the webhook.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: ci-completes-silently
    description: CI finishes green on GitHub; the delivery is posted by hand in a later step
    tool: github_check_run
    args: { repo: giantswarm/klaus, sha: a1, name: "ci/circleci: go-test", status: completed, conclusion: success, deliver: never }

  - id: still-waiting
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.ci.state: pending, status.wait.on: ci }

  - id: delivery
    tool: webhook_post
    args:
      event: check_run
      action: completed
      signature: valid
      body:
        check_run: { name: "ci/circleci: go-test", head_sha: a1, status: completed, conclusion: success }
        repository: { full_name: giantswarm/klaus }
        installation: { id: 200 }
    expected:
      json_path_min: { status_code: 200 }
      json_path_max: { status_code: 299 }

  - id: counted-accepted
    tool: metric
    args: { name: engine_webhook_deliveries_total, labels: { event: check_run, outcome: accepted } }
    expected:
      json_path: { value: 1 }

  - id: read-from-github
    description: The delivery only woke the engine; it read the check state from GitHub
    tool: github_calls
    args: { since_step: delivery }
    expected:
      json_path_min: { count: 1 }

  - id: wait-ended
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.ci.state: green, status.wait.on: review }

  - id: woken-by-webhook
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.woken, since_step: delivery }
    expected:
      json_path:
        count: 1
        rows.0.source: webhook
