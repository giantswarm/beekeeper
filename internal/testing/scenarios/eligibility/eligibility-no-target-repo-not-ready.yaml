name: eligibility-no-target-repo-not-ready
concept: eligibility
tags: [phase1, ready]
description: |
  Given an Up Next issue in giantswarm/roadmap (a planning repo) with acceptance
  criteria but no Repo line, assigned to alice
  When the engine observes it
  Then no target repo is known, ready? decides "not-ready", the item is NotReady,
  and alice gets the one "refine" would-todo.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
        assignees: [alice]
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: not-ready
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.acceptanceCriteria: true
        status.targetRepos: null
        status.eligible.value: false
        status.eligible.reasons: [NotReady]
        status.shadow.pick: null
        status.shadow.actions[type=todo].args.to: alice

  - id: decided-not-ready
    tool: decisions
    args: { point: "ready?", item: giantswarm/roadmap#101 }
    expected:
      json_path: { count: 1, rows.0.rule: not-ready, rows.0.chosen: not-ready }

  - id: one-todo
    tool: events
    args: { item: giantswarm/roadmap#101, type: shadow.action }
    expected:
      json_path: { count: 1 }
