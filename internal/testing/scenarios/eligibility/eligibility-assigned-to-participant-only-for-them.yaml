name: eligibility-assigned-to-participant-only-for-them
concept: eligibility
tags: [phase1, pick]
description: |
  Given a ready Up Next item assigned to bob, and alice with free WIP and nothing
  else to do
  When the engine decides
  Then the item is eligible and picked for bob only; alice has no pick, and no
  would-action reassigns it.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [bob]
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: picked-for-bob
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.eligible.value: true
        status.owner: bob
        status.shadow.pick.person: bob
      not_contains: ["alice"] # no would-assign to anyone else

  - id: alice-has-no-pick
    tool: get_person
    args: { login: alice }
    expected:
      json_path: { status.free.items: 1, status.picks: null, status.held: null }

  - id: never-offered-to-alice
    tool: get_team
    args: { name: bumblebee }
    expected:
      json_path:
        status.picks: [{ person: bob, item: giantswarm/roadmap#101 }]
