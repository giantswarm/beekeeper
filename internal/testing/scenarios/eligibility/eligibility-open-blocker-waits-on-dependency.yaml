name: eligibility-open-blocker-waits-on-dependency
concept: eligibility
tags: [phase1, wake-index]
description: |
  Given a ready Up Next item assigned to alice that is blocked by an open issue
  When the engine observes it, and later the blocker is closed (issues.closed)
  Then the item is BlockedByOpenIssue with a dependency wait on the blocker (168h
  deadline, re-observe); closing the blocker wakes it through the wake index, the
  wait ends, and the item is eligible.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#100
        title: Klaus client API v2
        assignees: [bob]
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        blockedBy: [giantswarm/roadmap#100]
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: blocked
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.phase: Ready
        status.blockedBy: [{ ref: giantswarm/roadmap#100, state: open }]
        status.eligible.value: false
        status.eligible.reasons: [BlockedByOpenIssue]
        status.shadow.pick: null
        status.wait.on: dependency
        status.wait.ref: "issue:giantswarm/roadmap#100"
        status.wait.since: "2026-11-16T09:00:00Z"
        status.wait.deadline: "2026-11-23T09:00:00Z"
        status.wait.atDeadline: re-observe
        status.wait.state: watching

  - id: blocker-closed
    tool: github_issue_edit
    args: { ref: giantswarm/roadmap#100, state: closed }

  - id: unblocked
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.blockedBy: [{ ref: giantswarm/roadmap#100, state: closed }]
        status.eligible.value: true
        status.eligible.reasons: null
        status.wait: null

  - id: woken-by-webhook
    tool: events
    args: { item: giantswarm/roadmap#101, type: wait.woken, since_step: blocker-closed }
    expected:
      json_path: { count: 1, rows.0.source: webhook, rows.0.data.on: dependency }
