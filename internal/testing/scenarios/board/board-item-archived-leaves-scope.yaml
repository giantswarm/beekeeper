name: board-item-archived-leaves-scope
concept: board
tags: [phase1, scope]
description: |
  Given a Bumblebee item in Up Next, assigned to alice and blocked by an open
  issue, so it waits on that dependency
  When a person archives its board item (projects_v2_item.archived)
  Then the Item is deleted at once, with one item.removed event (reason archived),
  and so is its wait.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#100
        title: Klaus client API v2
        assignees: [bob]
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        blockedBy: [giantswarm/roadmap#100]
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: waiting-on-the-blocker
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.phase: Ready
        status.wait.on: dependency
        status.wait.ref: "issue:giantswarm/roadmap#100"

  - id: archived
    tool: github_board_archive
    args: { issue: giantswarm/roadmap#101 }

  - id: item-gone
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      success: false
      error_contains: ["not found"]

  - id: removed-event
    tool: events
    args: { item: giantswarm/roadmap#101, type: item.removed, since_step: archived }
    expected:
      json_path: { count: 1, rows.0.source: webhook, rows.0.data.reason: archived }

  - id: no-waits-left
    tool: metric
    args: { name: engine_waits }
    expected:
      json_path: { value: 0 }

  - id: no-team-items
    tool: list_items
    args: { team: bumblebee }
    expected:
      json_path: { count: 0 }
