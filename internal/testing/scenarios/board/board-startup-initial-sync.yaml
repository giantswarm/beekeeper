name: board-startup-initial-sync
concept: board
tags: [phase1, startup, learning-api-budget]
description: |
  Given a board with Bumblebee items in each active status (one with an open PR),
  a Bumblebee Backlog item and an Atlas item
  When the engine starts, and later restarts with nothing changed on GitHub
  Then after the start Items exist for exactly the team's active items, observed by
  startup, for a bounded number of GraphQL points and REST calls; and the restart
  re-reads with conditional REST requests that GitHub answers with free 304s.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        assignees: []
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#102
        title: Expose klaus session metrics
        body: |
          ### Acceptance criteria
          - [ ] a metric per session state
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#103
        title: Klaus session resume
        assignees: [bob]
        board: { status: "Blocked / Waiting ⛔️", kind: "Feature 💫", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#104
        title: Bump the klaus Go toolchain
        assignees: [bob]
        board: { status: "Validation ☑️", kind: "Task 🗒️", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#105
        title: Klaus plugin marketplace
        assignees: []
        board: { status: "Backlog 📦", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#106
        title: Rotate the Atlas dashboards' service accounts
        assignees: []
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Atlas 🗺️" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#102]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: active-items-exist
    tool: list_items
    args: { team: bumblebee }
    expected:
      json_path: { count: 4 }

  - id: in-progress-item
    tool: get_item
    args: { ref: giantswarm/roadmap#102 }
    expected:
      json_path:
        status.phase: Published
        status.changes: [giantswarm/klaus#55]
        status.observed.source: startup

  - id: blocked-item
    tool: get_item
    args: { ref: giantswarm/roadmap#103 }
    expected:
      json_path: { status.phase: Waiting, status.observed.source: startup }

  - id: validation-item
    tool: get_item
    args: { ref: giantswarm/roadmap#104 }
    expected:
      json_path: { status.phase: Validating, status.observed.source: startup }

  - id: change-observed
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.ci.state: pending
        status.wait.on: ci
        status.observed.source: startup

  - id: backlog-not-read
    tool: get_item
    args: { ref: giantswarm/roadmap#105 }
    expected:
      success: false
      error_contains: ["not found"]

  - id: one-board-query
    tool: github_calls
    args: { api: graphql, operation: BoardTeamItems }
    expected:
      json_path: { count: 1 }

  - id: startup-graphql-bounded
    description: The board schema check, the filtered board query and the first board probe
    tool: github_calls
    args: { api: graphql }
    expected:
      json_path_max: { count: 3, graphqlPoints: 4 }

  - id: startup-rest-bounded
    description: The installation's repos, and the one Change's PR, checks, statuses and reviews
    tool: github_calls
    args: { api: rest }
    expected:
      json_path_max: { count: 8 }

  - id: restart
    tool: engine_fault
    args: { kind: restart }

  - id: same-items-after-restart
    tool: list_items
    args: { team: bumblebee }
    expected:
      json_path: { count: 4 }

  - id: restart-rest-is-conditional
    description: The ETags survive the restart, so unchanged PRs and checks cost nothing
    tool: github_calls
    args: { since_step: restart, api: rest }
    expected:
      json_path_max: { count: 8 }
      json_path_min: { conditional: 2, notModified: 2 }
