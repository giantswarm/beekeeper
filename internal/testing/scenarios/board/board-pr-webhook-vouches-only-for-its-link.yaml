name: board-pr-webhook-vouches-only-for-its-link
concept: board
tags: [phase1, review]
description: |
  Given an Up Next item that alice moves to In Progress, and GitHub never sends (nor
  logs) the projects_v2_item webhook
  When alice opens a PR that closes the item and its pull_request webhook is delivered
  Then the engine reads the PR's closing issues and re-reads that item, which links the
  PR (a Change) and shows the move; the link came with its webhook, but the move counts
  as one missed projects_v2_item webhook all the same.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: started-unannounced
    tool: github_board_set
    args: { issue: giantswarm/roadmap#101, status: "In Progress ⛏️", deliver: never }

  - id: pr-opened
    tool: github_pr_open
    args: { ref: giantswarm/klaus#55, author: alice, head: a1, closes: [giantswarm/roadmap#101] }

  - id: linked
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.changes: [giantswarm/klaus#55]
        status.board.status: "In Progress ⛏️"
        status.observed.source: webhook

  - id: change-created
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.pr.state: open, status.pr.headSha: a1 }

  - id: no-board-resync
    tool: github_calls
    args: { since_step: pr-opened, api: graphql, operation: BoardTeamItems }
    expected:
      json_path: { count: 0 }

  - id: move-missed
    tool: metric
    args: { name: engine_webhook_missed_total, labels: { event: projects_v2_item } }
    expected:
      json_path: { value: 1 }

  - id: link-not-missed
    tool: metric
    args: { name: engine_webhook_missed_total, labels: { event: pull_request } }
    expected:
      json_path: { value: 0 }
