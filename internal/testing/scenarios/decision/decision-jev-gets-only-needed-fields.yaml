name: decision-jev-gets-only-needed-fields
concept: decision
tags: [phase1]
description: |
  Given two ready items, one assigned to alice and one to bob
  When the engine asks JEV `ready?` for each
  Then every request carries exactly the item's title and body: no assignees or
  other logins, and nothing of the other item.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#102
        title: Count muster tool calls by outcome
        body: |
          ### Acceptance criteria
          - [ ] a counter per tool call outcome
          Repo: giantswarm/muster
        assignees: [bob]
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: title-and-body-only
    tool: jev_calls
    args: { point: "ready?" }
    expected:
      json_path:
        count: 2
        requests.0.fields: [title, body]
        requests.1.fields: [title, body]
      not_contains: [alice, bob, assignees]
