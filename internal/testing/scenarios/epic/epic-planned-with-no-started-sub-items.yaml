name: epic-planned-with-no-started-sub-items
concept: epic
tags: [phase1]
description: |
  Given a Bumblebee epic with two sub-items, both still in Up Next
  When the engine observes them
  Then the epic is Planned and lists both sub-items.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#90
        title: Klaus session resilience
        assignees: [alice]
        board: { status: "Up Next ➡️", kind: "Epic 🎯", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        parent: giantswarm/roadmap#90
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#102
        title: Resume klaus sessions after a gateway restart
        body: |
          ### Acceptance criteria
          - [ ] a session survives a gateway restart
          Repo: giantswarm/klaus
        assignees: [alice]
        parent: giantswarm/roadmap#90
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: planned
    tool: get_item
    args: { ref: giantswarm/roadmap#90 }
    expected:
      json_path:
        status.class: Epic
        status.phase: Planned
        status.subItems: [giantswarm/roadmap#101, giantswarm/roadmap#102]
