name: pick-recomputed-when-priority-changes
concept: pick
tags: [phase1, human-edits]
description: |
  Given two eligible unassigned items, #101 (Priority 2) picked for alice and #102
  (Priority 3) picked for bob
  When a person sets #102's Priority to 1 on the board
  Then the engine reorders from the webhook: #102 ranks first and becomes alice's
  pick, #101 becomes bob's, and each changed pick is recorded once.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 2 }
      - ref: giantswarm/roadmap#102
        title: Count muster tool calls by outcome
        body: |
          ### Acceptance criteria
          - [ ] a counter per tool call outcome
          Repo: giantswarm/muster
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 3 }
steps:
  - id: before
    tool: get_team
    args: { name: bumblebee }
    expected:
      json_path:
        status.picks:
          - { person: alice, item: giantswarm/roadmap#101 }
          - { person: bob, item: giantswarm/roadmap#102 }

  - id: reprioritised
    tool: github_board_set
    args: { issue: giantswarm/roadmap#102, priority: 1 }

  - id: after
    tool: get_team
    args: { name: bumblebee }
    expected:
      json_path:
        status.picks:
          - { person: alice, item: giantswarm/roadmap#102 }
          - { person: bob, item: giantswarm/roadmap#101 }

  - id: new-top
    tool: get_item
    args: { ref: giantswarm/roadmap#102 }
    expected:
      json_path:
        status.board.priority: 1
        status.shadow.pick: { person: alice, rank: 1 }

  - id: both-picks-recorded-once
    tool: events
    args: { type: shadow.pick, since_step: reprioritised }
    expected:
      json_path: { count: 2, rows.0.source: webhook, rows.1.source: webhook }
