name: pick-unassigned-items-for-free-people
concept: pick
tags: [phase1]
description: |
  Given alice and bob, each with the default WIP of one item and no engine WIP, and
  two eligible unassigned items in Up Next
  When the engine decides
  Then the first item in order is picked for alice and the next for bob (people in
  login order), each pick records the would-actions "assign the person", "set In
  Progress" and "start an implement run", and nothing is written: both items stay
  unassigned in Up Next.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 1 }
      - ref: giantswarm/roadmap#102
        title: Count muster tool calls by outcome
        body: |
          ### Acceptance criteria
          - [ ] a counter per tool call outcome
          Repo: giantswarm/muster
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝", priority: 2 }
steps:
  - id: team-picks
    tool: get_team
    args: { name: bumblebee }
    expected:
      json_path:
        status.wip.items: 0
        status.picks:
          - { person: alice, item: giantswarm/roadmap#101 }
          - { person: bob, item: giantswarm/roadmap#102 }
        status.held: null

  - id: alice-pick
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.shadow.pick: { person: alice, rank: 1 }
        status.shadow.heldBy: null
        status.shadow.actions:
          - { type: assign, args: { login: alice } }
          - { type: set-status, args: { status: "In Progress ⛏️" } }
          - { type: start-run, args: { purpose: implement } }

  - id: bob-pick
    tool: get_item
    args: { ref: giantswarm/roadmap#102 }
    expected:
      json_path:
        status.shadow.pick: { person: bob, rank: 2 }
        status.shadow.heldBy: null
        status.shadow.actions:
          - { type: assign, args: { login: bob } }
          - { type: set-status, args: { status: "In Progress ⛏️" } }
          - { type: start-run, args: { purpose: implement } }

  - id: alice-person
    tool: get_person
    args: { login: alice }
    expected:
      json_path:
        status.wip.items: 0
        status.free.items: 1
        status.picks: [giantswarm/roadmap#101]

  - id: six-would-actions
    tool: events
    args: { type: shadow.action }
    expected:
      json_path: { count: 6 }

  - id: not-executed
    description: The Item still shows the board as it is; nothing was assigned or moved
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.assignees: null
        status.board.status: "Up Next ➡️"
        status.phase: Ready

  - id: no-github-write
    tool: github_calls
    expected:
      json_path: { mutating: 0 }
