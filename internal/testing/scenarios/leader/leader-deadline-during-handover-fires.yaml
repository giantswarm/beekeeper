name: leader-deadline-during-handover-fires
concept: leader
tags: [phase1]
description: |
  Given two engine replicas, engine-0 leading and engine-1 standing by, and a Change waiting
  on CI with a deadline at 10:00
  When the leader dies and the engine's clock passes the deadline before the standby leads
  Then engine-1, once it leads, handles the missed deadline exactly once (one re-observe,
  CI unchanged, so the wait becomes overdue), the dead leader writes nothing more, and
  wait-within-deadline holds past the grace.
pre_configuration:
  fixture: base
  engine: { replicas: 2 }
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: waiting
    description: No pipeline history yet, so the CI deadline is the default hour
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.wait.on: ci
        status.wait.deadline: "2026-11-16T10:00:00Z"
        status.wait.state: watching

  - id: engine-0-leads
    tool: get_installation
    expected:
      json_path: { status.leader: engine-0 }

  - id: kill
    tool: engine_fault
    args: { kind: kill_leader }

  - id: deadline-in-the-gap
    description: The deadline passes while no replica leads; still inside the 5m grace
    tool: clock_advance
    args: { by: 1h2m }

  - id: handled-after-takeover
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      wait_for_state: 10s
      json_path: { status.wait.on: ci, status.wait.state: overdue }

  - id: engine-1-leads
    tool: get_installation
    expected:
      json_path: { status.leader: engine-1 }

  - id: past-the-grace
    tool: clock_advance
    args: { by: 10m }

  - id: deadline-fired-once
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.deadline, since_step: kill }
    expected:
      json_path: { count: 1 }

  - id: overdue-once
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.overdue, since_step: kill }
    expected:
      json_path: { count: 1 }

  - id: dead-leader-wrote-nothing
    tool: object_writes
    args: { replica: engine-0, since_step: kill }
    expected:
      json_path: { count: 0 }

  - id: invariant-holds
    tool: metric
    args: { name: engine_invariant_violations, labels: { invariant: wait-within-deadline } }
    expected:
      json_path: { value: 0 }
