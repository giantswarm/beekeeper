name: leader-restart-rebuilds-wake-index
concept: leader
tags: [phase1, wake-index]
description: |
  Given two engine replicas and two Changes waiting on CI for different SHAs
  When the engine restarts and, once it leads again, CI completes on one SHA
  Then the check_run webhook still wakes exactly the Change waiting on that SHA:
  the wake index is rebuilt from the objects, not lost with the process.
pre_configuration:
  fixture: base
  engine: { replicas: 2 }
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#102
        title: Expose klaus session metrics
        body: |
          ### Acceptance criteria
          - [ ] a metric per session state
          Repo: giantswarm/klaus
        assignees: [bob]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
      - ref: giantswarm/klaus#56
        author: bob
        head: b1
        closes: [giantswarm/roadmap#102]
        checks:
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: waiting
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.wait.on: ci, status.wait.ref: "ci:giantswarm/klaus@a1" }

  - id: restart
    tool: engine_fault
    args: { kind: restart }

  - id: leading-again
    description: The restarted engine has a leader once it records its startup observations
    tool: events
    args: { type: observed, source: startup, since_step: restart }
    expected:
      wait_for_state: 10s
      json_path_min: { count: 1 }

  - id: ci-completes
    tool: github_check_run
    args: { repo: giantswarm/klaus, sha: a1, name: "ci/circleci: go-test", status: completed, conclusion: success }

  - id: woken
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      wait_for_state: 10s
      json_path: { status.ci.state: green, status.wait.on: review }

  - id: woken-by-webhook
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.woken, since_step: ci-completes }
    expected:
      json_path:
        count: 1
        rows.0.source: webhook

  - id: other-change-untouched
    tool: reconciles
    args: { change: giantswarm/klaus#56, since_step: ci-completes }
    expected:
      json_path: { count: 0 }
