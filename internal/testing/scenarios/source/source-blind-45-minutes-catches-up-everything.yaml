name: source-blind-45-minutes-catches-up-everything
concept: source
tags: [phase1, learning-blind-watcher, learning-unobserved-not-stalled]
description: |
  Given two In Progress items with open PRs waiting on CI (klaus#55 and muster#12)
  When every webhook delivery fails for 45 minutes (GitHub logs each one as failed)
  while CI turns green and red, the authors push, and reviews request changes
  Then the 09:05 delivery-log check degrades the webhooks source (deliveries-failed) and its
  waiters poll every 5 minutes from 09:10; each change is observed within one interval of
  happening (each is checked exactly 5 minutes after it, by the log check, whose failed
  deliveries name the refs to re-observe, and by the polls), including changes to a Change
  that holds no wait (red CI, changes requested); the polled waits keep watching, so nothing
  is unobserved or overdue; every lost delivery counts once as a missed webhook; and after
  deliveries succeed again, the first clean check with a successful delivery since the gap
  (09:50) makes the source fresh and polling stops.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#102
        title: Report muster tool latency
        body: |
          ### Acceptance criteria
          - [ ] a latency histogram per tool
          Repo: giantswarm/muster
        assignees: [bob]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
      - ref: giantswarm/muster#12
        author: bob
        head: c1
        closes: [giantswarm/roadmap#102]
        checks:
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: deliveries-fail
    description: From 09:00 every delivery fails and GitHub logs it as failed
    tool: github_fault
    args: { kind: deliveries, mode: lost }

  # 09:00: CI finishes on both PRs
  - id: klaus-ci-green
    tool: github_check_run
    args: { repo: giantswarm/klaus, sha: a1, name: "ci/circleci: go-test", status: completed, conclusion: success }
  - id: muster-ci-red
    tool: github_check_run
    args: { repo: giantswarm/muster, sha: c1, name: "ci/circleci: go-test", status: completed, conclusion: failure }
  - id: first-interval
    tool: clock_advance
    args: { by: 5m }
  - id: klaus-green-seen
    description: Seen from the failed delivery's payload; the new review wait is polled, so watching
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.ci.state: green, status.wait.on: review, status.wait.state: watching }
  - id: muster-red-seen
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path: { status.ci.state: red, status.wait: null }
  - id: webhooks-degraded
    tool: get_installation
    expected:
      json_path: { status.sources.webhooks.state: degraded, status.sources.webhooks.reason: deliveries-failed }

  # 09:15: bob pushes a fix, and bob asks for changes on klaus#55
  - id: quiet-until-0915
    tool: clock_advance
    args: { by: 10m }
  - id: muster-push
    tool: github_pr_push
    args: { ref: giantswarm/muster#12, head: c2 }
  - id: klaus-changes-requested
    tool: github_pr_review
    args: { ref: giantswarm/klaus#55, by: bob, state: changes_requested }
  - id: second-interval
    tool: clock_advance
    args: { by: 5m }
  - id: muster-push-seen
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path: { status.pr.headSha: c2, status.wait.on: ci, status.wait.ref: "ci:giantswarm/muster@c2" }
  - id: klaus-review-seen
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.review.state: changes-requested, status.wait: null }
  - id: klaus-item-fixing
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path: { status.phase: Fixing, status.wait: null }

  # 09:30: CI on the fix goes green
  - id: quiet-until-0930
    tool: clock_advance
    args: { by: 10m }
  - id: muster-fix-green
    tool: github_check_run
    args: { repo: giantswarm/muster, sha: c2, name: "ci/circleci: go-test", status: completed, conclusion: success }
  - id: third-interval
    tool: clock_advance
    args: { by: 5m }
  - id: muster-green-seen
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path: { status.ci.sha: c2, status.ci.state: green }

  # 09:40: alice pushes an update, and alice asks for changes on muster#12
  - id: quiet-until-0940
    tool: clock_advance
    args: { by: 5m }
  - id: klaus-push
    tool: github_pr_push
    args: { ref: giantswarm/klaus#55, head: a2 }
  - id: muster-changes-requested
    tool: github_pr_review
    args: { ref: giantswarm/muster#12, by: alice, state: changes_requested }
  - id: fourth-interval
    tool: clock_advance
    args: { by: 5m }
  - id: klaus-push-seen
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.pr.headSha: a2
        status.wait.on: ci
        status.wait.ref: "ci:giantswarm/klaus@a2"
        status.wait.state: watching
  - id: muster-review-seen
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path: { status.review.state: changes-requested }
  - id: still-degraded-at-0945
    description: The 09:40 changes were a new gap, so the source is still degraded and polling
    tool: get_installation
    expected:
      json_path: { status.sources.webhooks.state: degraded, status.sources.webhooks.polling: true }

  # 09:45: deliveries work again
  - id: deliveries-recover
    tool: github_fault
    args: { kind: clear }
  - id: delivered-again
    tool: github_check_run
    args: { repo: giantswarm/klaus, sha: a2, name: "ci/circleci: go-build", status: completed, conclusion: success }
  - id: next-log-check
    description: 09:50, a clean check interval with a successful delivery since the gap
    tool: clock_advance
    args: { by: 5m }
  - id: fresh-again
    tool: get_installation
    expected:
      json_path: { status.sources.webhooks.state: fresh, status.sources.webhooks.polling: false }
  - id: still-watching
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.wait.on: ci, status.wait.state: watching }

  - id: each-lost-delivery-missed-once
    description: 3 check runs, 2 pushes and 2 reviews were lost; the delivered check run is not missed
    tool: metric
    args: { name: engine_webhook_missed_total }
    expected:
      json_path: { value: 7 }
  - id: nothing-unobserved
    tool: events
    args: { type: wait.unobserved, since_step: deliveries-fail }
    expected:
      json_path: { count: 0 }
  - id: nothing-overdue
    tool: events
    args: { type: wait.overdue, since_step: deliveries-fail }
    expected:
      json_path: { count: 0 }
