name: invariant-gate-holding-exempt-work-detected
concept: invariant
tags: [phase1]
description: |
  Given alice's In Progress item blocked by her open story #102, and a gate that holds
  everything
  When a person moves #102 from Backlog (where it isn't an Item) to Up Next
  Then the engine holds it for alice although work that unblocks in-flight work is exempt
  from all gates, and gate-not-holding-repair reports it.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        blockedBy: [giantswarm/roadmap#102]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#102
        title: Classify klaus client errors as transient or final
        body: |
          ### Acceptance criteria
          - [ ] 5xx and timeouts are transient
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "Backlog 📦", kind: "Story 📑", team: "Bumblebee🐝" }
expect_violations: [gate-not-holding-repair]
steps:
  - id: gate-holds-everything
    tool: engine_fault
    args: { kind: gate_everything }

  - id: blocker-up-next
    tool: github_board_set
    args: { issue: giantswarm/roadmap#102, status: "Up Next ➡️" }

  - id: eligible
    tool: get_item
    args: { ref: giantswarm/roadmap#102 }
    expected:
      json_path: { status.phase: Ready, status.eligible.value: true }

  - id: held
    tool: events
    args: { item: giantswarm/roadmap#102, type: shadow.held, since_step: blocker-up-next }
    expected:
      json_path: { count: 1, rows.0.data.person: alice }

  - id: detected
    tool: metric
    args: { name: engine_invariant_violations, labels: { invariant: gate-not-holding-repair } }
    expected:
      json_path: { value: 1 }
