name: invariant-overnight-stall-alerts-within-minutes
concept: invariant
tags: [phase1, learning-overnight-epic]
description: |
  Given an epic whose sub-items (one in giantswarm/klaus, one in giantswarm/muster) are Up
  Next at 20:00 on a Monday evening, picked for alice and bob
  When the leader stops deciding at 21:00, right after the 21:00 board resync's decision pass
  Then leader-decides is violated by 21:21, as soon as the last decision pass is older than
  two board resync intervals (20m), so the stall alerts the same evening instead of being
  discovered in the morning.
pre_configuration:
  fixture: base
  clock: "2026-11-16T20:00:00Z"
  github:
    issues:
      - ref: giantswarm/roadmap#90
        title: Survive GitHub outages
        body: |
          Make the klaus and muster GitHub clients survive GitHub outages.
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Epic 🎯", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        parent: giantswarm/roadmap#90
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
      - ref: giantswarm/roadmap#102
        title: Back off on secondary rate limits in muster's GitHub client
        body: |
          ### Acceptance criteria
          - [ ] honours Retry-After
          Repo: giantswarm/muster
        assignees: [bob]
        parent: giantswarm/roadmap#90
        board: { status: "Up Next ➡️", kind: "Story 📑", team: "Bumblebee🐝" }
expect_violations: [leader-decides]
steps:
  - id: evening-picks
    tool: get_team
    args: { name: bumblebee }
    expected:
      json_path:
        status.picks:
          - { person: alice, item: giantswarm/roadmap#101 }
          - { person: bob, item: giantswarm/roadmap#102 }

  - id: healthy-hour
    tool: clock_advance
    args: { by: 1h }

  - id: healthy-at-nine
    tool: metric
    args: { name: engine_invariant_violations, labels: { invariant: leader-decides } }
    expected:
      json_path: { value: 0 }

  - id: decisions-stop
    description: At 21:00 the leader trips over itself and stops deciding
    tool: engine_fault
    args: { kind: stop_decisions }

  - id: just-over-twenty-minutes-later
    tool: clock_advance
    args: { by: 21m }

  - id: alerting-by-21-21
    tool: metric
    args: { name: engine_invariant_violations, labels: { invariant: leader-decides } }
    expected:
      json_path: { value: 1 }

  - id: last-decision-at-nine
    tool: get_installation
    expected:
      json_path: { status.lastDecisionAt: "2026-11-16T21:00:00Z" }
