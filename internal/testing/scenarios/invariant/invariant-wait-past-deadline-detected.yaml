name: invariant-wait-past-deadline-detected
concept: invariant
tags: [phase1]
description: |
  Given a Change waiting on CI with a deadline at 10:00, and a timer queue that stops firing
  When the clock passes the deadline plus the 5m grace
  Then wait-within-deadline reports the unhandled wait while the wait still says watching,
  and once the timer queue works again the deadline is handled (the wait becomes overdue)
  and the invariant is back to 0.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
expect_violations: [wait-within-deadline]
steps:
  - id: waiting
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.wait.on: ci, status.wait.deadline: "2026-11-16T10:00:00Z" }

  - id: timers-stop
    tool: engine_fault
    args: { kind: stop_timers }

  - id: past-deadline-and-grace
    tool: clock_advance
    args: { by: 1h10m }

  - id: detected
    tool: metric
    args: { name: engine_invariant_violations, labels: { invariant: wait-within-deadline } }
    expected:
      json_path: { value: 1 }

  - id: not-handled
    description: The wait itself doesn't show the fault
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.wait.state: watching }

  - id: timers-work-again
    tool: engine_fault
    args: { kind: resume }

  - id: handled
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.wait.on: ci, status.wait.state: overdue }

  - id: deadline-fired-once
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.deadline, since_step: timers-stop }
    expected:
      json_path: { count: 1 }

  - id: cleared
    tool: metric
    args: { name: engine_invariant_violations, labels: { invariant: wait-within-deadline } }
    expected:
      json_path: { value: 0 }
