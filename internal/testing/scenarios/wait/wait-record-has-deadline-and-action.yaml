name: wait-record-has-deadline-and-action
concept: wait
tags: [phase1, deadline]
description: |
  Given an In Progress item in giantswarm/klaus and no observed pipeline durations for that repo
  When its PR is opened at 09:07 and CI has not finished on the head SHA
  Then the Change carries a ci wait on that SHA with since = the engine clock at the
  observation, deadline = since + 1h (the configured defaultDeadline, used while there is no
  history) and atDeadline re-observe, and a wait.started row records it.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
steps:
  - id: later
    tool: clock_advance
    args: { by: 7m }

  - id: pr-opened
    description: alice opens the PR at 09:07; no check has reported yet
    tool: github_pr_open
    args: { ref: giantswarm/klaus#55, author: alice, head: a1, closes: [giantswarm/roadmap#101] }

  - id: wait-record
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.ci.sha: a1
        status.ci.state: pending
        status.wait.on: ci
        status.wait.ref: "ci:giantswarm/klaus@a1"
        status.wait.since: "2026-11-16T09:07:00Z"
        status.wait.deadline: "2026-11-16T10:07:00Z"
        status.wait.atDeadline: re-observe
        status.wait.state: watching

  - id: wait-started-row
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.started, since_step: pr-opened }
    expected:
      json_path:
        count: 1
        rows.0.at: "2026-11-16T09:07:00Z"
        rows.0.source: webhook
        rows.0.data.on: ci

  - id: gauge
    tool: metric
    args: { name: engine_waits, labels: { on: ci, state: watching } }
    expected:
      json_path: { value: 1 }
