name: wait-lost-webhook-woken-by-deadline
concept: wait
tags: [phase1, deadline, learning-waits-dont-wake]
description: |
  Given a Change waiting on CI in giantswarm/klaus, whose observed pipelines take 4m, so the
  ci deadline is 3 × 4m = 12m (09:12), earlier than the 15-minute changes resync
  When CI completes green and GitHub never sends the check_run webhook (so it is not in the
  delivery log either)
  Then the delivery-log checks at 09:05 and 09:10 see no gap and the webhooks source stays
  fresh, and at the deadline the re-observe finds CI green and ends the wait; the change
  counts as a missed check_run webhook.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
  history:
    ci: [{ repo: giantswarm/klaus, durations: [4m, 4m, 4m] }]
steps:
  - id: check-never-sent
    tool: github_check_run
    args: { repo: giantswarm/klaus, sha: a1, name: "ci/circleci: go-test", status: completed, conclusion: success, deliver: never }

  - id: before-deadline
    tool: clock_advance
    args: { by: 11m }

  - id: still-waiting
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.ci.state: pending
        status.wait.state: watching
        status.wait.deadline: "2026-11-16T09:12:00Z"

  - id: log-shows-no-gap
    description: A delivery that was never sent leaves no trace in the delivery log
    tool: get_installation
    expected:
      json_path: { status.sources.webhooks.state: fresh }

  - id: deadline
    tool: clock_advance
    args: { by: 1m }

  - id: wait-ended
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.ci.state: green
        status.wait.on: review

  - id: woken-at-deadline
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.woken, since_step: deadline }
    expected:
      json_path:
        count: 1
        rows.0.source: reobserve
        rows.0.data.on: ci

  - id: counted-as-missed
    tool: metric
    args: { name: engine_webhook_missed_total, labels: { event: check_run } }
    expected:
      json_path: { value: 1 }
