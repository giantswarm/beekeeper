name: wait-delayed-delivery-processed-once
concept: wait
tags: [phase1, wake-index]
description: |
  Given a Change waiting on CI
  When CI completes green at 09:00 but GitHub delays the check_run delivery by 20 minutes
  Then the 09:15 changes resync observes the green CI first and ends the wait (one wake,
  source resync); when the delivery arrives at 09:20 it is accepted but changes nothing: no
  second wake, no new observation, and the Change still waits on review.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: check-delayed
    tool: github_check_run
    args: { repo: giantswarm/klaus, sha: a1, name: "ci/circleci: go-test", status: completed, conclusion: success, deliver: { delay: 20m } }

  - id: resync
    tool: clock_advance
    args: { by: 15m }

  - id: seen-by-resync
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.ci.state: green
        status.wait.on: review

  - id: woken-once
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.woken, since_step: check-delayed }
    expected:
      json_path:
        count: 1
        rows.0.source: resync

  - id: delivery-arrives
    tool: clock_advance
    args: { by: 5m }

  - id: delivery-accepted
    tool: metric
    args: { name: engine_webhook_deliveries_total, labels: { event: check_run, outcome: accepted } }
    expected:
      json_path: { value: 1 }

  - id: no-second-wake
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.woken, since_step: delivery-arrives }
    expected:
      json_path: { count: 0 }

  - id: no-new-observation
    tool: events
    args: { change: giantswarm/klaus#55, type: observed, since_step: delivery-arrives }
    expected:
      json_path: { count: 0 }

  - id: unchanged
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.ci.state: green
        status.wait.on: review

  - id: missed-counted-once
    description: First seen by the resync, so counted as missed once; the late arrival doesn't change that
    tool: metric
    args: { name: engine_webhook_missed_total, labels: { event: check_run } }
    expected:
      json_path: { value: 1 }
