name: wait-merge-result-observed
concept: wait
tags: [phase1, merge-result]
description: |
  Given an approved PR in giantswarm/muster that is green on its head SHA (Item phase Merging);
  the repo's only required check is "ci/circleci: go-test"
  When alice merges it at 09:00 (merge commit m1), and at 09:20 the required status on m1
  turns green
  Then before the merge neither the Merging Item nor its Change has a wait (nothing is
  pending until someone merges); the merge is observed: the Change is merged, its ci keeps
  the head's verdict (a1, green) while it waits on the merge commit with the mergeResult
  deadline (2h, atDeadline re-observe), and the Item is Merged with no wait of its own; the
  green status on m1 makes mergeResult green and ends the Change's wait, and the Item stays
  Merged with no wait until the board says Validation or Done.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Add a dry-run flag to muster serve
        body: |
          ### Acceptance criteria
          - [ ] `muster serve --dry-run` starts no servers
          Repo: giantswarm/muster
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/muster#12
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        statuses: [{ context: "ci/circleci: go-test", state: success }]
        reviews: [{ by: bob, state: approved }]
steps:
  - id: merging
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path:
        status.phase: Merging
        status.wait: null

  - id: nothing-pending-before-the-merge
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path: { status.ci.state: green, status.review.state: approved, status.wait: null }

  - id: alice-merges
    tool: github_pr_merge
    args: { ref: giantswarm/muster#12, merge_sha: m1, by: alice }

  - id: merge-observed
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path:
        status.pr.state: merged
        status.pr.mergeSha: m1
        status.ci.sha: a1
        status.ci.state: green
        status.mergeResult.sha: m1
        status.mergeResult.state: pending
        status.wait.on: ci
        status.wait.ref: "ci:giantswarm/muster@m1"
        status.wait.since: "2026-11-16T09:00:00Z"
        status.wait.deadline: "2026-11-16T11:00:00Z"
        status.wait.atDeadline: re-observe
        status.wait.state: watching

  - id: item-merged
    description: The Change carries the merge-result wait; the Item has none of its own
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path: { status.phase: Merged, status.wait: null }

  - id: later
    tool: clock_advance
    args: { by: 20m }

  - id: merge-commit-green
    tool: github_status
    args: { repo: giantswarm/muster, sha: m1, context: "ci/circleci: go-test", state: success }

  - id: result-green
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path:
        status.mergeResult.sha: m1
        status.mergeResult.state: green
        status.mergeResult.relevant: ["ci/circleci: go-test"]
        status.wait: null

  - id: item-still-merged
    description: Moving it on is up to the board; the engine expects nothing more
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path: { status.phase: Merged, status.wait: null }

  - id: wait-ended
    tool: events
    args: { change: giantswarm/muster#12, type: wait.ended, since_step: merge-commit-green }
    expected:
      json_path:
        count: 1
        rows.0.source: webhook
        rows.0.data.on: ci
