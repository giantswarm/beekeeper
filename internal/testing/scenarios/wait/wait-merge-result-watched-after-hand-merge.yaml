name: wait-merge-result-watched-after-hand-merge
concept: wait
tags: [phase1, merge-result, learning-hand-merge]
description: |
  Given a PR in giantswarm/muster whose required check is red on its head SHA a1 (Item phase
  Fixing, no wait on the Item or the Change)
  When alice merges it anyway at 09:00 (merge commit m1, past the red check), and the required
  check then fails on m1 too
  Then the hand merge is observed like any other change (one observed row, from the webhook),
  the Change's ci keeps the red head verdict it went past (a1, red), the merge-result wait on
  m1 is created and watched as for any merge, and the red merge result is seen: main is
  watched no matter who merged. With the merge result in, the Merged Item and its Change
  have no wait.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Add a dry-run flag to muster serve
        body: |
          ### Acceptance criteria
          - [ ] `muster serve --dry-run` starts no servers
          Repo: giantswarm/muster
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/muster#12
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        statuses: [{ context: "ci/circleci: go-test", state: failure }]
        reviews: []
steps:
  - id: red-head
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path: { status.phase: Fixing, status.wait: null }

  - id: hand-merge
    tool: github_pr_merge
    args: { ref: giantswarm/muster#12, merge_sha: m1, by: alice }

  - id: merge-recorded
    description: One observed row for the merge, seen through the webhook
    tool: events
    args: { change: giantswarm/muster#12, type: observed, since_step: hand-merge }
    expected:
      json_path: { count: 1, rows.0.source: webhook }
      contains: [pr.state]

  - id: merge-result-watched
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path:
        status.pr.state: merged
        status.pr.mergeSha: m1
        status.ci.sha: a1
        status.ci.state: red
        status.mergeResult.sha: m1
        status.mergeResult.state: pending
        status.wait.on: ci
        status.wait.ref: "ci:giantswarm/muster@m1"
        status.wait.atDeadline: re-observe
        status.wait.state: watching

  - id: item-merged
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path: { status.phase: Merged }

  - id: main-goes-red
    tool: github_status
    args: { repo: giantswarm/muster, sha: m1, context: "ci/circleci: go-test", state: failure }

  - id: result-red
    tool: get_change
    args: { ref: giantswarm/muster#12 }
    expected:
      json_path:
        status.mergeResult.sha: m1
        status.mergeResult.state: red
        status.wait: null

  - id: item-still-merged
    tool: get_item
    args: { ref: giantswarm/roadmap#101 }
    expected:
      json_path: { status.phase: Merged, status.wait: null }

  - id: merge-reached-its-check
    tool: metric
    args: { name: engine_invariant_violations, labels: { invariant: merge-reaches-result-check } }
    expected:
      json_path: { value: 0 }
