name: wait-survives-restart
concept: wait
tags: [phase1, deadline]
description: |
  Given a Change waiting on CI since 09:00 with its deadline at 10:00
  When the engine restarts at 09:30
  Then the wait is kept as it was on the Change (same since and deadline, no new wait
  started), and at 10:00 its deadline still fires: one re-observe and, CI being unchanged,
  the wait becomes overdue.
pre_configuration:
  fixture: base
  github:
    issues:
      - ref: giantswarm/roadmap#101
        title: Retry transient errors in the klaus client
        body: |
          ### Acceptance criteria
          - [ ] retries 5xx up to three times
          Repo: giantswarm/klaus
        assignees: [alice]
        board: { status: "In Progress ⛏️", kind: "Story 📑", team: "Bumblebee🐝" }
    pulls:
      - ref: giantswarm/klaus#55
        author: alice
        head: a1
        closes: [giantswarm/roadmap#101]
        checks:
          - { name: "ci/circleci: go-build", status: completed, conclusion: success }
          - { name: "ci/circleci: go-test", status: in_progress }
steps:
  - id: later
    tool: clock_advance
    args: { by: 30m }

  - id: restart
    tool: engine_fault
    args: { kind: restart }

  - id: wait-kept
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path:
        status.wait.on: ci
        status.wait.since: "2026-11-16T09:00:00Z"
        status.wait.deadline: "2026-11-16T10:00:00Z"
        status.wait.state: watching

  - id: no-new-wait
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.started, since_step: restart }
    expected:
      json_path: { count: 0 }

  - id: to-deadline
    tool: clock_advance
    args: { by: 30m }

  - id: deadline-fired
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.deadline, since_step: to-deadline }
    expected:
      json_path:
        count: 1
        rows.0.at: "2026-11-16T10:00:00Z"

  - id: reobserved-once
    tool: events
    args: { change: giantswarm/klaus#55, type: wait.reobserved, since_step: to-deadline }
    expected:
      json_path: { count: 1 }

  - id: overdue
    tool: get_change
    args: { ref: giantswarm/klaus#55 }
    expected:
      json_path: { status.ci.state: pending, status.wait.state: overdue }
