<!doctype html>
<meta charset="utf-8">
<!-- A form-free comment box: the file input is hidden by the widget and
     its immediate wrapper generates no box. The editor remains visible. -->
<section id="comment-box">
  <div class="editor">
    <textarea aria-label="Comment"></textarea>
    <div style="display:contents">
      <div style="display:contents">
        <input type="file" id="attachment" style="display:none">
      </div>
    </div>
  </div>
</section>
