# A complete beekeeper configuration: one desk running agents for an
# organisation with three installations, one of them production, on an
# 86 GiB workstation whose Claude Desktop scope is capped at 48 GiB.
#
# Copy it to $XDG_CONFIG_HOME/beekeeper/config.yaml (or pass --config, or set
# $BEEKEEPER_CONFIG) and replace the placeholder names. Every key is
# optional; the comment after a key names its default when it has one. The
# organisation and desk keys (kube, alerts.installations, lanes, the role
# names) are unset by default, and memory thresholds default to fractions of
# the machine's RAM, swap or filesystem. The values below are absolute, sized
# for the machine above: tune them to yours or delete them.

# stateDir: /home/ada/.local/state/beekeeper   # default: $XDG_STATE_HOME/beekeeper
identity:
  # Whose agents run here: every lease, hold, merge place and note this
  # machine's commands record names them, and lease, lanes and note list
  # show them beside the session's name.
  person: ada@example.com   # the person's verified email, stable across identity providers
  team: platform            # the person's team
  # host: ada-workstation   # default: the machine's host name, without the domain
# serve:                    # beekeeper serve, the central instance behind muster
#   issuer: https://dex.example.com   # the Dex every caller's ID token is checked against
#   clientIDs: [muster]     # the audiences accepted: muster's client, the installations' exchange client
#   organization: example:everyone           # the group every member carries; anyone else is refused
#   teams: {example:platform: platform}      # a Dex group and the team its members belong to
#   supervisors: {platform: example:platform-supervisors}   # who releases a team's leases and lifts its holds
#   muster: https://muster.example.com/mcp   # the muster a send_message to a kagent: address goes through, as the caller
#   kagent: {staging: x_kagent_invoke_agent_instance}   # an installation and its kagent's invoke tool on that muster
#   people: {ada: ada@example.com}           # a name decisions are filed --for, and the person's email
#   channels: {platform: C0123456789}        # a team's Slack channel its decisions (--for team:<name>) go to
#   gateway:                                 # klaus-gateway, which puts decisions to their addressee in Slack
#     url: http://klaus-gateway.klaus-gateway.svc   # without it, decisions stay in beekeeper
#     tokenFile: /var/run/secrets/klaus-gateway/token   # the default: the projected ServiceAccount token, audience klaus-gateway
#     answerTool: x_beekeeper_note_answer    # the default: the muster tool an answer in Slack calls, as the person
#     sendTool: x_beekeeper_send_message     # the default: the muster tool a reply in an agent's conversation calls, as the person
# central:                  # the central instance (beekeeper serve behind muster): the shared installations' leases and the roster
#   context: staging        # the muster context it is reached through, as the person (muster auth login --context staging)
#   server: beekeeper       # the default: its name in muster, whose tools are x_<server>_<tool>
#   muster: muster          # the default: the muster binary
#   timeout: 30s            # the default: the bound of one call
# leaseDir: /home/ada/.local/state/beekeeper/leases   # default: <stateDir>/leases, one directory per held lease
resources: [kind-1, kind-2, staging, production, homelab]   # leasable besides the browser (and the model server)
labs: {kind-1: kind, kind-2: kind-2}   # a lab lease and the kind cluster it stands for
grantTTL: 30m               # a grant expires this long after its resource is free
shell: zsh                  # the shell the hook runs a rewritten build in; default: $SHELL, else sh
maxKindClusters: 2          # kind clusters the machine runs at most; default: one per 40 GiB of RAM, at least one

kube:
  # The installation agents never write to: a context or cluster name with it
  # as a component (login.example.com-production, production-ops). Unset, the
  # kube guard is off and snapshot says so.
  production: production
  # An installation's kube context; {installation} is its name. It resolves
  # alerts.installations and leased installations without a context, and
  # refusals name it. Unset: the context named after the installation, else
  # the one ending in @<name>.
  contextTemplate: login.example.com-{installation}
  # The kubeconfig files a k8s:// source of beekeeper secret resolves its
  # context in, merged as kubectl merges a KUBECONFIG list (~/ allowed); a
  # kind lab's context reads through kind instead. Unset: KUBECONFIG's files,
  # else ~/.kube/config.
  kubeconfig: [~/.kube/config, ~/.local/state/beekeeper/kube/teleport.yaml]

# The Teleport login the kube contexts run `tsh kube credentials` with. Set,
# beekeeper install adds the keeper (beekeeper-teleport.timer), which renews
# the SSO login before it expires: a fresh tsh login in a staging home under
# the browser lease (tsh opens the login URL in the default browser, whose
# SSO session completes it), swapped into the profile directory in one step.
# watch and snapshot show the expiry. Unset, no keeper runs.
teleport:
  proxy: login.example.com:443   # tsh login --proxy
  auth: github              # tsh login --auth, the SSO connector; default: the cluster's
  # tsh: tsh                # the default
  # home: /home/ada/.tsh    # the profile directory; default: $TELEPORT_HOME, else ~/.tsh
  renewBefore: 90m          # the default; the keeper renews this long before the expiry
  warnBefore: 1h            # the default; watch says TELEPORT LOGIN under this, at most renewBefore
  loginTimeout: 3m          # the default; one login, the browser's round trip included
  every: 10m                # the default; how often the keeper's timer reads the expiry

github:
  floor: 2500               # the default; budget under which GitHub work stops
  urgentBound: 200          # the default; what an urgent merge (lanes urgent) keeps for itself under the floor
  probeRepo: example-org/tools   # default: giantswarm/beekeeper; any repository the token can read

overlaps:
  ignore: [example-org/issues, example-org/roadmap]   # trackers every session mentions
  activeWithin: 1h

watch:
  interval: 30s
  repeat: 10m
  budgetEvery: 5m
  availMinMiB: 10240        # LOW RAM under this MemAvailable; default: 12% of RAM
  swapMaxMiB: 10000         # SWAP over this much disk swap (zswap's share not counted) while it grows and MemAvailable falls; default: 60% of swap
  swapWindow: 10m           # the default; how far back swap's growth rate looks (SWAP, OOMD IMMINENT, capacity's swap guard), at least 5m: a writeback burst older than this has left the rate
  oomdHeadroomMinMiB: 1024  # OOMD IMMINENT, only when oomd watches a cgroup for swap and disk swap grows while MemAvailable falls: under this much swap growth left before oomd's SwapUsedLimit; default: 6% of swap
  oomdWithin: 30m           # ... or when the last hour's growth rate reaches the trigger within this
  scopeAnonMaxMiB: 28000    # DESKTOP SCOPE anon over this (cache is reclaimable, anon is not); default: 32% of RAM
  gttMaxMiB: 24576          # IGPU GTT over this (RAM the GPU driver pins, in no cgroup); default: 28% of RAM
  loadPerCoreMax: 1.5       # HIGH LOAD over this × cores of 1-minute load average; also strains the machine
  # loadMax: 45             # an absolute HIGH LOAD threshold instead; set, it replaces loadPerCoreMax
  psiMax: 10
  cpuPSIMax: 40             # CPU PRESSURE over this some avg10 (%) for two samples; installation reads then slow down
  forkRateMax: 50           # PROCESS STORM this many forks/s over the usual rate for two samples; negative: off
  stackMax: 3               # STACKED over this many copies of one command line, each over a minute old; negative: off
  toolProcsMax: 1000        # LOAD over this many processes of the tools below, machine-wide; negative: off
  tools: [kubectl, helm, tsh, gh, flux, devctl]   # the default
  tmpMaxMiB: 20000          # TMPFS /tmp over this; default: 45% of /tmp's size
  diskMinMiB: 102400        # LOW DISK under this free on /; default: 5% of its size
  diskCriticalMiB: 20480    # DISK NEARLY FULL under this free on /; default: 1% of its size
  diskFillWithin: 2h        # DISK FILLING while / would run full within this at its last ten minutes' rate
  quietSessions: ["test: *"]   # the default; short-lived sessions whose start and end are logged, not said
  notify: false             # the default; true: the standby watch beekeeper install writes runs with --notify

memcap:                     # beekeeper run's build slots and cap
  slots: 2                  # the default
  max: 12G                  # a command's MemoryMax (systemd size); default: 14% of RAM; $MEMCAP_MAX and --max override
  cpuQuota: 1200%           # memcap.slice's CPUQuota, every run together (100% is one core); default: half the cores
  cpuWeight: 50             # memcap.slice's CPUWeight against the desktop's slices (100 each); the default

ollama:                     # the host's ollama, whose loaded models sit in the iGPU's GTT; unset url, none
  url: http://localhost:11434   # GET /api/ps
  unit: ollama              # the systemd unit whose journal names the client that loaded a model
  budgetGiB: 12             # a model-server claim's budget without --gib
  maxBudgetGiB: 24          # the most a claim may ask for
  nameOnly: false           # true: the watch names a model no lease covers and leaves it loaded
  labTests: [models-test]   # lab subcommands that run turns on the host's models, refused outside the lease
lemonade:                   # the host's Lemonade Server, under the same lease and budgets; unset, none
  url: http://localhost:13305   # GET /api/v1/health, POST /api/v1/unload

lanes:                      # merges that roll the same components of an installation, one at a time
  - name: platform
    installation: production
    context: login.example.com-production   # default: kube.contextTemplate's, else the context named after it
    repositories: [example-org/portal, example-org/platform-chart]
  - name: serving
    installation: production
    repositories: [example-org/model-manager, example-org/cluster-manager]

merge:
  cap: 5                    # devctl processes on the machine when a merge starts
  sessionCap: 2             # merges one session runs at once; its others wait without polling GitHub (-1: no cap)
  queueTTL: 15m             # a queued merge keeps its place this long after its run ended
  seedTTL: 12h              # a place queued with lanes queue --for, from its seeding or last arrival; a failed run's, from the failure
  settle: 5m                # a lane waits this long after a merge whose release is unknown
  settleTimeout: 30m        # then refuses its next merge while the release has not rolled
  budgetFresh: 1m           # the last budget reading is used this long, then read afresh
  stallAfter: 5m            # a lane's first arrived merge waits this long behind absent places, then the lane is stalled
  hungAfter: 45m            # the watch ends a running merge's devctl this long after its pull request merged (a closed one's this long after its start)
  ciTimeout: 1h             # devctl pr merge's --timeout (its CI wait) when the command names none; devctl's own 30m is shorter than a CI --update-branch restarts
  toolLimit: 9m             # a foreground gate call exits 76 this long after its start, below a desktop Bash call's 10m limit; the merge runs on and its outcome wakes the caller
  devctlOwners: [giantswarm]   # the owners devctl pr merge serves; default: none, every merge is the plain squash merge

alerts:
  installations:            # read always; a held lease whose name has a kube context is read too
    - production            # context from kube.contextTemplate
    - staging
    - {name: homelab, context: admin@homelab, floor: warning}   # floor: the lowest severity shown
  tenant: example-org       # the Mimir tenant (X-Scope-OrgID) read first; unset, only kube-prometheus-stack's Alertmanager
  ignore: [Heartbeat, InhibitionOutsideWorkingHours, Watchdog, NoisyRuntimePolicyMatch]   # default: [Watchdog]
  team: my-team             # marked in capitals and counted; its alerts that only InhibitionOutsideWorkingHours inhibits are read too
  collapse: 3               # more changes of one alertname in one reading are one line
  every: 5m
  timeout: 1m               # per installation, port-forwards included, a failed attempt tried again within it; also bounds the upgrade reading
  flap: {changes: 4, window: 1h}   # an alert's 4th change within 1h is one FLAPPING line, then quiet until stable for 1h
  pageSeverity: page        # a firing alert at it (team's, when set) with no owner (alerts own) for ownerGrace is PAGE UNOWNED, again every ownerGrace
  ownerGrace: 15m
  pagerduty:                # the second source: the team's PagerDuty services' open incidents; off without context
    context: example        # the muster context whose PagerDuty MCP server is read, as the person; beekeeper holds no PagerDuty token
    server: pd              # its muster name: x_<server>_<tool>, the read-only list_incidents and list_alerts_from_incident
    services: [PABC123]     # the team's service ids
    every: 1m               # a page is a PAGERDUTY NEW line within it
  quiet:                    # alerts whose changes are logged, not said; default: [{severity: notify}] once team is set, else none
    - {cluster: "t-*"}      # fields installation, cluster, alertname, severity, globs; a page only by a rule naming a cluster
    - {severity: notify}    # other teams' and team-less notify alerts

upgrades:
  every: 5m                 # each installation's Cluster API upgrades are read this often; every watch.interval while one runs on it

supervisor:                 # what handover --prompt tells the successor supervisor; unset skill and instructions, it opens without them
  skill: beekeeper:supervise   # the skill it runs (the plugin's role, see the README); or instructions: ~/supervisor.md, a file that opens the prompt
  scope: The desk's sessions, kind labs and merge lanes.   # default: the resources, lanes and installations configured
  relayAt: 400k             # watch says RELAY DUE once the supervisor's context reaches this, at a quiet moment
  relayTTL: 15m             # a relay not taken by the successor's start expires
  relayGrace: 30m           # still over relayAt this long after RELAY DUE, the standby watch relays the supervisor itself
  restartGrace: 30s         # a CLI back within this of first seen gone is a restart; past it, SUPERVISOR GONE and a fresh successor
  dir: ~/src/desk            # the folder a successor starts in (default: where its predecessor's desktop session started, never its worktree)
  profile: ""                # the tool profile (agents.profiles or minimal) of its successors and its holder's headless wakes; empty: none
guide:                      # the guide's role: what guide handover --prompt tells its successor, and its relay
  person: Ada               # guide queue and guide watch show only the notes for this person (any case); unset, every --for note
  waitingTTL: 2h            # a session that waits on the person and stopped longer ago folds into one line (guide queue --full lists it); 0: never
  skill: beekeeper:guide    # the skill its successor runs; or instructions: ~/guide.md; unset, it opens without them
  relayAt: 150k             # guide watch says GUIDE RELAY DUE once the guide's context reaches this
  relayTTL: 15m
  relayGrace: 30m
  restartGrace: 1m
  dir: ~/src/desk
agents:                     # the hand-over of registered agents
  relayAt: 400k             # watch says HANDOVER DUE once an agent's context reaches this; default: supervisor.relayAt
  lastStepGrace: 30m        # an agent over relayAt in its task's last step (its serve record waits on the report or says the merge landed, or the gate saw its merge land) is HANDOVER HELD this long from that evidence, its report expected
  lastStepCeiling: 500k     # the context at which the hand-over is due whatever the last step; default: a quarter above relayAt
  noteWait: 3m              # agents handover waits this long for the agent's note
  staleAfter: 24h           # the doctor takes an idle agent with no CLI running off the roster after this, unless kept (agents keep, a timer that wakes it); 0: never
  archiveAgreement: ""      # where the person agreed that finished workers' desktop sessions are archived without asking, never their own (quoted to the steward, which confirms each with agents archivable); empty: no steward is asked to archive
  dir: ~/src/desk           # every agent beekeeper starts runs here (start, handover, a role's successor); empty: the caller's folder
  roots: [~/src/worktrees]  # with dir set, a --dir is refused unless it is dir or under one of these
  profile: desk-worker      # the tool profile of the workers agents start creates: their task runs as a headless turn under it; empty: none, the task runs as a desktop turn with the person's whole tool surface
  profiles:                 # the desk's tool profiles; beekeeper ships minimal (its tools below, plugins [beekeeper], mcpServers [claude-in-chrome]), which one named minimal here replaces
    desk-worker:
      tools: [Bash, Read, Edit, Write, Skill, ToolSearch, SendMessage, ListAgents, TaskStop, WebFetch, WebSearch]   # built-in tools kept (--tools); empty: Claude Code's default set
      plugins: [beekeeper, desk-plugin]   # plugins kept by name or id; every other installed plugin, of any marketplace, is disabled; empty: all stay
      mcpServers: [claude-in-chrome, board]   # MCP servers kept (allowedMcpServers), claude.ai connectors included; empty: all stay
      deny: []              # further permission rules refused (permissions.deny); a bare tool or mcp__<server> name takes it off the tool list
  autoResume: false         # the watch resumes a parked agent (agents park --on) with what settled its note or pull request; false: it says AGENT RESUMABLE, agents resume does it by hand
  shell:                    # the agent shell's prelude, written by beekeeper hook sessionstart before each Bash command
    unalias: [grep, find, ls, cp, mv, rm]   # aliases and shell functions removed, so each runs the tool on PATH; []: none
    globs: literal          # an unmatched glob stays as written; shell: the shell's own behaviour (zsh: no matches found)
    path: [~/.local/share/devctl/agent-bin]   # directories first on PATH, in this order: the agent's own programs (a gh link to devctl acts with the App's short-lived token); default: none
capacity:                   # the busy agents the supervisor keeps (beekeeper capacity, watch's CAPACITY LOW / FULL)
  floor: 5                  # CAPACITY LOW under this many busy agents, when the headroom allows a start
  ceiling: 10               # CAPACITY FULL at this many; no start past it
  availMinMiB: 20480        # a start needs this MemAvailable; also the floor under which disk swap's growth refuses one
  swapGrowthMaxMiB: 256     # disk swap growing faster than this per hour (over watch.swapWindow) refuses a start under memory pressure, and is a warning after the verdict without
  swapPSIMax: 0             # the default; memory pressure (full avg60 of /proc/pressure/memory, %) up to which that growth is only a warning while MemAvailable is over availMinMiB
doctor:                     # known faults the doctor (beekeeper doctor, every watch poll) probes and remedies
  faults:
    - name: registry-login  # an example: a login unit answering 401, fixed by a restart
      probe: systemctl --user is-active --quiet registry-login.service   # exits 0 while the fault is absent
      remedy: systemctl --user restart registry-login.service
      unattended: true      # the watch runs the remedy by itself; false: one note for guide.person
  goCacheMaxGiB: 20         # the default; trims the shared Go build cache over this, LRU first, to 3/4; negative: off
  goCacheEvery: 1h          # the default; how often a watch reads the cache's size
reporter:                   # the scheduled status reporter the standby watch starts; off without every and brief
  every: 1h                 # one report per interval, on its multiples (on the hour)
  brief: ~/.local/state/desk/report-brief.md   # what to report and where to post it
  model: claude-sonnet-5    # default: Claude Code's
  person: Ada               # who the report is for; default: guide.person
  dir: ~/projects/notebook  # the session's working directory; default: home
  timeout: 20m              # a reporter that has not posted by then is stopped
  tz: Europe/Berlin         # the report's time zone; default: the machine's
  reviews: [example/plans]  # repositories whose open draft pull requests wait for the person's review
feedback:                   # the person's replies to the reports in Slack, to the supervisor or the agent they name; off without context
  context: gazelle          # the muster context whose Slack MCP server is read, as the person
  server: slack             # its muster name: x_<server>_<tool>
  every: 5m                 # how often the report threads are read
  window: 24h               # how long after its post a report's thread is read
outbound:                   # what the hook refuses to let leave the machine (README: What leaves the machine)
  phrases: [Project Nightjar]   # never in an issue, commit, post or plan; case-insensitive, named by number in a refusal
  paths: [~/projects/notebook/plans]   # files whose Write and Edit are scanned like a post; a directory covers what is under it
  storeDeny:                # op item|document create|edit, vault kv put|patch refused (globs; empty: any)
    - {vault: Shared*, item: "*personal*"}
  sweepRoots: [~]           # the watch looks here for world-readable private keys and credentials in git remote URLs
  sweepDepth: 5

hooks:
  scope:                    # where the Claude Code hooks act; unset, in every session
    dirs: [~/projects/notebook, ~/projects/work]   # a session whose cwd or project lies under one; beekeeper's own starts, roles and roster agents always

scan:                       # the value scanner's index (README: What reaches the model); beekeeper scan index reads these
  sops: [~/projects/configs/*/secrets/*.enc.yaml]   # SOPS file globs (no **), decrypted by sops in beekeeper's process
  vaults: [Team Shared]     # 1Password vaults whose concealed fields are fingerprinted (op item get --reveal)
  minLength: 12             # shorter values are not indexed

sandbox:                    # the agent sandbox (README: The agent sandbox); beekeeper sandbox render prints the policy
  allowRead: [~/projects, ~/.go, ~/.local/bin]   # re-allowed under the denied home directory: checkouts, toolchains
  allowWrite: [~/projects, ~/.cache, ~/go/pkg/mod]   # writable too: checkouts and worktrees, build and module caches
  domains: [proxy.golang.org, sum.golang.org, registry.npmjs.org, 127.0.0.1:6443]   # hosts commands reach besides GitHub; loopback by port only (a kind lab's API server)
  mask:                     # the default: GH_TOKEN and GITHUB_TOKEN, to GitHub's hosts only
    - {name: GH_TOKEN, hosts: [github.com, api.github.com, uploads.github.com]}

plans:                      # note add --for <guide.person> links an open pull request here only once its stage check is green
  repositories: [example-org/plans]   # owner/repo; unset, nothing is read
  check: plan-stages        # the stage check's name (default)

apps:                       # where the organisation declares its GitHub Apps; beekeeper app allow records only a declared one
  repo: example/github      # the declaring repository, read on its default branch; unset, app allow refuses
  manifest: apps/{name}/manifest.json   # an App's manifest (name, callback_urls), {name} for the App's name

board:                      # the project board `beekeeper board next` picks work from
  owner: example-org        # the organisation (or user) and the board's number
  project: 12
  team: Platform            # the Team field's value of the desk's items; empty: every item
  people: [example-person]  # an item assigned to anybody else is skipped
  staleAfter: 8760h         # the default; an item without activity for longer is skipped
  order:                    # the first free item of the first step that offers one is picked
    - {name: page, kind: [alert]}   # Status and Kind values or an unambiguous part ("up next")
    - {name: In Progress, status: [in progress], subIssues: true}   # an epic offers its open sub-issues
    - {name: blocker cleared, status: [blocked], unblocked: true}   # every recorded blocker closed
    - {name: Up Next epic, status: [up next], kind: [epic], subIssues: true}
    - {name: Up Next, status: [up next]}
    - {name: bug, status: [backlog], kind: [bug]}
    - {name: queue, search: "repo:example-org/tools label:team/platform"}   # open issues, oldest first
    - {name: Backlog, status: [backlog], createdWithin: 2160h}

claude:
  desktopApp: claude-desktop   # the default; the desktop app's executable, which opens claude:// links

omp:
  sessionsDir: ~/.omp/agent/sessions   # the default; omp's session files, one folder per working directory
  modelsFile: ~/.omp/agent/models.yml  # the default; omp's providers, a vault provider's apiKey there the variable's name (SPARK_API_KEY)
  model: ""                 # agents start --harness omp without --model: an exact selector omp lists (provider/id); empty: the start is refused
  providers:                # providers whose key agents start hands over from the vault, by their name in modelsFile
    spark:
      apiKey: op://Shared/spark/credential   # the key's reference, never the key: it goes into the agent's environment alone

desktop:
  typingQuiet: 30s          # the default; a claude:// link waits for this much idle keyboard and pointer input; negative: no wait

metrics:
  models:                   # USD per million tokens and the context window; an entry replaces the default of its id
    my-model: {input: 1, output: 5, cacheWrite5m: 1.25, cacheWrite1h: 2, cacheRead: 0.1, fast: 2, contextWindow: 200000}   # fast: fast mode's multiplier
  runaway:                  # watch says RUNAWAY once per session and figure over these; negative: off
    githubCallsPerHour: 1000
    sameErrorRepeats: 10    # the same failing tool call in the last hour
    contextFill: 0.9

notify:                     # what watch --notify sends to the desktop; the machine's lines never notify
  kinds: [due, budget, stale-lease, no-supervisor, page-unowned]   # the default: all
  quietHours: "22:00-07:00" # local time; holds everything but critical; default: none
  urgency: {stale-lease: critical, due: normal}   # low, normal, critical; no-supervisor and page-unowned default to critical
  repeat: 30m               # a lasting condition (budget) notifies again after this
