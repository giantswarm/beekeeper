# Repo-specific CircleCI jobs, merged into the generated workflows.yml by the
# setup workflow in config.yml.
#
# The generated go-build job runs only `make test`, where the envtest-backed
# tests of the Kubernetes store skip without KUBEBUILDER_ASSETS and the
# mailbox tests without BEEKEEPER_TEST_DATABASE_URL. This job runs them
# against a real kube-apiserver from setup-envtest and a Postgres beside it,
# after checking that the committed CRDs are what pkg/apis generates. Its
# first image is the one the architect orb's executor runs.
#
# test-stable-version runs `make test` linked with a stable release's version
# on every branch: go-build links a branch's or an RC's version, which the
# state store neither stamps nor judges, so a test that only fails under a
# stable version would otherwise first fail on the stable tag.
#
# chart-test lints helm/beekeeper and runs its helm-unittest suites, in a plain
# container: the dependencies are helm and its plugin, not Go tooling. The
# versions are pinned so a plugin release cannot turn an unrelated PR red.
#
# test-performance runs the performance budgets (docs/performance.md) on a
# generated desk, never on a desk's machine: CLI calls, the idle loop and
# concurrent calls, its report in the job output and artifacts. Its control
# step proves the loop budgets reject main before the fix of
# https://github.com/giantswarm/beekeeper/issues/3657. The session footprint
# needs a systemd user manager and runs nightly in GitHub Actions
# (.github/workflows/performance.yaml).
version: 2.1

jobs:
  test-loop-workflow:
    docker:
    - image: gsoci.azurecr.io/giantswarm/architect:8.6.47
      entrypoint: /bin/bash
    resource_class: medium
    environment:
      LANG: C.UTF-8
      BEEKEEPER_TEST_LOOP_ARTIFACTS: /tmp/loop-workflow-artifacts
    steps:
    - checkout
    - architect/tools-info
    - architect/go-cache-restore
    - run:
        name: Prove merge-result goconst honors ignore-tests with the real linter
        command: |
          set -euo pipefail
          golangci-lint version
          BEEKEEPER_TEST_REAL_LINT=1 go test ./cmd -run '^TestMergeResultRealLintIgnoreTests$' -count=1 -timeout=5m -v
    - run:
        name: Exercise the real supervisor binary and historical parser control
        no_output_timeout: 15m
        command: timeout 15m make test-loop-workflow
    - run:
        name: Replay standstills and reject the historical defects
        no_output_timeout: 30m
        command: bash .circleci/standstill-controls.sh
    - store_artifacts:
        path: /tmp/loop-workflow-artifacts
        destination: loop-workflow
    - architect/go-cache-save

  test-large-history:
    docker:
    - image: gsoci.azurecr.io/giantswarm/architect:8.6.47
      entrypoint: /bin/bash
    resource_class: medium
    environment:
      BEEKEEPER_TEST_LARGE_HISTORY: "1"
    steps:
    - checkout
    - architect/tools-info
    - architect/go-cache-restore
    - run:
        name: Bound startup and pass latency with 450k events and 1 GiB of history
        no_output_timeout: 25m
        command: go test ./cmd -run '^TestLargeHistoryStartupAndPass$' -count=1 -timeout=25m -v
    - run:
        name: Bound capacity latency with a large snapshot and event log
        command: go test ./cmd -run '^TestCapacityLargeSnapshotLatency$' -count=1 -timeout=2m -v
    - run:
        name: Record cached state and event read cost
        command: |
          set -o pipefail
          mkdir -p /tmp/state-performance
          go test ./internal/state -run '^$' -bench '^Benchmark(UnchangedSnapshot|CachedEvents)$' -benchtime=1s -benchmem | tee /tmp/state-performance/benchmarks.txt
    - store_artifacts:
        path: /tmp/state-performance
        destination: state-performance
    - architect/go-cache-save

  test-performance:
    docker:
    - image: gsoci.azurecr.io/giantswarm/architect:8.6.47
      entrypoint: /bin/bash
    resource_class: medium
    environment:
      BEEKEEPER_PERF_REPORT: /tmp/performance
    steps:
    - checkout
    - architect/tools-info
    - architect/go-cache-restore
    - run:
        name: Budgets for CLI calls, the idle loop and concurrent calls on a generated desk
        no_output_timeout: 20m
        command: make test-performance
    - run:
        name: Reject the idle loop's re-reads of main before the fix (control)
        no_output_timeout: 20m
        command: bash .circleci/performance-control.sh
    - store_artifacts:
        path: /tmp/performance
        destination: performance
    - architect/go-cache-save

  test-envtest:
    docker:
    - image: gsoci.azurecr.io/giantswarm/architect:8.6.47
      entrypoint: /bin/bash
    - image: gsoci.azurecr.io/giantswarm/postgres:18.6-alpine
      environment:
        POSTGRES_HOST_AUTH_METHOD: trust
    environment:
      BEEKEEPER_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    resource_class: medium
    steps:
    - checkout
    - architect/tools-info
    - architect/go-cache-restore
    - run:
        name: Check the CRDs are generated from pkg/apis
        command: make check-crds
    - run:
        name: Wait for the Postgres
        command: for i in $(seq 60); do (echo > /dev/tcp/localhost/5432) 2>/dev/null && exit 0; sleep 1; done; exit 1
    - run:
        name: Run the envtest-backed and Postgres-backed tests (the Kubernetes store, serve, the mailboxes)
        command: make test-envtest
    - architect/go-cache-save

  test-stable-version:
    docker:
    - image: gsoci.azurecr.io/giantswarm/architect:8.6.47
      entrypoint: /bin/bash
    resource_class: medium
    steps:
    - checkout
    - architect/tools-info
    - architect/go-cache-restore
    - run:
        name: Run the unit tests linked with a stable release's version, as a stable tag's go-build does
        command: make test VERSION=v1.0.0

  chart-test:
    docker:
    - image: cimg/base:current
    resource_class: small
    environment:
      HELM_VERSION: v3.16.0
    steps:
    - checkout
    - run:
        name: Install helm
        command: |
          set -euxo pipefail
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short
    - run:
        name: Lint the chart and run its unit tests
        command: make helm-test

  publish-canary-evidence:
    docker:
    - image: gsoci.azurecr.io/giantswarm/architect:8.6.47
      entrypoint: /bin/bash
    resource_class: medium
    environment:
      LANG: C.UTF-8
    steps:
    - checkout
    - attach_workspace:
        at: .
    - run:
        name: Apply shared sandbox proof policy
        command: |
          case "$(cat internal/update/sandbox-proof-required.txt)" in
            false) echo "Sandbox proof publication temporarily disabled"; circleci-agent step halt ;;
            true) ;;
            *) echo "Invalid sandbox proof policy" >&2; exit 1 ;;
          esac
    - architect/tools-info
    - run:
        name: Retry transient Rekor conflict lookups during blob signing
        command: |
          mkdir -p /tmp/beekeeper-cosign-bin
          printf 'export BEEKEEPER_COSIGN_BINARY=%q\n' "$(command -v cosign)" >> "$BASH_ENV"
          cp .circleci/cosign-retry.sh /tmp/beekeeper-cosign-bin/cosign
          chmod 0755 /tmp/beekeeper-cosign-bin/cosign
          echo 'export PATH=/tmp/beekeeper-cosign-bin:$PATH' >> "$BASH_ENV"
    - run:
        name: Run staged sandbox canary on release candidate and build evidence blobs
        no_output_timeout: 10m
        command: bash .circleci/publish-canary-evidence.sh
    - architect/cosign-sign-verify:
        kind: blob
        refs_file: /tmp/.cosign_canary_blobs
    - architect/generate-github-token
    - run:
        name: Upload signed canary evidence to GitHub Release
        command: |
          set -euo pipefail
          for b in ./beekeeper-*-*.canary.json.bundle; do
            cp "$b" /tmp/canary-artifacts/
          done
          gh release upload "$CIRCLE_TAG" ./beekeeper-*-*.canary.json ./beekeeper-*-*.canary.json.bundle --clobber
    - store_artifacts:
        path: /tmp/canary-artifacts
        destination: canary-evidence

workflows:
  build:
    jobs:
    - test-large-history:
        filters:
          tags:
            only: /^v.*/
    - test-performance:
        filters:
          tags:
            only: /^v.*/
    - test-envtest:
        filters:
          tags:
            only: /^v.*/
    # No path or branch filters: loop, merge, capacity, watch, update and CI
    # changes all run the same check. Tags also exercise it before release.
    - test-loop-workflow:
        filters:
          tags:
            only: /^v.*/
    - test-stable-version
    - chart-test:
        filters:
          tags:
            only: /^v.*/
    - publish-canary-evidence:
        context: architect
        requires:
        - go-build
        - test-loop-workflow
        - upload-release-assets
        filters:
          branches:
            ignore: /.*/
          tags:
            only: /^v.*/
