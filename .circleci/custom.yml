# Repo-specific CircleCI jobs, merged into the generated workflows.yml by the
# setup workflow in config.yml.
#
# The generated go-build job runs only `make test`, where the envtest-backed
# tests of the Kubernetes store skip without KUBEBUILDER_ASSETS and the
# mailbox tests without BEEKEEPER_TEST_DATABASE_URL. This job runs them
# against a real kube-apiserver from setup-envtest and a Postgres beside it,
# after checking that the committed CRDs are what pkg/apis generates. Its
# first image is the one the architect orb's executor runs.
#
# chart-test lints helm/beekeeper and runs its helm-unittest suites, in a plain
# container: the dependencies are helm and its plugin, not Go tooling. The
# versions are pinned so a plugin release cannot turn an unrelated PR red.
version: 2.1

jobs:
  test-envtest:
    docker:
    - image: gsoci.azurecr.io/giantswarm/architect:8.5.0
      entrypoint: /bin/bash
    - image: gsoci.azurecr.io/giantswarm/postgres:18.6-alpine
      environment:
        POSTGRES_HOST_AUTH_METHOD: trust
    environment:
      BEEKEEPER_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    resource_class: medium
    steps:
    - checkout
    - architect/tools-info
    - architect/go-cache-restore
    - run:
        name: Check the CRDs are generated from pkg/apis
        command: make check-crds
    - run:
        name: Wait for the Postgres
        command: for i in $(seq 60); do (echo > /dev/tcp/localhost/5432) 2>/dev/null && exit 0; sleep 1; done; exit 1
    - run:
        name: Run the envtest-backed and Postgres-backed tests (the Kubernetes store, serve, the mailboxes)
        command: make test-envtest
    - architect/go-cache-save

  chart-test:
    docker:
    - image: cimg/base:current
    resource_class: small
    environment:
      HELM_VERSION: v3.16.0
    steps:
    - checkout
    - run:
        name: Install helm
        command: |
          set -euxo pipefail
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short
    - run:
        name: Lint the chart and run its unit tests
        command: make helm-test

workflows:
  build:
    jobs:
    - test-envtest:
        filters:
          tags:
            only: /^v.*/
    - chart-test:
        filters:
          tags:
            only: /^v.*/
