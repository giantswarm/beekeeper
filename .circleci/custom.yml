# Repo-specific CircleCI jobs, merged into the generated workflows.yml by the
# setup workflow in config.yml (lists append, maps merge).
#
# The repository's ruleset requires these job names; each runs a real part of
# the engine's suite (docs/phase1/plan.md §9):
#
#   go-build            generated: `make test` (unit tests, scenarios, RBAC
#                       envtest, helm-unittest) and the cross-builds. It runs
#                       as root in the architect image, so Makefile.custom.mk
#                       runs each test binary as nobody there (initdb refuses
#                       root) and fetches the test binaries first.
#   test-loop-workflow  the whole suite, the scenarios included, with -race
#   test-envtest        the CRDs against api/ (make check-crds) and the RBAC
#                       tests against envtest's kube-apiserver
#   test-large-history  replay over a generated history of 10,000 decisions
#   test-stable-version promtool tests of every alert rule, and helm lint and
#                       template with production-like values
#   chart-test          the chart's own tests: helm lint and helm-unittest
#
# The jobs run in cimg/go (Ubuntu, a C toolchain for -race, a user that is not
# root for the embedded Postgres). Each job caches the Go modules and build
# cache by go.sum, and its test binaries (~/.cache/beekeeper/test-deps) by
# their versions (make test-deps-versions).
version: 2.1

commands:
  beekeeper-prepare:
    description: Check out, restore the caches, install helm and fetch the test binaries.
    parameters:
      deps:
        description: The make target that fetches the job's test binaries.
        type: string
        default: test-deps
    steps:
      - checkout
      - run:
          name: Key the caches
          command: |
            set -euo pipefail
            make -s test-deps-versions > /tmp/beekeeper-test-deps.key
            cat /tmp/beekeeper-test-deps.key
      - restore_cache:
          keys:
            - beekeeper-go-v1-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-{{ checksum "go.sum" }}
            - beekeeper-go-v1-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-
      - restore_cache:
          keys:
            - beekeeper-test-deps-v1-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-{{ checksum "/tmp/beekeeper-test-deps.key" }}
      - run:
          name: Install helm
          environment:
            # renovate: datasource=github-releases depName=helm/helm
            HELM_VERSION: v3.22.1
          command: |
            set -euo pipefail
            tgz="helm-${HELM_VERSION}-linux-amd64.tar.gz"
            curl -sSfL --retry 3 -o "/tmp/$tgz" "https://get.helm.sh/$tgz"
            echo "$(curl -sSfL --retry 3 "https://get.helm.sh/$tgz.sha256sum" | cut -d' ' -f1)  /tmp/$tgz" | sha256sum -c -
            tar -xzf "/tmp/$tgz" -C /tmp linux-amd64/helm
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            helm version --short
      - run:
          name: Fetch the test binaries
          command: make << parameters.deps >>

  beekeeper-save:
    description: Save the Go and test-deps caches.
    steps:
      - save_cache:
          key: beekeeper-go-v1-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-{{ checksum "go.sum" }}
          paths:
            - ~/go/pkg/mod
            - ~/.cache/go-build
      - save_cache:
          key: beekeeper-test-deps-v1-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-{{ checksum "/tmp/beekeeper-test-deps.key" }}
          paths:
            - ~/.cache/beekeeper/test-deps

jobs:
  test-loop-workflow:
    docker:
      - image: cimg/go:1.27.4
    resource_class: large
    steps:
      - beekeeper-prepare
      - run:
          name: Run every test, the scenarios included, with the race detector
          no_output_timeout: 20m
          command: make test-race
      - beekeeper-save

  test-envtest:
    docker:
      - image: cimg/go:1.27.4
    resource_class: medium
    steps:
      - beekeeper-prepare
      - run:
          name: Check the CRDs (config/crd, the chart's copy) and deepcopy code against api/
          command: make check-crds
      - run:
          name: Test the chart's RBAC against envtest's kube-apiserver
          command: make test-envtest
      - beekeeper-save

  test-large-history:
    docker:
      - image: cimg/go:1.27.4
    resource_class: medium
    steps:
      - beekeeper-prepare
      - run:
          name: Replay a generated history of 10,000 decisions
          no_output_timeout: 20m
          command: make test-large-history
      - beekeeper-save

  test-stable-version:
    docker:
      - image: cimg/go:1.27.4
    resource_class: medium
    steps:
      - beekeeper-prepare:
          deps: test-deps-versions
      - run:
          name: Test every alert rule with promtool
          command: make test-alerts
      - run:
          name: Lint and render the chart with production-like values
          command: make helm-template-prod
      - beekeeper-save

  chart-test:
    docker:
      - image: cimg/go:1.27.4
    resource_class: small
    steps:
      - beekeeper-prepare:
          deps: test-deps-versions
      - run:
          name: Lint the chart and run its unit tests (helm-unittest)
          command: |
            set -euo pipefail
            helm lint --strict helm/beekeeper
            helm lint --strict helm/beekeeper --values helm/beekeeper/ci/ci-values.yaml
            make helm-test
      - beekeeper-save

workflows:
  build:
    jobs:
      - test-loop-workflow:
          filters:
            tags:
              only: /^v.*/
      - test-envtest:
          filters:
            tags:
              only: /^v.*/
      - test-large-history:
          filters:
            tags:
              only: /^v.*/
      - test-stable-version:
          filters:
            tags:
              only: /^v.*/
      - chart-test:
          filters:
            tags:
              only: /^v.*/
