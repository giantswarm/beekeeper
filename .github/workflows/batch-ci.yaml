name: batch-ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: batch-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  batch-ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the batch gate
        run: node --test .github/batch-ci.test.cjs
      - name: Admit a PR or verify full CI on the queue commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {run} = require('./.github/batch-ci.cjs');
            await run({github, context, core});
