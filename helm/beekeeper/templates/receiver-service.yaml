apiVersion: v1
kind: Service
metadata:
  name: {{ include "beekeeper.receiver.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "beekeeper.receiver.labels" . | nindent 4 }}
  {{- with .Values.receiver.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "beekeeper.receiver.selectorLabels" . | nindent 4 }}
  ports:
    # Only the webhook port: metrics and health stay off the route.
    - name: webhook
      port: {{ .Values.receiver.service.port }}
      targetPort: webhook
      protocol: TCP
