apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "beekeeper.engine.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "beekeeper.engine.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.engineAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
# The receiver's identity. No Role binds it: it may do nothing in Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "beekeeper.receiver.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "beekeeper.receiver.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.receiverAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
