apiVersion: v1
kind: Service
metadata:
  name: {{ include "beekeeper.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "beekeeper.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "beekeeper.selectorLabels" . | nindent 4 }}
