apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beekeeper.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "beekeeper.labels" . | nindent 4 }}
spec:
  # One instance: the subscriptions and the mailbox expiry are in-process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "beekeeper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beekeeper.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "beekeeper.name" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: beekeeper
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --http=:{{ .Values.service.port }}
          env:
            - name: BEEKEEPER_CONFIG
              value: /etc/beekeeper/config.yaml
            - name: HOME
              value: /tmp
            {{- with .Values.database.secretName }}
            - name: BEEKEEPER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.database.secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/beekeeper
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.serve.gateway.url }}
            - name: klaus-gateway-token
              mountPath: {{ dir .Values.serve.gateway.tokenFile }}
              readOnly: true
            {{- end }}
            {{- if .Values.serve.identity.connectorID }}
            - name: dex-token
              mountPath: {{ dir .Values.serve.identity.tokenFile }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "beekeeper.name" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.serve.gateway.url }}
        # klaus-gateway admits beekeeper by this token (TokenReview).
        - name: klaus-gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: klaus-gateway
                  expirationSeconds: 3600
                  path: {{ base .Values.serve.gateway.tokenFile }}
        {{- end }}
        {{- if .Values.serve.identity.connectorID }}
        # Exchanged at Dex for serve's own Dex identity toward muster.
        - name: dex-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ required "serve.issuer: the Dex serve.identity is exchanged at" .Values.serve.issuer }}
                  expirationSeconds: 3600
                  path: {{ base .Values.serve.identity.tokenFile }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
