# The engine's permissions, all in its own namespace: nothing cluster-wide.
# Its cache watches this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "beekeeper.engine.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "beekeeper.engine.labels" . | nindent 4 }}
rules:
  # Engine-owned state: everything in status, identity in labels.
  - apiGroups: ["beekeeper.giantswarm.io"]
    resources: ["items", "changes", "budgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Configuration, applied by the deployment (GitOps): the engine only reads it.
  - apiGroups: ["beekeeper.giantswarm.io"]
    resources: ["installations", "teams", "people"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["beekeeper.giantswarm.io"]
    resources:
      - items/status
      - changes/status
      - budgets/status
      - installations/status
      - teams/status
      - people/status
    verbs: ["get", "update", "patch"]
  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "beekeeper.engine.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "beekeeper.engine.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "beekeeper.engine.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "beekeeper.engine.name" . }}
    namespace: {{ .Release.Namespace }}
