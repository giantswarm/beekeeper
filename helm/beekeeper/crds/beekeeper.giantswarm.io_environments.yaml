---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: environments.beekeeper.giantswarm.io
spec:
  group: beekeeper.giantswarm.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    shortNames:
    - env
    singular: environment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.holder.party.name
      name: Holder
      type: string
    - jsonPath: .status.holder.purpose
      name: Purpose
      type: string
    - jsonPath: .status.holder.since
      name: Since
      type: date
    - jsonPath: .status.upgrade.to
      name: Upgrade
      type: string
    - jsonPath: .status.queueLength
      name: Queue
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is one Giant Swarm installation shared by every team.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentSpec declares one Giant Swarm installation.
            properties:
              alertFloor:
                description: AlertFloor is the lowest severity the watch reports.
                type: string
              installation:
                description: Installation is the installation's name.
                type: string
              musterCluster:
                description: MusterCluster is the cluster name muster reaches the
                  installation by.
                type: string
              team:
                description: Team owns the installation.
                type: string
            required:
            - installation
            type: object
          status:
            description: EnvironmentStatus is who holds the installation and what
              waits on it.
            properties:
              alerts:
                additionalProperties:
                  type: integer
                description: |-
                  Alerts counts the firing alerts per severity; the alerts stay in
                  Alertmanager.
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              holder:
                description: Holder is nil while the Environment is free.
                properties:
                  party:
                    description: |-
                      Party names a session or a person: whose agent, of which team, on which
                      host.
                    properties:
                      host:
                        description: Host is the machine or installation the party
                          runs on.
                        type: string
                      hostSession:
                        description: HostSession is the desktop app's id for the session.
                        type: string
                      name:
                        description: Name is the session's name, or the person's.
                        type: string
                      person:
                        description: Person is the verified email of the person whose
                          agent the party is.
                        type: string
                      session:
                        description: Session is the Claude Code session id.
                        type: string
                      team:
                        description: Team is the person's team.
                        type: string
                    required:
                    - name
                    type: object
                  purpose:
                    type: string
                  since:
                    format: date-time
                    type: string
                  upgradeUnblock:
                    description: |-
                      UpgradeUnblock is the reason of the upgrade-unblock grant the claim was
                      admitted by during an upgrade.
                    type: string
                required:
                - party
                - purpose
                - since
                type: object
              holds:
                description: Holds names the active Holds on the Environment.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              queue:
                description: Queue are the grants waiting for a claim, oldest first.
                items:
                  description: |-
                    Grant is the supervisor's word that a party may claim an Environment, in
                    the order the grants were given.
                  properties:
                    at:
                      format: date-time
                      type: string
                    by:
                      description: |-
                        Party names a session or a person: whose agent, of which team, on which
                        host.
                      properties:
                        host:
                          description: Host is the machine or installation the party
                            runs on.
                          type: string
                        hostSession:
                          description: HostSession is the desktop app's id for the
                            session.
                          type: string
                        name:
                          description: Name is the session's name, or the person's.
                          type: string
                        person:
                          description: Person is the verified email of the person
                            whose agent the party is.
                          type: string
                        session:
                          description: Session is the Claude Code session id.
                          type: string
                        team:
                          description: Team is the person's team.
                          type: string
                      required:
                      - name
                      type: object
                    to:
                      description: |-
                        Party names a session or a person: whose agent, of which team, on which
                        host.
                      properties:
                        host:
                          description: Host is the machine or installation the party
                            runs on.
                          type: string
                        hostSession:
                          description: HostSession is the desktop app's id for the
                            session.
                          type: string
                        name:
                          description: Name is the session's name, or the person's.
                          type: string
                        person:
                          description: Person is the verified email of the person
                            whose agent the party is.
                          type: string
                        session:
                          description: Session is the Claude Code session id.
                          type: string
                        team:
                          description: Team is the person's team.
                          type: string
                      required:
                      - name
                      type: object
                    upgradeUnblock:
                      description: |-
                        UpgradeUnblock is why the supervisor granted a claim the upgrade hold
                        admits: the work that unblocks the upgrade.
                      type: string
                  required:
                  - at
                  - by
                  - to
                  type: object
                maxItems: 20
                type: array
              queueLength:
                description: QueueLength is len(Queue), for the printer column.
                type: integer
              released:
                description: |-
                  Released is when the Environment was last released; a grant's TTL runs
                  from the later of it and the grant.
                format: date-time
                type: string
              upgrade:
                description: Upgrade is a cluster upgrade running on an Environment.
                properties:
                  since:
                    format: date-time
                    type: string
                  to:
                    description: To is the target release.
                    type: string
                required:
                - since
                - to
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
