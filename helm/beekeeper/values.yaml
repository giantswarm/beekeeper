image:
  registry: gsoci.azurecr.io
  repository: giantswarm/beekeeper
  # Empty: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# beekeeper serve's configuration (the serve: section of its config.yaml).
# Every caller's Dex ID token is checked against issuer and clientIDs; the
# caller must carry the organization group and a group teams names.
serve:
  # The Dex issuer URL, e.g. https://dex.<installation base domain>.
  issuer: ""
  # The audiences accepted: the client muster forwards the person's token for.
  clientIDs: []  # @schema item: string
  # The Dex group every member of the organization carries.
  organization: ""
  # Further groups that make a caller a member, one per Dex connector that
  # spells the organization differently (a GitHub org's <org>:<team>, a
  # directory's group name). A refused caller's log line names the groups its
  # token carries.
  organizations: []  # @schema item: string
  # Dex group -> team. Each team gets its namespace, beekeeper-<team>, for its
  # notes and agents (teamNamespaces.create).
  teams: {}  # @schema additionalProperties: true
  # Team -> the Dex group of its supervisor role (may release the team's
  # leases and lift its holds).
  supervisors: {}  # @schema additionalProperties: true
  # The URL of the muster (its /mcp) a send_message to a kagent: address goes
  # through, as the caller.
  muster: ""
  # Installation -> the muster tool of its kagent MCP server's
  # invoke_agent_instance.
  kagent: {}  # @schema additionalProperties: true
  # Name -> email: the people decisions are filed for (note add --for <name>).
  people: {}  # @schema additionalProperties: true
  # Team -> the Slack channel ID its decisions (--for team:<name>) go to.
  channels: {}  # @schema additionalProperties: true
  # klaus-gateway, which puts decisions to their addressee in Slack.
  gateway:
    # Its base URL; empty keeps decisions in beekeeper and mounts no token.
    url: ""
    # Where the projected ServiceAccount token (audience klaus-gateway) is
    # mounted.
    tokenFile: /var/run/secrets/klaus-gateway/token
    # The muster tool an answer in Slack calls, as the person who answers.
    answerTool: x_beekeeper_note_answer
    # The muster tool a person's reply in a conversation with one of their
    # agents calls, as the person.
    sendTool: x_beekeeper_send_message
  # serve's own identity toward muster, for the calls no person makes (the
  # fleet watch's reads): its projected ServiceAccount token (audience: the
  # issuer) exchanged at the issuer's Dex (RFC 8693) for a short-lived Dex ID
  # token. Empty connectorID mounts no token.
  identity:
    # The Dex connector that trusts the cluster's ServiceAccount issuer.
    connectorID: ""
    # The public Dex client the exchange is made as.
    clientID: ""
    # The Dex client the issued token is for (cross-client scope; that client
    # trusts clientID as a peer), e.g. dex-k8s-authenticator. Empty: clientID.
    audience: ""
    # Where the projected ServiceAccount token is mounted.
    tokenFile: /var/run/secrets/dex/token

# The watch serve runs in-process (the watch: section of its config.yaml).
watch:
  # How often the watch reads; a Go duration.
  interval: 30s

# The installations serve coordinates, one cluster-scoped Environment each: a
# lease claim names one, and a name none carries is refused. Each entry:
# name, and optionally installation (default: name), musterCluster, team
# (the owning team, whose supervisors may release another person's lease)
# and alertFloor.
environments: []  # @schema item: object; itemProperties: {name: {type: string}, installation: {type: string}, musterCluster: {type: string}, team: {type: string}, alertFloor: {type: string}}

# The merge lanes, one cluster-scoped MergeLane each: name, installation and
# the repositories whose merges roll onto it, merged one at a time.
lanes: []  # @schema item: object; itemProperties: {name: {type: string}, installation: {type: string}, repositories: {type: array, items: {type: string}}}

# The beekeeper database the mailboxes live in: a Secret key holding its URL
# (BEEKEEPER_DATABASE_URL), e.g. the <cluster>-app Secret CloudNativePG
# writes for the database's role.
database:
  secretName: ""
  secretKey: uri

# Create the namespace beekeeper-<team> of every team in serve.teams. The
# namespaces outlive an uninstall: they hold the teams' notes.
teamNamespaces:
  create: true

rbac:
  # Groups granted read access to every beekeeper.giantswarm.io resource. The
  # read ClusterRole also aggregates into the cluster's view role. Writes go
  # through serve's tools only.
  readerGroups: []  # @schema item: string

serviceAccount:
  # Annotations on beekeeper's ServiceAccount, its only non-human identity.
  annotations: {}  # @schema additionalProperties: true

service:
  port: 8080

# serve's /mcp behind a Gateway API Gateway, for the musters of other
# installations. Off: serve is reached in-cluster only.
httpRoute:
  enabled: false
  hostnames: []  # @schema item: string
  # e.g. [{name: giantswarm-default, namespace: envoy-gateway-system}]
  parentRefs: []  # @schema item: object; itemProperties: {group: {type: string}, kind: {type: string}, name: {type: string}, namespace: {type: string}, sectionName: {type: string}, port: {type: integer}}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Further environment variables, volumes and mounts of serve's container,
# and init containers of its pod (a sidecar is one with restartPolicy
# Always): a private CA for the issuer (SSL_CERT_FILE), a local proxy to it.
extraEnv: []  # @schema item: object; itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.EnvVar
extraVolumes: []  # @schema item: object; itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Volume
extraVolumeMounts: []  # @schema item: object; itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.VolumeMount
initContainers: []  # @schema item: object; itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Container

nodeSelector: {}  # @schema additionalProperties: true
tolerations: []  # @schema item: object
affinity: {}  # @schema additionalProperties: true
