# The chart's CRDs are in crds/, which Helm installs once and never upgrades. A HelmRelease
# (Flux) must set install.crds and upgrade.crds to CreateReplace, so a new chart version's
# schema reaches the cluster; with plain Helm, apply crds/ before every upgrade.

# -- The prefix of every object's name. Empty: the release's name.
fullnameOverride: ""

image:
  # -- The registry of the beekeeper image.
  registry: gsoci.azurecr.io
  # -- The repository of the beekeeper image.
  repository: giantswarm/beekeeper
  # -- The image tag. Empty: the chart's appVersion.
  tag: ""
  # -- The image pull policy.
  pullPolicy: IfNotPresent

# -- The names of the Secrets every pod pulls its image with.
imagePullSecrets: []  # @schema item: string

github:
  # -- GitHub's REST API (GraphQL at <apiURL>/graphql).
  apiURL: https://api.github.com
  app:
    # -- The Secret holding the GitHub App's id, its installation's id and its private key. Empty: <fullname>-github-app.
    secretName: ""
    # -- The key of the App's id.
    appIDKey: app-id
    # -- The key of the id of the App's installation on the org.
    installationIDKey: installation-id
    # -- The key of the App's private key (PEM).
    privateKeyKey: private-key.pem

webhook:
  # -- The Secret holding the GitHub App's webhook secret, which the receiver checks X-Hub-Signature-256 with. Empty: <fullname>-webhook.
  secretName: ""
  # -- The key of the webhook secret.
  secretKey: secret

jev:
  # -- Ask JEV at the decision points in shadow mode. Off: the engine asks no JEV and mounts no key.
  enabled: true
  # -- The Secret holding the JEV API key. Empty: <fullname>-jev.
  secretName: ""
  # -- The key of the JEV API key.
  secretKey: key

postgres:
  # -- The CloudNativePG Cluster, which the host, the engine's Secret and the Postgres network policy derive from. Empty: <fullname>-db.
  cluster: ""
  # -- The Postgres host. Empty: <cluster>-rw, the Cluster's read-write Service.
  host: ""
  # -- The Postgres port.
  port: 5432
  # -- The database, owned by the role engine. The migrations grant the roles engine and receiver their privileges.
  database: beekeeper
  # -- libpq's sslmode. CloudNativePG serves TLS with its own CA.
  sslMode: require
  engine:
    # -- The basic-auth Secret of the role engine, the owner (it migrates). Empty: <cluster>-app, CloudNativePG's.
    secretName: ""
    # -- The key of the role's name.
    usernameKey: username
    # -- The key of the role's password.
    passwordKey: password
  receiver:
    # -- The basic-auth Secret of the role receiver, which may only insert into the inbox. Empty: <cluster>-receiver.
    secretName: ""
    # -- The key of the role's name.
    usernameKey: username
    # -- The key of the role's password.
    passwordKey: password

engine:
  # -- Engine replicas. One leads (leader election) and decides; every one serves metrics.
  replicas: 2
  # -- The Lease the replicas elect their leader with. Empty: <fullname>-engine.
  leaderElectionID: ""
  # -- The log level (debug, info, error).
  logLevel: info
  ports:
    # -- The metrics port (/metrics).
    metrics: 8080
    # -- The health port (/healthz, /readyz).
    health: 8081
  # -- The engine container's resources.
  resources:  # @schema additionalProperties: true
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  migrate:
    # -- The resources of the init container that runs `beekeeper migrate`.
    resources:  # @schema additionalProperties: true
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  # -- Further arguments of `beekeeper engine`.
  extraArgs: []  # @schema item: string
  # -- Further environment variables of the engine container.
  extraEnv: []  # @schema item: object; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}
  # -- Annotations of the engine pods.
  podAnnotations: {}  # @schema additionalProperties: true
  # -- Further labels of the engine pods.
  podLabels: {}  # @schema additionalProperties: true
  # -- The engine pods' node selector.
  nodeSelector: {}  # @schema additionalProperties: true
  # -- The engine pods' tolerations.
  tolerations: []  # @schema item: object
  # -- The engine pods' affinity. Empty: a soft anti-affinity that spreads the replicas over nodes.
  affinity: {}  # @schema additionalProperties: true
  # -- The engine pods' topology spread constraints.
  topologySpreadConstraints: []  # @schema item: object

receiver:
  # -- Receiver replicas. Each stores a verified delivery in the Postgres inbox before it answers.
  replicas: 2
  # -- The only path the receiver answers, with POST.
  path: /github/webhook
  # -- The largest body the receiver accepts, in bytes (inclusive).
  maxBodyBytes: 10485760
  # -- The bodies a receiver holds at once, in bytes by their declared size (at least maxBodyBytes): a delivery that doesn't fit is answered 503 before its body is read, so unsigned bodies can't exhaust the memory limit. Default: four of the largest.
  maxInFlightBytes: 41943040  # @schema minimum: 0
  # -- Required in production: the node ids of the boards (ProjectV2, PVT_...) the engine observes. Empty: every board's item deliveries are stored.
  projectNodeIDs: []  # @schema item: string; uniqueItems: true
  # -- The log level (debug, info, error).
  logLevel: info
  ports:
    # -- The webhook port, the only one the public route reaches.
    webhook: 8080
    # -- The metrics and health port (/metrics, /healthz, /readyz).
    metrics: 8081
  service:
    # -- The receiver Service's port, the backend of the webhook route.
    port: 8080
    # -- Annotations of the receiver Service.
    annotations: {}  # @schema additionalProperties: true
  # -- The receiver container's resources.
  resources:  # @schema additionalProperties: true
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # -- Further arguments of `beekeeper receiver`.
  extraArgs: []  # @schema item: string
  # -- Further environment variables of the receiver container.
  extraEnv: []  # @schema item: object; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}
  # -- Annotations of the receiver pods.
  podAnnotations: {}  # @schema additionalProperties: true
  # -- Further labels of the receiver pods.
  podLabels: {}  # @schema additionalProperties: true
  # -- The receiver pods' node selector.
  nodeSelector: {}  # @schema additionalProperties: true
  # -- The receiver pods' tolerations.
  tolerations: []  # @schema item: object
  # -- The receiver pods' affinity. Empty: a soft anti-affinity that spreads the replicas over nodes.
  affinity: {}  # @schema additionalProperties: true
  # -- The receiver pods' topology spread constraints.
  topologySpreadConstraints: []  # @schema item: object

serviceAccount:
  # -- Annotations of the engine's ServiceAccount.
  engineAnnotations: {}  # @schema additionalProperties: true
  # -- Annotations of the receiver's ServiceAccount, which may do nothing in Kubernetes.
  receiverAnnotations: {}  # @schema additionalProperties: true

# -- The pod security context of every pod.
podSecurityContext:  # @schema additionalProperties: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- The security context of every container.
securityContext:  # @schema additionalProperties: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podMonitor:
  # -- Create a PodMonitor (prometheus-operator) for the engine and one for the receiver.
  enabled: true
  # -- Labels a Prometheus selects PodMonitors by, e.g. release: kube-prometheus-stack.
  labels: {}  # @schema additionalProperties: true
  # -- The scrape interval.
  interval: 30s

prometheusRule:
  # -- Create the alert rules (a PrometheusRule).
  enabled: true
  # -- Labels a Prometheus selects rules by, e.g. release: kube-prometheus-stack.
  labels: {}  # @schema additionalProperties: true
  # -- Labels on every alert, e.g. cluster, layer and component.
  alertLabels: {}  # @schema additionalProperties: true
  # -- A runbook's URL. Each alert links <runbookURL>#<alert name in lower case>. Empty: no links.
  runbookURL: ""
  severities:
    # -- BeekeeperInvariantViolated: an invariant is violated for 10 minutes.
    invariantViolated: warning
    # -- BeekeeperInvariantsMissing: the engine is up but exports no invariants.
    invariantsMissing: warning
    # -- BeekeeperReconcileErrors: a reconciler fails for 15 minutes.
    reconcileErrors: warning
    # -- BeekeeperNoLeader: replicas are up, none leads.
    noLeader: warning
    # -- BeekeeperEngineDown: no engine replica is scraped.
    engineDown: warning
    # -- BeekeeperReceiverDown: no receiver replica is scraped.
    receiverDown: warning
    # -- BeekeeperReceiverUnavailable: the receiver answers 503 for 10 minutes.
    receiverUnavailable: warning
    # -- BeekeeperSourceDegraded: a source is degraded for 30 minutes.
    sourceDegraded: warning
    # -- BeekeeperHistoryDropped: history rows were dropped.
    historyDropped: warning
  watchdog:
    # -- An alert that fires while an engine replica leads, for a dead-man's switch.
    enabled: true
    # -- Labels of the watchdog alert, e.g. the one your Alertmanager routes to the dead-man's switch.
    labels: {}  # @schema additionalProperties: true
  selectors:
    # -- The PromQL selector of the engine's series. Empty: its namespace and the job of its PodMonitor.
    engine: ""
    # -- The PromQL selector of the receiver's series. Empty: its namespace and the job of its PodMonitor.
    receiver: ""

ciliumNetworkPolicies:
  # -- Create CiliumNetworkPolicies for the engine, the receiver and (postgres.enabled) Postgres. A cluster with a default-deny policy needs them.
  enabled: false
  # -- The authentication mode of every fromEndpoints ingress rule (Cilium mutual authentication). Empty: none.
  authenticationMode: required
  # -- The entities kubelet probes come from.
  probeEntities:  # @schema item: string
    - host
  prometheus:
    # -- The Prometheus pods' labels. Empty: no scrapes.
    selector:  # @schema additionalProperties: true
      io.kubernetes.pod.namespace: monitoring
      app.kubernetes.io/name: prometheus
  gateway:
    # -- The pods of the gateway the webhook route goes through. Empty: no webhooks.
    selector:  # @schema additionalProperties: true
      io.kubernetes.pod.namespace: envoy-gateway-system
  dns:
    # -- The labels of the cluster's DNS pods.
    selector:  # @schema additionalProperties: true
      io.kubernetes.pod.namespace: kube-system
      k8s-app: kube-dns
    # -- The DNS pods' ports (UDP and TCP).
    ports:  # @schema item: integer
      - 53
      - 1053
  engine:
    # -- The hosts the engine reaches over HTTPS: GitHub's API and JEV.
    fqdns:  # @schema item: string
      - api.github.com
      - api.typesafe.ai
  postgres:
    # -- Create the policy of the Postgres pods too.
    enabled: true
    # -- The labels of the Postgres pods. Empty: cnpg.io/cluster: <postgres.cluster>.
    selector: {}  # @schema additionalProperties: true
    # -- The operator's pods.
    operatorSelector:  # @schema additionalProperties: true
      io.kubernetes.pod.namespace: cnpg-system
      app.kubernetes.io/name: cloudnative-pg
    # -- The instance manager's status port (the operator and kubelet probes).
    statusPort: 8000
    # -- The instance manager's metrics port.
    metricsPort: 9187
