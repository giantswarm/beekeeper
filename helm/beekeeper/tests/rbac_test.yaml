suite: rbac
templates:
  - rbac.yaml
  - serviceaccounts.yaml
release:
  name: beekeeper
  namespace: beekeeper
tests:
  - it: grants the engine its kinds, its leader Lease and events in its namespace only
    template: rbac.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: beekeeper
      - equal:
          path: rules
          value:
            - apiGroups: ["beekeeper.giantswarm.io"]
              resources: ["items", "changes", "budgets"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["beekeeper.giantswarm.io"]
              resources: ["installations", "teams", "people"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["beekeeper.giantswarm.io"]
              resources:
                - items/status
                - changes/status
                - budgets/status
                - installations/status
                - teams/status
                - people/status
              verbs: ["get", "update", "patch"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "create", "update"]
            - apiGroups: ["", "events.k8s.io"]
              resources: ["events"]
              verbs: ["create", "patch"]

  - it: binds the Role to the engine's ServiceAccount alone
    template: rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: beekeeper-engine
              namespace: beekeeper

  - it: renders nothing cluster-wide
    template: rbac.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: gives the receiver a ServiceAccount without a token
    template: serviceaccounts.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: beekeeper-receiver
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: gives the engine a ServiceAccount with a token
    template: serviceaccounts.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: beekeeper-engine
      - equal:
          path: automountServiceAccountToken
          value: true
