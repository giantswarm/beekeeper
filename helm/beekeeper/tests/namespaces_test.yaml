suite: team namespaces
templates:
  - namespaces.yaml
tests:
  - it: creates one kept namespace per distinct team, named as the store names it
    set:
      serve.teams:
        gs-bumblebee: Bumblebee
        gs-bumblebee-admins: bumblebee
        gs-shield: Team Shield
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: beekeeper-bumblebee
        documentIndex: 0
      - equal:
          path: metadata.name
          value: beekeeper-team-shield
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
  - it: creates none when turned off
    set:
      serve.teams: {gs-bumblebee: bumblebee}
      teamNamespaces.create: false
    asserts:
      - hasDocuments:
          count: 0
