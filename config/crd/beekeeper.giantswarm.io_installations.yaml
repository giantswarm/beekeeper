---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: installations.beekeeper.giantswarm.io
spec:
  group: beekeeper.giantswarm.io
  names:
    kind: Installation
    listKind: InstallationList
    plural: installations
    singular: installation
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Installation configures the engine for one GitHub org and board.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InstallationSpec is the engine's configuration for one GitHub
              org and its board.
            properties:
              board:
                description: BoardSpec names the ProjectV2 board.
                properties:
                  project:
                    type: integer
                required:
                - project
                type: object
              budget:
                description: BudgetSpec holds the API budget's reserve for observation.
                properties:
                  observationReserve:
                    description: ObservationReserve is the fraction of the limit observation
                      never spends.
                    type: number
                required:
                - observationReserve
                type: object
              decisionPoints:
                additionalProperties:
                  type: string
                type: object
              footprint:
                description: Footprint is the pattern of a footprint line in an issue
                  body.
                type: string
              freshness:
                description: FreshnessSpec holds the freshness check intervals.
                properties:
                  boardProbe:
                    type: string
                  deliveryLog:
                    type: string
                required:
                - boardProbe
                - deliveryLog
                type: object
              itemRetention:
                type: string
              jev:
                description: JEVSpec configures the JEV client.
                properties:
                  confidenceFloor:
                    type: number
                  timeout:
                    description: Timeout of one JEV call; defaults to 30s.
                    type: string
                  url:
                    description: URL defaults to https://api.typesafe.ai/v1/systemone.
                    type: string
                required:
                - confidenceFloor
                type: object
              mode:
                type: string
              org:
                type: string
              polling:
                description: PollingSpec holds the polling interval while a source
                  is degraded.
                properties:
                  interval:
                    type: string
                required:
                - interval
                type: object
              ready:
                description: ReadySpec holds the ready? rule's patterns.
                properties:
                  acceptanceCriteria:
                    type: string
                  planningRepos:
                    items:
                      type: string
                    type: array
                  targetRepo:
                    type: string
                  todo:
                    type: string
                required:
                - acceptanceCriteria
                - targetRepo
                - todo
                type: object
              receiver:
                description: ReceiverSpec configures the webhook receiver.
                properties:
                  maxBodyBytes:
                    format: int64
                    type: integer
                  path:
                    type: string
                required:
                - maxBodyBytes
                - path
                type: object
              resync:
                description: ResyncSpec holds the resync intervals.
                properties:
                  board:
                    type: string
                  changes:
                    type: string
                required:
                - board
                - changes
                type: object
              retry:
                description: RetrySpec is the transient-error backoff.
                properties:
                  cap:
                    type: string
                  initial:
                    type: string
                  jitter:
                    type: number
                required:
                - cap
                - initial
                type: object
              waits:
                description: WaitsSpec configures every wait.
                properties:
                  ci:
                    description: CIWaitSpec configures ci waits.
                    properties:
                      atDeadline:
                        type: string
                      deadlineFactor:
                        type: number
                      defaultDeadline:
                        type: string
                      minHistory:
                        type: integer
                    required:
                    - atDeadline
                    - deadlineFactor
                    - defaultDeadline
                    - minHistory
                    type: object
                  dependency:
                    description: FixedWaitSpec configures a wait with a fixed deadline.
                    properties:
                      atDeadline:
                        type: string
                      deadline:
                        type: string
                    required:
                    - atDeadline
                    - deadline
                    type: object
                  grace:
                    type: string
                  mergeResult:
                    description: FixedWaitSpec configures a wait with a fixed deadline.
                    properties:
                      atDeadline:
                        type: string
                      deadline:
                        type: string
                    required:
                    - atDeadline
                    - deadline
                    type: object
                  overdueBackoffCap:
                    type: string
                  review:
                    description: FixedWaitSpec configures a wait with a fixed deadline.
                    properties:
                      atDeadline:
                        type: string
                      deadline:
                        type: string
                    required:
                    - atDeadline
                    - deadline
                    type: object
                required:
                - ci
                - dependency
                - grace
                - mergeResult
                - overdueBackoffCap
                - review
                type: object
            required:
            - board
            - budget
            - footprint
            - freshness
            - itemRetention
            - jev
            - mode
            - org
            - polling
            - ready
            - receiver
            - resync
            - retry
            - waits
            type: object
          status:
            description: InstallationStatus is the engine's view of its sources and
              leadership.
            properties:
              boardResyncAt:
                description: BoardResyncAt is when the last board resync ran.
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastDecisionAt:
                format: date-time
                type: string
              leader:
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  describes.
                format: int64
                type: integer
              sources:
                additionalProperties:
                  description: SourceStatus is the freshness of one observation source.
                  properties:
                    checkedAt:
                      description: |-
                        CheckedAt is when the last freshness verdict was made, as of the last write of the status (an idle
                        check writes nothing, so it can be older than the verdict the leader holds in memory).
                      format: date-time
                      type: string
                    cursor:
                      description: |-
                        Cursor is the source's high-water mark: the last delivery log id seen (webhooks) or the newest
                        board item update reported by webhooks (board).
                      type: string
                    deliveredSinceGap:
                      description: DeliveredSinceGap is true once a delivery succeeded
                        after the last gap (webhooks).
                      type: boolean
                    lastGapAt:
                      description: |-
                        LastGapAt is when the last gap was found; the source is fresh again after a full check interval
                        without one.
                      format: date-time
                      type: string
                    polling:
                      type: boolean
                    reason:
                      type: string
                    since:
                      format: date-time
                      type: string
                    state:
                      description: State is fresh or degraded.
                      type: string
                  required:
                  - polling
                  - state
                  type: object
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
